name: PR339 canonical exact-head final v3

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/pr339-final-v3-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_SHA: dc28f4b05763f3ef996b24e9c5c376452b36d774
  BASE_SHA: 9b8f04f29d572d22434ea577b5ed3543e4f6a2d3

jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      exact: ${{ steps.report.outputs.exact }}
      node: ${{ steps.report.outputs.node }}
      python: ${{ steps.report.outputs.python }}
      install: ${{ steps.report.outputs.install }}
      typecheck: ${{ steps.report.outputs.typecheck }}
      vscode: ${{ steps.report.outputs.vscode }}
      workspace: ${{ steps.report.outputs.workspace }}
      zero_permission: ${{ steps.report.outputs.zero_permission }}
      build: ${{ steps.report.outputs.build }}
      review: ${{ steps.report.outputs.review }}
      db_first: ${{ steps.report.outputs.db_first }}
      db_second: ${{ steps.report.outputs.db_second }}
      db_acl: ${{ steps.report.outputs.db_acl }}
      exercise_e2e: ${{ steps.report.outputs.exercise_e2e }}
      assessment_e2e: ${{ steps.report.outputs.assessment_e2e }}
      result_e2e: ${{ steps.report.outputs.result_e2e }}
    steps:
      - name: Check out public controller
        uses: actions/checkout@v4
        with:
          path: ci-repo
          persist-credentials: false
          fetch-depth: 1

      - name: Validate read-only private credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]

      - name: Check out exact private candidate read-only
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Run sealed exact-head application and database gates
        shell: bash
        run: bash ci-repo/scripts/run-pr339-final-v3.sh private-repo

      - name: Capture sanitized gate statuses
        id: report
        if: always()
        shell: bash
        run: bash ci-repo/scripts/report-pr339-final-v3.sh

      - name: Stop database and delete private checkout and sealed logs
        if: always()
        shell: bash
        run: |
          if [[ -d private-repo ]]; then
            (cd private-repo && supabase stop --no-backup >/dev/null 2>&1 || true)
          fi
          rm -rf private-repo
          find "$RUNNER_TEMP" -maxdepth 2 -type f -name 'pr339-*' -delete
          rm -rf "$RUNNER_TEMP/pr339-status"

  sanitized-report:
    needs: final
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Publish PR339 sanitized gate line
        shell: bash
        env:
          FINAL_CONCLUSION: ${{ needs.final.result }}
          EXACT: ${{ needs.final.outputs.exact }}
          NODE: ${{ needs.final.outputs.node }}
          PYTHON: ${{ needs.final.outputs.python }}
          INSTALL: ${{ needs.final.outputs.install }}
          TYPECHECK: ${{ needs.final.outputs.typecheck }}
          VSCODE: ${{ needs.final.outputs.vscode }}
          WORKSPACE: ${{ needs.final.outputs.workspace }}
          ZERO_PERMISSION: ${{ needs.final.outputs.zero_permission }}
          BUILD: ${{ needs.final.outputs.build }}
          REVIEW: ${{ needs.final.outputs.review }}
          DB_FIRST: ${{ needs.final.outputs.db_first }}
          DB_SECOND: ${{ needs.final.outputs.db_second }}
          DB_ACL: ${{ needs.final.outputs.db_acl }}
          EXERCISE_E2E: ${{ needs.final.outputs.exercise_e2e }}
          ASSESSMENT_E2E: ${{ needs.final.outputs.assessment_e2e }}
          RESULT_E2E: ${{ needs.final.outputs.result_e2e }}
        run: |
          printf 'PR339_SANITIZED conclusion=%s exact=%s node=%s python=%s install=%s typecheck=%s vscode=%s workspace=%s zero_permission=%s build=%s review=%s db_first=%s db_second=%s db_acl=%s exercise_e2e=%s assessment_e2e=%s result_e2e=%s\n' \
            "$FINAL_CONCLUSION" "$EXACT" "$NODE" "$PYTHON" "$INSTALL" "$TYPECHECK" \
            "$VSCODE" "$WORKSPACE" "$ZERO_PERMISSION" "$BUILD" "$REVIEW" \
            "$DB_FIRST" "$DB_SECOND" "$DB_ACL" "$EXERCISE_E2E" "$ASSESSMENT_E2E" "$RESULT_E2E"
