name: TrainingOS Workspace Realtime 71f735 current-main CI

on:
  push:
    branches:
      - ci/trainingos-workspace-realtime-71f735-current-main-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trainingos-workspace-realtime-71f735-current-main-v1
  cancel-in-progress: false

jobs:
  exact-head-current-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRIVATE_SHA: 71f73563b01cbce58c07a2995151ef47bd3fcd04
      CURRENT_MAIN_SHA: b5695921f9fba668b431b22cee454cc7d54537a6
      MERGE_BASE_SHA: b5f25d56ab8f69968e047c1323cdcc68d31d7c0f
    steps:
      - name: Validate immutable inputs
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CURRENT_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]

      - name: Check out exact private head
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: private-repo/package-lock.json

      - name: Verify exact head and bounded scope
        id: scope
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          status=PASS
          actual_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          [[ "$actual_sha" == "$PRIVATE_SHA" ]] || status=FAIL
          git cat-file -e "$CURRENT_MAIN_SHA^{commit}" 2>/dev/null || status=FAIL
          actual_files="$(git diff --name-only "$MERGE_BASE_SHA" "$PRIVATE_SHA" | sort)"
          expected_files=$'apps/training-web/src/lib/trainingos-live-classroom-tencent-provider.ts\napps/training-web/src/lib/trainingos-workspace-realtime-contribution-core.ts\napps/training-web/src/lib/trainingos-workspace-realtime-contribution.ts\napps/training-web/src/workspace-domain-contribution.ts\npackage.json\nscripts/run-trainingos-workspace-realtime-client-validation.ts\nvite.config.ts'
          [[ "$actual_files" == "$expected_files" ]] || status=FAIL
          if printf '%s\n' "$actual_files" | grep -q '^supabase/migrations/'; then status=FAIL; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install exact-head dependencies with sealed output
        id: install_head
        if: steps.scope.outputs.status == 'PASS'
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm ci > "$RUNNER_TEMP/head-install.log" 2>&1
          code=$?
          echo "status=$([[ $code == 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Exact-head focused validation
        id: focused_head
        if: steps.install_head.outputs.status == 'PASS'
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm run validate:workspace-realtime-client > "$RUNNER_TEMP/head-focused.log" 2>&1
          code=$?
          echo "status=$([[ $code == 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Exact-head typecheck
        id: typecheck_head
        if: steps.install_head.outputs.status == 'PASS'
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm run typecheck > "$RUNNER_TEMP/head-typecheck.log" 2>&1
          code=$?
          echo "status=$([[ $code == 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Exact-head production build
        id: build_head
        if: steps.install_head.outputs.status == 'PASS'
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm run build > "$RUNNER_TEMP/head-build.log" 2>&1
          code=$?
          echo "status=$([[ $code == 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Exact-head verify build
        id: verify_head
        if: steps.install_head.outputs.status == 'PASS'
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm run verify:build > "$RUNNER_TEMP/head-verify.log" 2>&1
          code=$?
          echo "status=$([[ $code == 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prove zero-conflict integration with current main
        id: integrate
        if: steps.scope.outputs.status == 'PASS'
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          git config user.name trainingos-public-ci
          git config user.email trainingos-public-ci@users.noreply.github.com
          git merge --no-commit --no-ff "$CURRENT_MAIN_SHA" > "$RUNNER_TEMP/merge.log" 2>&1
          code=$?
          echo "status=$([[ $code == 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish sanitized diagnostic
        if: always()
        shell: bash
        env:
          SCOPE: ${{ steps.scope.outputs.status }}
          INSTALL_HEAD: ${{ steps.install_head.outputs.status }}
          FOCUSED_HEAD: ${{ steps.focused_head.outputs.status }}
          TYPECHECK_HEAD: ${{ steps.typecheck_head.outputs.status }}
          BUILD_HEAD: ${{ steps.build_head.outputs.status }}
          VERIFY_HEAD: ${{ steps.verify_head.outputs.status }}
          INTEGRATE: ${{ steps.integrate.outputs.status }}
        run: |
          failed=0
          for pair in "scope:$SCOPE" "install_head:$INSTALL_HEAD" "focused_head:$FOCUSED_HEAD" "typecheck_head:$TYPECHECK_HEAD" "build_head:$BUILD_HEAD" "verify_head:$VERIFY_HEAD" "integrate:$INTEGRATE"; do
            key="${pair%%:*}"
            value="${pair#*:}"
            if [[ "$value" == PASS ]]; then
              echo "::notice title=TrainingOS diagnostic::$key=PASS"
            else
              echo "::error title=TrainingOS diagnostic::$key=${value:-EMPTY}"
              failed=1
            fi
          done
          exit "$failed"

      - name: Cleanup sealed private output
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/head-*.log "$RUNNER_TEMP/merge.log
