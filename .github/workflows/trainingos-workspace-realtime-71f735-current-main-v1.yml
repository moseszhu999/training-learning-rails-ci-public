name: TrainingOS Workspace Realtime 71f735 current-main CI

on:
  push:
    branches:
      - ci/trainingos-workspace-realtime-71f735-current-main-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRIVATE_SHA: 71f73563b01cbce58c07a2995151ef47bd3fcd04
      MERGE_BASE_SHA: b5f25d56ab8f69968e047c1323cdcc68d31d7c0f
    steps:
      - name: Check out exact private head
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: private-repo/package-lock.json

      - name: Verify exact head and bounded scope
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
          actual="$(git diff --name-only "$MERGE_BASE_SHA" "$PRIVATE_SHA" | sort)"
          expected=$'apps/training-web/src/lib/trainingos-live-classroom-tencent-provider.ts\napps/training-web/src/lib/trainingos-workspace-realtime-contribution-core.ts\napps/training-web/src/lib/trainingos-workspace-realtime-contribution.ts\napps/training-web/src/workspace-domain-contribution.ts\npackage.json\nscripts/run-trainingos-workspace-realtime-client-validation.ts\nvite.config.ts'
          test "$actual" = "$expected"
          ! printf '%s\n' "$actual" | grep -q '^supabase/migrations/'

      - name: Install dependencies
        working-directory: private-repo
        shell: bash
        run: npm ci >/dev/null 2>&1

      - name: Diagnose focused validation without source disclosure
        id: focused
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm run validate:workspace-realtime-client > "$RUNNER_TEMP/focused.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ $code -ne 0 ]]; then
            location="$(grep -oE 'run-trainingos-workspace-realtime-client-validation\.ts:[0-9]+:[0-9]+' "$RUNNER_TEMP/focused.log" | tail -n 1 || true)"
            echo "::error title=TrainingOS focused diagnostic::exit=$code location=${location:-NOT_VERIFIED}"
          else
            echo "::notice title=TrainingOS focused diagnostic::PASS"
          fi
          exit 0

      - name: Diagnose typecheck without error-text disclosure
        id: typecheck
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ $code -ne 0 ]]; then
            diag="$(grep -Eo '^[^(: ]+\([0-9]+,[0-9]+\): error TS[0-9]+' "$RUNNER_TEMP/typecheck.log" | head -n 12 | tr '\n' ';' || true)"
            echo "::error title=TrainingOS typecheck diagnostic::exit=$code diagnostics=${diag:-NOT_VERIFIED}"
          else
            echo "::notice title=TrainingOS typecheck diagnostic::PASS"
          fi
          exit 0

      - name: Enforce diagnostic result
        shell: bash
        env:
          FOCUSED_CODE: ${{ steps.focused.outputs.exit_code }}
          TYPECHECK_CODE: ${{ steps.typecheck.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "$FOCUSED_CODE" = 0
          test "$TYPECHECK_CODE" = 0

      - name: Cleanup sealed logs
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/focused.log" "$RUNNER_TEMP/typecheck.log"
