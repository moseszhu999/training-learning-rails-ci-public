name: Recipe PR325 d833485 application gates

on:
  push:
    branches:
      - ci/recipe-pr325-cbcdb11-run
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/recipe-pr325-cbcdb11-app.yml
      - .github/workflows/recipe-pr325-cbcdb11-db.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipe-pr325-d833485-app-${{ github.event_name }}
  cancel-in-progress: false

env:
  PRIVATE_SHA: d833485ce9db34797e7aba00b3903a6f57a70a11
  BASE_SHA: 9b8f04f29d572d22434ea577b5ed3543e4f6a2d3

jobs:
  focused-exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate exact SHAs and private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]

      - name: Check out exact private candidate
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact head, merge base and Recipe-only scope
        id: scope
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          merge_base="$(git merge-base "$BASE_SHA" "$PRIVATE_SHA")"
          git diff --name-only "$BASE_SHA" "$PRIVATE_SHA" | sort > "$RUNNER_TEMP/recipe-files.txt"
          python - "$RUNNER_TEMP/recipe-files.txt" <<'PY'
          import pathlib,re,sys
          files=[line.strip() for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          def allowed(path):
              if path.startswith('packages/training-recipe/'):
                  return True
              if re.fullmatch(r'lib/trainingos-agent-gateway/recipe-[^/]+\.mjs',path):
                  return True
              if re.fullmatch(r'supabase/migrations/2026072812\d{4}_trainingos_agent_recipe_[^/]+\.sql',path):
                  return True
              if re.fullmatch(r'prototypes/trainingos-agent-mvp-v1/recipe-[^/]+\.test\.mjs',path):
                  return True
              if re.fullmatch(r'tests/test_trainingos_agent_recipe[^/]*\.py',path):
                  return True
              if re.fullmatch(r'tests/sql/trainingos_agent_recipe[^/]*\.sql',path):
                  return True
              if path in {
                  'docs/architecture/trainingos-agent-recipe-runtime-v1.md',
                  'docs/testing/trainingos-agent-recipe-validation-v1.md',
              }:
                  return True
              return False
          bad=[path for path in files if not allowed(path)]
          ok=len(files)==26 and not bad
          print(f'RECIPE_SCOPE status={"PASS" if ok else "FAIL"} files={len(files)} forbidden={len(bad)}')
          raise SystemExit(0 if ok else 1)
          PY
          [[ "$actual_sha" == "$PRIVATE_SHA" ]]
          [[ "$merge_base" == "$BASE_SHA" ]]
          echo PASS > "$RUNNER_TEMP/recipe-scope.status"
          echo "actual_sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"

      - name: Run Recipe JavaScript syntax checks with sealed output
        working-directory: private-repo
        shell: bash
        run: |
          {
            node --check packages/training-recipe/src/compiler.mjs
            node --check packages/training-recipe/src/adapters.mjs
            node --check packages/training-recipe/src/index.mjs
            node --check packages/training-recipe/src/review-hardening.mjs
            node --check lib/trainingos-agent-gateway/recipe-runtime.mjs
            node --check lib/trainingos-agent-gateway/recipe-runtime-review.mjs
            node --check lib/trainingos-agent-gateway/recipe-mcp-layer.mjs
          } > "$RUNNER_TEMP/recipe-syntax.log" 2>&1
          echo 'PASS 7/7' > "$RUNNER_TEMP/recipe-syntax.status"

      - name: Run focused Recipe Node contracts with sealed output
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          node --test \
            prototypes/trainingos-agent-mvp-v1/recipe-runtime.test.mjs \
            prototypes/trainingos-agent-mvp-v1/recipe-review-runtime.test.mjs \
            > "$RUNNER_TEMP/recipe-node.log" 2>&1
          code=$?
          python - "$RUNNER_TEMP/recipe-node.log" "$code" "$RUNNER_TEMP/recipe-node.status" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          tests=re.search(r'# tests\s+(\d+)',text); passed=re.search(r'# pass\s+(\d+)',text); failed=re.search(r'# fail\s+(\d+)',text)
          count=int(tests.group(1)) if tests else 0; passed_count=int(passed.group(1)) if passed else 0; failed_count=int(failed.group(1)) if failed else -1
          ok=int(sys.argv[2])==0 and count==11 and passed_count==11 and failed_count==0
          pathlib.Path(sys.argv[3]).write_text(f'{"PASS" if ok else "FAIL"} {passed_count}/{count}',encoding='utf-8')
          raise SystemExit(0 if ok else 1)
          PY

      - name: Run focused Recipe Python contracts with sealed output
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          python -m unittest -v \
            tests.test_trainingos_agent_recipe_contract \
            tests.test_trainingos_agent_recipe_review_contract \
            > "$RUNNER_TEMP/recipe-python.log" 2>&1
          code=$?
          python - "$RUNNER_TEMP/recipe-python.log" "$code" "$RUNNER_TEMP/recipe-python.status" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          match=re.search(r'Ran\s+(\d+)\s+tests?',text); count=int(match.group(1)) if match else 0
          ok=int(sys.argv[2])==0 and count==21 and re.search(r'(?:^|\n)OK(?:\s|\n|$)',text) is not None
          pathlib.Path(sys.argv[3]).write_text(f'{"PASS" if ok else "FAIL"} {count}/21',encoding='utf-8')
          raise SystemExit(0 if ok else 1)
          PY

      - name: Publish sanitized focused result
        if: always()
        shell: bash
        env:
          ACTUAL_SHA: ${{ steps.scope.outputs.actual_sha }}
          MERGE_BASE: ${{ steps.scope.outputs.merge_base }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const read=n=>{try{return fs.readFileSync(path.join(process.env.RUNNER_TEMP,n),'utf8').trim()}catch{return 'NOT_RUN'}};
          const r={scope:read('recipe-scope.status'),syntax:read('recipe-syntax.status'),node:read('recipe-node.status'),python:read('recipe-python.status')};
          const lines=['## Recipe PR325 focused exact-head gates','',`- Exact private SHA: \`${process.env.ACTUAL_SHA||process.env.PRIVATE_SHA}\``,`- Merge base: \`${process.env.MERGE_BASE||process.env.BASE_SHA}\``,`- Recipe-only scope: **${r.scope}**`,`- Syntax: **${r.syntax}**`,`- Focused Node: **${r.node}**`,`- Focused Python: **${r.python}**`,'','Raw private output is sealed and deleted.'];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          console.log(`RECIPE_FOCUSED scope=${r.scope} syntax=${r.syntax} node=${r.node} python=${r.python} sha=${process.env.ACTUAL_SHA||process.env.PRIVATE_SHA}`);
          NODE

      - name: Remove private checkout and sealed focused logs
        if: always()
        shell: bash
        run: rm -rf private-repo "$RUNNER_TEMP"/recipe-*.log "$RUNNER_TEMP"/recipe-*.status "$RUNNER_TEMP"/recipe-files.txt

  repository-owned-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Validate exact SHAs and private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]

      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-candidate
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Check out exact main baseline
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.BASE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-base
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: private-candidate/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact candidate dependencies
        working-directory: private-candidate
        shell: bash
        run: npm ci > "$RUNNER_TEMP/owned-candidate-install.log" 2>&1

      - name: Owned Python contracts
        working-directory: private-candidate
        shell: bash
        run: npm run test:python > "$RUNNER_TEMP/owned-python.log" 2>&1

      - name: Repository typecheck
        if: always()
        working-directory: private-candidate
        shell: bash
        run: npm run typecheck > "$RUNNER_TEMP/owned-typecheck.log" 2>&1

      - name: MVP acceptance
        if: always()
        working-directory: private-candidate
        shell: bash
        run: npm run test:mvp > "$RUNNER_TEMP/owned-mvp.log" 2>&1

      - name: JHC acceptance
        if: always()
        working-directory: private-candidate
        shell: bash
        run: npm run test:jhc > "$RUNNER_TEMP/owned-jhc.log" 2>&1

      - name: JHC membership acceptance
        if: always()
        working-directory: private-candidate
        shell: bash
        run: npm run test:jhc:membership > "$RUNNER_TEMP/owned-membership.log" 2>&1

      - name: JHC Supabase contracts
        if: always()
        working-directory: private-candidate
        shell: bash
        run: npm run test:jhc:supabase > "$RUNNER_TEMP/owned-supabase.log" 2>&1

      - name: TrainingOS Agent acceptance
        if: always()
        working-directory: private-candidate
        shell: bash
        run: npm run test:agent > "$RUNNER_TEMP/owned-agent.log" 2>&1

      - name: Install exact baseline dependencies
        if: always()
        working-directory: private-base
        shell: bash
        run: npm ci > "$RUNNER_TEMP/owned-base-install.log" 2>&1

      - name: Baseline-control Agent UI acceptance
        if: always()
        shell: bash
        run: |
          set +e
          (cd private-base && npm run test:agent-ui) > "$RUNNER_TEMP/owned-ui-base.log" 2>&1; base_code=$?
          (cd private-candidate && npm run test:agent-ui) > "$RUNNER_TEMP/owned-ui-candidate.log" 2>&1; candidate_code=$?
          python - "$RUNNER_TEMP/owned-ui-base.log" "$base_code" "$RUNNER_TEMP/owned-ui-candidate.log" "$candidate_code" <<'PY'
          import pathlib,re,sys
          def result(path,code):
              text=pathlib.Path(path).read_text(encoding='utf-8',errors='replace'); messages=re.findall(r'^Error:\s+(.+)$',text,flags=re.M)
              return int(code),messages[0].strip() if messages else None
          bc,be=result(sys.argv[1],sys.argv[2]); cc,ce=result(sys.argv[3],sys.argv[4])
          ok=cc==0 or (bc!=0 and cc!=0 and be is not None and be==ce)
          print(f'RECIPE_AGENT_UI status={"PASS" if ok else "FAIL"} base_code={bc} candidate_code={cc}')
          raise SystemExit(0 if ok else 1)
          PY

      - name: OAuth redirect acceptance
        if: always()
        working-directory: private-candidate
        shell: bash
        run: npm run test:oauth-redirect > "$RUNNER_TEMP/owned-oauth.log" 2>&1

      - name: Production build
        if: always()
        working-directory: private-candidate
        shell: bash
        run: npm run build > "$RUNNER_TEMP/owned-build.log" 2>&1

      - name: Build verification
        if: always()
        working-directory: private-candidate
        shell: bash
        run: npm run verify:build > "$RUNNER_TEMP/owned-verify.log" 2>&1

      - name: Publish sanitized repository-owned result
        if: always()
        shell: bash
        run: |
          echo '## Recipe PR325 repository-owned acceptance' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact candidate: \`$PRIVATE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact main baseline: \`$BASE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Raw private output is sealed and deleted; individual step conclusions are authoritative.' >> "$GITHUB_STEP_SUMMARY"
          echo "RECIPE_OWNED exact_sha=$PRIVATE_SHA base_sha=$BASE_SHA"

      - name: Remove private checkouts and sealed owned logs
        if: always()
        shell: bash
        run: rm -rf private-candidate private-base "$RUNNER_TEMP"/owned-*.log
