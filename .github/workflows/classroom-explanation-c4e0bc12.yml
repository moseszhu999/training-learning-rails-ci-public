name: Classroom Explanation c4e0bc12 exact-head CI

on:
  push:
    branches:
      - ci/classroom-explanation-aa2d65c9
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/classroom-explanation-c4e0bc12.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-explanation-c4e0bc12-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRIVATE_SHA: c4e0bc12de1148839ca648aaed8c862ac58b2162
      EXPECTED_BASE_SHA: 604631a96f01fb76d123072168c165cc699d9e8e

    steps:
      - name: Validate exact SHA and private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]

      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: private-repo/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact head, merge base, and Window 1 scope
        id: scope
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          status=PASS
          actual_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          actual_merge_base="$(git merge-base "$EXPECTED_BASE_SHA" "$PRIVATE_SHA" 2>/dev/null || true)"
          [[ "$actual_sha" == "$PRIVATE_SHA" ]] || status=FAIL
          [[ "$actual_merge_base" == "$EXPECTED_BASE_SHA" ]] || status=FAIL

          actual_files="$(git diff --name-only "$EXPECTED_BASE_SHA" "$PRIVATE_SHA" | sort)"
          expected_files=$'docs/architecture/trainingos-classroom-explanation-runtime-v1.md\ndocs/verification/trainingos-classroom-explanation-runtime-v1.md\nlib/trainingos-agent-gateway/classroom-explanation-mcp-layer.mjs\nlib/trainingos-agent-gateway/classroom-explanation-runtime.mjs\nprototypes/trainingos-agent-mvp-v1/test/classroom-explanation-runtime.test.mjs\nsupabase/migrations/20260728160000_trainingos_classroom_explanation_schema_v1.sql\nsupabase/migrations/20260728160100_trainingos_classroom_explanation_prepare_rpc_v1.sql\nsupabase/migrations/20260728160200_trainingos_classroom_explanation_start_rpc_v1.sql\nsupabase/migrations/20260728160300_trainingos_classroom_explanation_capture_create_rpc_v1.sql\nsupabase/migrations/20260728160400_trainingos_classroom_explanation_capture_upload_rpc_v1.sql\nsupabase/migrations/20260728160500_trainingos_classroom_explanation_transcript_rpc_v1.sql\nsupabase/migrations/20260728160600_trainingos_classroom_explanation_analysis_rpc_v1.sql\nsupabase/migrations/20260728160700_trainingos_classroom_explanation_evaluation_rpc_v1.sql\nsupabase/migrations/20260728160800_trainingos_classroom_explanation_projection_rpc_v1.sql\nsupabase/migrations/20260728160900_trainingos_classroom_explanation_intelligence_hardening_v1.sql\nsupabase/migrations/20260728161000_trainingos_classroom_explanation_context_prepare_rpc_v1.sql\nsupabase/migrations/20260728161100_trainingos_classroom_explanation_transcript_intelligence_input_v1.sql\nsupabase/migrations/20260728161200_trainingos_classroom_explanation_agent_inference_rpc_v1.sql\nsupabase/migrations/20260728161300_trainingos_classroom_explanation_teacher_evaluation_projection_v1.sql\nsupabase/migrations/20260728161400_trainingos_classroom_explanation_start_active_slot_hardening_v1.sql\ntests/sql/trainingos_classroom_explanation_e2e.sql\ntests/test_trainingos_classroom_explanation_contract.py'
          [[ "$actual_files" == "$expected_files" ]] || status=FAIL

          file_count="$(printf '%s\n' "$actual_files" | sed '/^$/d' | wc -l | tr -d ' ')"
          migration_count="$(printf '%s\n' "$actual_files" | grep -Ec '^supabase/migrations/2026072816[0-5][0-9]{3}_trainingos_classroom_explanation_' || true)"
          [[ "$file_count" == "22" ]] || status=FAIL
          [[ "$migration_count" == "15" ]] || status=FAIL

          {
            echo "status=$status"
            echo "actual_sha=$actual_sha"
            echo "actual_merge_base=$actual_merge_base"
            echo "file_count=$file_count"
            echo "migration_count=$migration_count"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run explanation runtime syntax checks with sealed output
        id: syntax
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          {
            node --check lib/trainingos-agent-gateway/classroom-explanation-runtime.mjs
            node --check lib/trainingos-agent-gateway/classroom-explanation-mcp-layer.mjs
          } > "$RUNNER_TEMP/classroom-explanation-syntax.log" 2>&1
          code=$?
          echo "status=$([[ $code == 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run focused explanation Node contracts with sealed output
        id: focused
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          node --test prototypes/trainingos-agent-mvp-v1/test/classroom-explanation-runtime.test.mjs \
            > "$RUNNER_TEMP/classroom-explanation-focused.log" 2>&1
          code=$?
          python - "$RUNNER_TEMP/classroom-explanation-focused.log" "$code" "$GITHUB_OUTPUT" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          code = int(sys.argv[2])
          tests = int((re.search(r'# tests\s+(\d+)', text) or [None, 0])[1])
          passed = int((re.search(r'# pass\s+(\d+)', text) or [None, 0])[1])
          failed = int((re.search(r'# fail\s+(\d+)', text) or [None, -1])[1])
          ok = code == 0 and tests == 8 and passed == 8 and failed == 0
          with pathlib.Path(sys.argv[3]).open('a', encoding='utf-8') as out:
              out.write(f'test_count={tests}\npass_count={passed}\nfail_count={failed}\nstatus={"PASS" if ok else "FAIL"}\n')
          PY
          exit 0

      - name: Run explanation Python contracts with sealed output
        id: python_contract
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          python -m unittest -v tests.test_trainingos_classroom_explanation_contract \
            > "$RUNNER_TEMP/classroom-explanation-python.log" 2>&1
          code=$?
          python - "$RUNNER_TEMP/classroom-explanation-python.log" "$code" "$GITHUB_OUTPUT" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          code = int(sys.argv[2])
          match = re.search(r'Ran\s+(\d+)\s+tests?', text)
          tests = int(match.group(1)) if match else 0
          ok = code == 0 and tests == 14 and re.search(r'^OK$', text, re.MULTILINE)
          with pathlib.Path(sys.argv[3]).open('a', encoding='utf-8') as out:
              out.write(f'test_count={tests}\npass_count={tests if ok else 0}\nstatus={"PASS" if ok else "FAIL"}\n')
          PY
          exit 0

      - name: Install private repository dependencies with sealed output
        id: install
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm ci > "$RUNNER_TEMP/classroom-explanation-install.log" 2>&1
          code=$?
          echo "status=$([[ $code == 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run merged Classroom Intelligence package contracts
        id: intelligence
        if: steps.install.outputs.status == 'PASS'
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm --prefix packages/training-classroom-intelligence test \
            > "$RUNNER_TEMP/classroom-intelligence-package.log" 2>&1
          code=$?
          echo "status=$([[ $code == 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run repository typecheck with sealed output
        id: typecheck
        if: steps.install.outputs.status == 'PASS'
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm run typecheck > "$RUNNER_TEMP/classroom-explanation-typecheck.log" 2>&1
          code=$?
          echo "status=$([[ $code == 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run production build with sealed output
        id: build
        if: steps.install.outputs.status == 'PASS'
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm run build > "$RUNNER_TEMP/classroom-explanation-build.log" 2>&1
          code=$?
          echo "status=$([[ $code == 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish sanitized exact-head result
        if: always()
        shell: bash
        env:
          SCOPE_STATUS: ${{ steps.scope.outputs.status }}
          ACTUAL_SHA: ${{ steps.scope.outputs.actual_sha }}
          ACTUAL_MERGE_BASE: ${{ steps.scope.outputs.actual_merge_base }}
          FILE_COUNT: ${{ steps.scope.outputs.file_count }}
          MIGRATION_COUNT: ${{ steps.scope.outputs.migration_count }}
          SYNTAX_STATUS: ${{ steps.syntax.outputs.status }}
          FOCUSED_STATUS: ${{ steps.focused.outputs.status }}
          FOCUSED_COUNT: ${{ steps.focused.outputs.test_count }}
          FOCUSED_PASS: ${{ steps.focused.outputs.pass_count }}
          PYTHON_STATUS: ${{ steps.python_contract.outputs.status }}
          PYTHON_COUNT: ${{ steps.python_contract.outputs.test_count }}
          PYTHON_PASS: ${{ steps.python_contract.outputs.pass_count }}
          INSTALL_STATUS: ${{ steps.install.outputs.status }}
          INTELLIGENCE_STATUS: ${{ steps.intelligence.outputs.status }}
          TYPECHECK_STATUS: ${{ steps.typecheck.outputs.status }}
          BUILD_STATUS: ${{ steps.build.outputs.status }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const v = (x) => x || 'NOT_RUN';
          const lines = [
            '## Classroom Explanation c4e0bc12 exact-head CI', '',
            `- Exact private SHA: \`${process.env.ACTUAL_SHA || process.env.PRIVATE_SHA}\``,
            `- Exact merge base: \`${process.env.ACTUAL_MERGE_BASE || process.env.EXPECTED_BASE_SHA}\``,
            `- Window 1 scope: **${v(process.env.SCOPE_STATUS)} (${process.env.FILE_COUNT || '0'} files / ${process.env.MIGRATION_COUNT || '0'} migrations)**`,
            `- JavaScript syntax: **${v(process.env.SYNTAX_STATUS)} 2/2**`,
            `- Focused Node contracts: **${v(process.env.FOCUSED_STATUS)} ${process.env.FOCUSED_PASS || '0'}/${process.env.FOCUSED_COUNT || '0'}**`,
            `- Python contracts: **${v(process.env.PYTHON_STATUS)} ${process.env.PYTHON_PASS || '0'}/${process.env.PYTHON_COUNT || '0'}**`,
            `- Dependency install: **${v(process.env.INSTALL_STATUS)}**`,
            `- Classroom Intelligence package: **${v(process.env.INTELLIGENCE_STATUS)}**`,
            `- Repository typecheck: **${v(process.env.TYPECHECK_STATUS)}**`,
            `- Production build: **${v(process.env.BUILD_STATUS)}**`,
            '- Database migration replay and SQL E2E: **NOT_RUN in this public-safe workflow**', '',
            'Raw private output is sealed and deleted. No private source, fixtures, credentials, or logs are published.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          console.log(`CLASSROOM_EXPLANATION_C4E0_EXACT_CI scope=${v(process.env.SCOPE_STATUS)}:${process.env.FILE_COUNT || '0'}/${process.env.MIGRATION_COUNT || '0'} syntax=${v(process.env.SYNTAX_STATUS)} focused=${v(process.env.FOCUSED_STATUS)}:${process.env.FOCUSED_PASS || '0'}/${process.env.FOCUSED_COUNT || '0'} python=${v(process.env.PYTHON_STATUS)}:${process.env.PYTHON_PASS || '0'}/${process.env.PYTHON_COUNT || '0'} install=${v(process.env.INSTALL_STATUS)} intelligence=${v(process.env.INTELLIGENCE_STATUS)} typecheck=${v(process.env.TYPECHECK_STATUS)} build=${v(process.env.BUILD_STATUS)} sha=${process.env.ACTUAL_SHA || process.env.PRIVATE_SHA}`);
          NODE

      - name: Remove private checkout and sealed logs
        if: always()
        shell: bash
        run: |
          rm -rf private-repo \
            "$RUNNER_TEMP/classroom-explanation-syntax.log" \
            "$RUNNER_TEMP/classroom-explanation-focused.log" \
            "$RUNNER_TEMP/classroom-explanation-python.log" \
            "$RUNNER_TEMP/classroom-explanation-install.log" \
            "$RUNNER_TEMP/classroom-intelligence-package.log" \
            "$RUNNER_TEMP/classroom-explanation-typecheck.log" \
            "$RUNNER_TEMP/classroom-explanation-build.log"

      - name: Enforce exact-head result
        if: always()
        shell: bash
        env:
          SCOPE_STATUS: ${{ steps.scope.outputs.status }}
          FILE_COUNT: ${{ steps.scope.outputs.file_count }}
          MIGRATION_COUNT: ${{ steps.scope.outputs.migration_count }}
          SYNTAX_STATUS: ${{ steps.syntax.outputs.status }}
          FOCUSED_STATUS: ${{ steps.focused.outputs.status }}
          FOCUSED_COUNT: ${{ steps.focused.outputs.test_count }}
          FOCUSED_PASS: ${{ steps.focused.outputs.pass_count }}
          PYTHON_STATUS: ${{ steps.python_contract.outputs.status }}
          PYTHON_COUNT: ${{ steps.python_contract.outputs.test_count }}
          PYTHON_PASS: ${{ steps.python_contract.outputs.pass_count }}
          INSTALL_STATUS: ${{ steps.install.outputs.status }}
          INTELLIGENCE_STATUS: ${{ steps.intelligence.outputs.status }}
          TYPECHECK_STATUS: ${{ steps.typecheck.outputs.status }}
          BUILD_STATUS: ${{ steps.build.outputs.status }}
        run: |
          set -euo pipefail
          [[ "$SCOPE_STATUS" == "PASS" && "$FILE_COUNT" == "22" && "$MIGRATION_COUNT" == "15" ]]
          [[ "$SYNTAX_STATUS" == "PASS" ]]
          [[ "$FOCUSED_STATUS" == "PASS" && "$FOCUSED_COUNT" == "8" && "$FOCUSED_PASS" == "8" ]]
          [[ "$PYTHON_STATUS" == "PASS" && "$PYTHON_COUNT" == "14" && "$PYTHON_PASS" == "14" ]]
          [[ "$INSTALL_STATUS" == "PASS" ]]
          [[ "$INTELLIGENCE_STATUS" == "PASS" ]]
          [[ "$TYPECHECK_STATUS" == "PASS" ]]
          [[ "$BUILD_STATUS" == "PASS" ]]
