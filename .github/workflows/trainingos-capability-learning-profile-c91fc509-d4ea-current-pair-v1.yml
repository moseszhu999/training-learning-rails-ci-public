name: TrainingOS Capability Learning Profile c91fc509 current-main CI

on:
  push:
    branches:
      - ci/exact-head-request/capability-learning-profile-c91fc509-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-current-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PRIVATE_SHA: c91fc509fe619f64c6c090ce8e7cf40221723f4e
      CURRENT_MAIN_SHA: d4ea85759ac3746ddc6ad795b0671602219a2bea
      MERGE_BASE_SHA: 32d4ebe8254c0eabd4671542e92aa43cebe1d849
    steps:
      - name: Check out exact private head
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: private-repo/package-lock.json
      - name: Verify exact head and bounded scope
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
          git cat-file -e "$CURRENT_MAIN_SHA^{commit}"
          actual="$(git diff --name-only "$MERGE_BASE_SHA" "$PRIVATE_SHA" | sort)"
          expected="$(printf '%s\n%s\n%s\n%s\n%s' \
            'docs/architecture/trainingos-capability-learning-profile-v1.md' \
            'packages/training-capability-learning-profile-core/package.json' \
            'packages/training-capability-learning-profile-core/src/index.d.ts' \
            'packages/training-capability-learning-profile-core/src/index.mjs' \
            'tests/training-capability-learning-profile-v1.test.mjs')"
          test "$actual" = "$expected"
          ! printf '%s\n' "$actual" | grep -q '^supabase/migrations/'
          ! printf '%s\n' "$actual" | grep -q '^.github/workflows/'
      - name: Reject production capabilities
        shell: bash
        run: |
          set -euo pipefail
          privileged_role="SERVICE""_ROLE"
          sensitive_env_pattern="(^|_)(PRODUCTION|PROD|${privileged_role}|BILLING|PAYMENT|STRIPE)(_|$)"
          env | cut -d= -f1 | grep -E "$sensitive_env_pattern" && exit 1 || true
      - name: Install dependencies
        working-directory: private-repo
        shell: bash
        run: npm ci >/dev/null 2>&1
      - name: Exact-head focused contracts
        working-directory: private-repo
        shell: bash
        run: node --test tests/training-capability-learning-profile-v1.test.mjs
      - name: Exact-head repository gates
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          npm run verify:build
      - name: Integrate exact current main without commit
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name trainingos-public-ci
          git config user.email trainingos-public-ci@users.noreply.github.com
          git merge --no-commit --no-ff "$CURRENT_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
          test "$(git rev-parse MERGE_HEAD)" = "$CURRENT_MAIN_SHA"
          git diff --check
      - name: Integrated focused contracts
        working-directory: private-repo
        shell: bash
        run: node --test tests/training-capability-learning-profile-v1.test.mjs
      - name: Integrated repository gates
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          npm run verify:build
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
          test "$(git rev-parse MERGE_HEAD)" = "$CURRENT_MAIN_SHA"
          git diff --check
