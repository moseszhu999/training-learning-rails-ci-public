name: PR339 answer schema diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr339-answer-schema-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_SHA: e032cf7fe9824a4a667fea41ce77aa17337b49d8
  DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    outputs:
      guard: ${{ steps.guard.outputs.guard }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Start canonical database
        working-directory: private-repo
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/pr339-schema-db"
          supabase --workdir "$workdir" init --force --yes >/dev/null 2>&1
          python scripts/build-trainingos-fresh-bootstrap.py --repo-root "$PWD" --output-dir "$workdir/supabase/migrations" --commit-sha "$PRIVATE_SHA" >/dev/null 2>&1
          supabase --workdir "$workdir" start >/dev/null 2>&1
      - name: Publish bounded schema guard
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          definition="$(psql "$DB_URL" -X -Atv ON_ERROR_STOP=1 <<'SQL'
          select p.prosrc
          from pg_catalog.pg_proc p
          join pg_catalog.pg_namespace n on n.oid=p.pronamespace
          where n.nspname='trainingos_assessment_private'
            and p.proname='validate_answer'
          limit 1;
          SQL
          )"
          guard="$(python - "$definition" <<'PY'
          import re,sys
          lines=sys.argv[1].splitlines()
          idx=next((i for i,x in enumerate(lines) if 'ANSWER_SCHEMA_INVALID' in x),-1)
          part=' '.join(x.strip() for x in lines[max(0,idx-28):idx+4]) if idx>=0 else 'NOT_FOUND'
          part=re.sub(r'\s+',' ',part)
          part=re.sub(r'[^A-Za-z0-9_''(),.=<>: |!\[\]-]+','_',part)
          print(part[:1200])
          PY
          )"
          echo "guard=$guard" >> "$GITHUB_OUTPUT"
      - name: Cleanup
        if: always()
        run: |
          supabase --workdir "$RUNNER_TEMP/pr339-schema-db" stop --no-backup >/dev/null 2>&1 || true
          rm -rf private-repo "$RUNNER_TEMP"/pr339-*

  disposition:
    if: always()
    needs: inspect
    name: schema-${{ needs.inspect.outputs.guard }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo bounded_schema_published=true >> "$GITHUB_STEP_SUMMARY"
