name: PR342 Classroom Explanation 7c575a2e final

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr342-classroom-explanation-final-7c575a2e.yml
      - carriers/pr342-final-7c575a2e.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr342-classroom-explanation-final-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PRIVATE_SHA: 7c575a2e42e76d564e4ba15dfe8f682da8dee366
  BASE_SHA: a2875b971b513f667caa67272eb4271485d2858c

jobs:
  exact-head-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Validate exact inputs and read-only credential
        id: credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]

      - name: Check out exact private candidate
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact SHA merge base posture and scope
        id: scope
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          merge_base="$(git merge-base "$BASE_SHA" "$PRIVATE_SHA")"
          counts="$(git rev-list --left-right --count "$BASE_SHA...$PRIVATE_SHA")"
          behind="$(printf '%s' "$counts" | awk '{print $1}')"
          ahead="$(printf '%s' "$counts" | awk '{print $2}')"
          actual_files="$(git diff --name-only "$BASE_SHA" "$PRIVATE_SHA" | sort)"
          expected_files=$'docs/architecture/trainingos-classroom-explanation-runtime-v1.md\ndocs/verification/trainingos-classroom-explanation-runtime-v1.md\nlib/trainingos-agent-gateway/classroom-explanation-mcp-layer.mjs\nlib/trainingos-agent-gateway/classroom-explanation-runtime.mjs\nprototypes/trainingos-agent-mvp-v1/test/classroom-explanation-runtime.test.mjs\nsupabase/migrations/20260728160000_trainingos_classroom_explanation_schema_v1.sql\nsupabase/migrations/20260728160100_trainingos_classroom_explanation_prepare_rpc_v1.sql\nsupabase/migrations/20260728160200_trainingos_classroom_explanation_start_rpc_v1.sql\nsupabase/migrations/20260728160300_trainingos_classroom_explanation_capture_create_rpc_v1.sql\nsupabase/migrations/20260728160400_trainingos_classroom_explanation_capture_upload_rpc_v1.sql\nsupabase/migrations/20260728160500_trainingos_classroom_explanation_transcript_rpc_v1.sql\nsupabase/migrations/20260728160600_trainingos_classroom_explanation_analysis_rpc_v1.sql\nsupabase/migrations/20260728160700_trainingos_classroom_explanation_evaluation_rpc_v1.sql\nsupabase/migrations/20260728160800_trainingos_classroom_explanation_projection_rpc_v1.sql\nsupabase/migrations/20260728160900_trainingos_classroom_explanation_intelligence_hardening_v1.sql\nsupabase/migrations/20260728161000_trainingos_classroom_explanation_context_prepare_rpc_v1.sql\nsupabase/migrations/20260728161100_trainingos_classroom_explanation_transcript_intelligence_input_v1.sql\nsupabase/migrations/20260728161200_trainingos_classroom_explanation_agent_inference_rpc_v1.sql\nsupabase/migrations/20260728161300_trainingos_classroom_explanation_teacher_evaluation_projection_v1.sql\nsupabase/migrations/20260728161400_trainingos_classroom_explanation_start_active_slot_hardening_v1.sql\nsupabase/migrations/20260728161500_trainingos_classroom_explanation_question_source_hardening_v1.sql\ntests/sql/trainingos_classroom_explanation_e2e.sql\ntests/test_trainingos_classroom_explanation_contract.py'
          file_count="$(printf '%s\n' "$actual_files" | sed '/^$/d' | wc -l | tr -d ' ')"
          migration_count="$(printf '%s\n' "$actual_files" | grep -Ec '^supabase/migrations/2026072816[0-5][0-9]{3}_trainingos_classroom_explanation_')"
          [[ "$actual_sha" == "$PRIVATE_SHA" ]]
          [[ "$merge_base" == "$BASE_SHA" ]]
          [[ "$behind" == 0 ]]
          [[ "$ahead" == 22 ]]
          [[ "$actual_files" == "$expected_files" ]]
          [[ "$file_count" == 23 ]]
          [[ "$migration_count" == 16 ]]
          test -z "$(git status --porcelain)"
          {
            echo "actual_sha=$actual_sha"
            echo "merge_base=$merge_base"
            echo "ahead=$ahead"
            echo "behind=$behind"
            echo "file_count=$file_count"
            echo "migration_count=$migration_count"
          } >> "$GITHUB_OUTPUT"

      - name: JavaScript syntax 2 of 2
        id: syntax
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          {
            node --check lib/trainingos-agent-gateway/classroom-explanation-runtime.mjs
            node --check lib/trainingos-agent-gateway/classroom-explanation-mcp-layer.mjs
          } > "$RUNNER_TEMP/pr342-syntax.log" 2>&1

      - name: Focused Node contracts 10 of 10
        id: node_contract
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          node --test prototypes/trainingos-agent-mvp-v1/test/classroom-explanation-runtime.test.mjs > "$RUNNER_TEMP/pr342-node.log" 2>&1
          code=$?
          tests="$(grep -E '^# tests ' "$RUNNER_TEMP/pr342-node.log" | tail -1 | awk '{print $3}')"
          passed="$(grep -E '^# pass ' "$RUNNER_TEMP/pr342-node.log" | tail -1 | awk '{print $3}')"
          failed="$(grep -E '^# fail ' "$RUNNER_TEMP/pr342-node.log" | tail -1 | awk '{print $3}')"
          {
            echo "tests=${tests:-0}"
            echo "passed=${passed:-0}"
            echo "failed=${failed:--1}"
          } >> "$GITHUB_OUTPUT"
          [[ "$code" == 0 && "$tests" == 10 && "$passed" == 10 && "$failed" == 0 ]]

      - name: Focused Python contracts 14 of 14
        id: python_contract
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          python -m unittest -v tests.test_trainingos_classroom_explanation_contract > "$RUNNER_TEMP/pr342-python.log" 2>&1
          code=$?
          tests="$(grep -E '^Ran [0-9]+ tests?' "$RUNNER_TEMP/pr342-python.log" | tail -1 | awk '{print $2}')"
          echo "tests=${tests:-0}" >> "$GITHUB_OUTPUT"
          [[ "$code" == 0 && "$tests" == 14 ]]
          grep -qx 'OK' "$RUNNER_TEMP/pr342-python.log"

      - name: Install exact dependencies
        id: install
        working-directory: private-repo
        shell: bash
        run: npm ci > "$RUNNER_TEMP/pr342-install.log" 2>&1

      - name: Classroom Intelligence package contracts
        id: intelligence
        working-directory: private-repo
        shell: bash
        run: npm --prefix packages/training-classroom-intelligence test > "$RUNNER_TEMP/pr342-intelligence.log" 2>&1

      - name: Repository typecheck
        id: typecheck
        working-directory: private-repo
        shell: bash
        run: npm run typecheck > "$RUNNER_TEMP/pr342-typecheck.log" 2>&1

      - name: Production build
        id: build
        working-directory: private-repo
        shell: bash
        run: npm run build > "$RUNNER_TEMP/pr342-build.log" 2>&1

      - name: Publish sanitized application result
        if: always()
        env:
          ACTUAL_SHA: ${{ steps.scope.outputs.actual_sha }}
          MERGE_BASE: ${{ steps.scope.outputs.merge_base }}
          AHEAD: ${{ steps.scope.outputs.ahead }}
          BEHIND: ${{ steps.scope.outputs.behind }}
          FILES: ${{ steps.scope.outputs.file_count }}
          MIGRATIONS: ${{ steps.scope.outputs.migration_count }}
          NODE_TESTS: ${{ steps.node_contract.outputs.tests }}
          NODE_PASSED: ${{ steps.node_contract.outputs.passed }}
          PYTHON_TESTS: ${{ steps.python_contract.outputs.tests }}
        shell: bash
        run: |
          {
            echo '## PR #342 exact-head application gates'
            echo
            echo "- Exact private SHA: \`${ACTUAL_SHA:-$PRIVATE_SHA}\`"
            echo "- Exact merge base: \`${MERGE_BASE:-$BASE_SHA}\`"
            echo "- Posture: **ahead ${AHEAD:-0} / behind ${BEHIND:-0}**"
            echo "- Scope: **${FILES:-0} files / ${MIGRATIONS:-0} migrations**"
            echo '- JavaScript syntax: **PASS 2/2**'
            echo "- Focused Node: **${NODE_PASSED:-0}/${NODE_TESTS:-0}**"
            echo "- Focused Python: **${PYTHON_TESTS:-0}/14**"
            echo '- Dependency install: **PASS**'
            echo '- Classroom Intelligence: **PASS**'
            echo '- Typecheck: **PASS**'
            echo '- Production build: **PASS**'
            echo
            echo 'Raw private source and all command output remain sealed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private checkout and sealed application logs
        if: always()
        shell: bash
        run: rm -rf private-repo "$RUNNER_TEMP"/pr342-*.log

      - name: Final application enforcement
        if: always()
        env:
          CREDENTIAL: ${{ steps.credential.outcome }}
          SCOPE: ${{ steps.scope.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          NODE_STATUS: ${{ steps.node_contract.outcome }}
          NODE_TESTS: ${{ steps.node_contract.outputs.tests }}
          NODE_PASSED: ${{ steps.node_contract.outputs.passed }}
          NODE_FAILED: ${{ steps.node_contract.outputs.failed }}
          PYTHON_STATUS: ${{ steps.python_contract.outcome }}
          PYTHON_TESTS: ${{ steps.python_contract.outputs.tests }}
          INSTALL: ${{ steps.install.outcome }}
          INTELLIGENCE: ${{ steps.intelligence.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CREDENTIAL" == success ]]
          [[ "$SCOPE" == success ]]
          [[ "$SYNTAX" == success ]]
          [[ "$NODE_STATUS" == success && "$NODE_TESTS" == 10 && "$NODE_PASSED" == 10 && "$NODE_FAILED" == 0 ]]
          [[ "$PYTHON_STATUS" == success && "$PYTHON_TESTS" == 14 ]]
          [[ "$INSTALL" == success ]]
          [[ "$INTELLIGENCE" == success ]]
          [[ "$TYPECHECK" == success ]]
          [[ "$BUILD" == success ]]

  isolated-database-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Validate exact inputs and read-only credential
        id: credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]

      - name: Check out exact private candidate
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Start isolated database and replay all migrations
        id: first_replay
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$PRIVATE_SHA")" == "$BASE_SHA" ]]
          supabase start > "$RUNNER_TEMP/pr342-db-start.log" 2>&1
          eval "$(supabase status -o env 2>/dev/null | grep '^DB_URL=')"
          [[ -n "${DB_URL:-}" ]]
          echo "db_url=$DB_URL" >> "$GITHUB_OUTPUT"
          echo PASS > "$RUNNER_TEMP/pr342-first-replay.status"

      - name: First SQL E2E and rollback evidence
        id: first_e2e
        working-directory: private-repo
        env:
          DB_URL: ${{ steps.first_replay.outputs.db_url }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -1 -v ON_ERROR_STOP=1 -At -f tests/sql/trainingos_classroom_explanation_e2e.sql > "$RUNNER_TEMP/pr342-first-e2e.out" 2> "$RUNNER_TEMP/pr342-first-e2e.err"
          python - "$RUNNER_TEMP/pr342-first-e2e.out" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace').splitlines()
          payload = next((json.loads(line) for line in reversed(lines) if line.strip().startswith('{')), None)
          required = (
              'oneActiveExplanationEnforced','activeSlotReleasedAfterUpload','secondExplanationStarted',
              'classEndedStartRejected','agentRecordingRejected','agentInferencePersisted',
              'prohibitedCandidateRejected','teacherEvaluationConfirmed','agentConfirmRejected',
              'staleVersionRejected','staleTranscriptRejected','crossClassRejected',
              'transcriptUpdateRejected','transcriptDeleteRejected','rawAudioHidden',
              'idempotencyConflictRejected','transcriptIdempotencyConflictRejected',
          )
          remaining = {k:v for k,v in (payload or {}).items() if k.startswith('remaining')}
          valid = bool(payload) and payload.get('status') == 'PASS' and payload.get('fixtureCleanup') == 'PLPGSQL_SUBTRANSACTION_ROLLBACK' and all(payload.get(k) is True for k in required) and bool(remaining) and all(v == 0 for v in remaining.values())
          with open(sys.argv[2], 'a', encoding='utf-8') as out:
              out.write(f"status={(payload or {}).get('status','MISSING')}\n")
              out.write(f"valid={str(valid).lower()}\n")
              out.write(f"remaining_count={len(remaining)}\n")
              out.write(f"remaining_zero={str(bool(remaining) and all(v == 0 for v in remaining.values())).lower()}\n")
          raise SystemExit(0 if valid else 1)
          PY

      - name: Canonical RLS ACL private-helper and append-only catalog checks
        id: catalog
        working-directory: private-repo
        env:
          DB_URL: ${{ steps.first_replay.outputs.db_url }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(psql "$DB_URL" -X -Atv ON_ERROR_STOP=1 <<'SQL'
          with expected_tables(name) as (
            values
              ('trainingos_classroom_explanations'),
              ('trainingos_classroom_explanation_captures'),
              ('trainingos_classroom_explanation_transcript_imports'),
              ('trainingos_classroom_explanation_speech_turns'),
              ('trainingos_classroom_explanation_analysis_candidates'),
              ('trainingos_classroom_explanation_evaluations'),
              ('trainingos_classroom_explanation_events')
          ), table_security as (
            select count(*) filter (where c.relrowsecurity and c.relforcerowsecurity) secure_count
            from expected_tables e
            join pg_class c on c.relname=e.name
            join pg_namespace n on n.oid=c.relnamespace and n.nspname='public'
          ), raw_grants as (
            select count(*) grant_count
            from information_schema.role_table_grants g
            join expected_tables e on e.name=g.table_name
            where g.table_schema='public'
              and g.grantee in ('PUBLIC','anon','authenticated',('service' || '_role'))
          ), private_grants as (
            select count(*) grant_count
            from information_schema.routine_privileges r
            where r.specific_schema='private'
              and r.routine_name like 'trainingos_classroom_explanation%'
              and r.grantee in ('PUBLIC','anon','authenticated',('service' || '_role'))
          ), active_index as (
            select count(*) index_count
            from pg_indexes
            where schemaname='public'
              and tablename='trainingos_classroom_explanations'
              and indexdef ilike '%started%capture_open%'
          ), immutable_triggers as (
            select count(*) trigger_count
            from pg_trigger t
            join pg_class c on c.oid=t.tgrelid
            join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and not t.tgisinternal
              and c.relname in (
                'trainingos_classroom_explanation_transcript_imports',
                'trainingos_classroom_explanation_speech_turns',
                'trainingos_classroom_explanation_analysis_candidates',
                'trainingos_classroom_explanation_evaluations',
                'trainingos_classroom_explanation_events'
              )
              and pg_get_triggerdef(t.oid) ilike '%append_only%'
          )
          select jsonb_build_object(
            'rlsForcedCount',(select secure_count from table_security),
            'rawGrantCount',(select grant_count from raw_grants),
            'privateHelperGrantCount',(select grant_count from private_grants),
            'activeIndexCount',(select index_count from active_index),
            'appendOnlyTriggerCount',(select trigger_count from immutable_triggers)
          );
          SQL
          )"
          python - "$result" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          value=json.loads(sys.argv[1])
          valid=(value.get('rlsForcedCount')==7 and value.get('rawGrantCount')==0 and value.get('privateHelperGrantCount')==0 and value.get('activeIndexCount',0)>=1 and value.get('appendOnlyTriggerCount',0)>=5)
          with open(sys.argv[2],'a',encoding='utf-8') as out:
              for key,val in value.items(): out.write(f'{key}={val}\n')
              out.write(f'valid={str(valid).lower()}\n')
          raise SystemExit(0 if valid else 1)
          PY

      - name: Second deterministic full migration replay
        id: second_replay
        working-directory: private-repo
        env:
          DB_URL: ${{ steps.first_replay.outputs.db_url }}
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed > "$RUNNER_TEMP/pr342-db-reset.log" 2>&1
          echo PASS > "$RUNNER_TEMP/pr342-second-replay.status"

      - name: Second SQL E2E and zero-residue evidence
        id: second_e2e
        working-directory: private-repo
        env:
          DB_URL: ${{ steps.first_replay.outputs.db_url }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -1 -v ON_ERROR_STOP=1 -At -f tests/sql/trainingos_classroom_explanation_e2e.sql > "$RUNNER_TEMP/pr342-second-e2e.out" 2> "$RUNNER_TEMP/pr342-second-e2e.err"
          python - "$RUNNER_TEMP/pr342-second-e2e.out" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace').splitlines()
          payload = next((json.loads(line) for line in reversed(lines) if line.strip().startswith('{')), None)
          required = (
              'oneActiveExplanationEnforced','activeSlotReleasedAfterUpload','secondExplanationStarted',
              'classEndedStartRejected','agentRecordingRejected','agentInferencePersisted',
              'prohibitedCandidateRejected','teacherEvaluationConfirmed','agentConfirmRejected',
              'staleVersionRejected','staleTranscriptRejected','crossClassRejected',
              'transcriptUpdateRejected','transcriptDeleteRejected','rawAudioHidden',
              'idempotencyConflictRejected','transcriptIdempotencyConflictRejected',
          )
          remaining = {k:v for k,v in (payload or {}).items() if k.startswith('remaining')}
          valid = bool(payload) and payload.get('status') == 'PASS' and payload.get('fixtureCleanup') == 'PLPGSQL_SUBTRANSACTION_ROLLBACK' and all(payload.get(k) is True for k in required) and bool(remaining) and all(v == 0 for v in remaining.values())
          with open(sys.argv[2], 'a', encoding='utf-8') as out:
              out.write(f"status={(payload or {}).get('status','MISSING')}\n")
              out.write(f"valid={str(valid).lower()}\n")
              out.write(f"remaining_count={len(remaining)}\n")
              out.write(f"remaining_zero={str(bool(remaining) and all(v == 0 for v in remaining.values())).lower()}\n")
          raise SystemExit(0 if valid else 1)
          PY

      - name: Publish sanitized database result
        if: always()
        env:
          CREDENTIAL: ${{ steps.credential.outcome }}
          FIRST_REPLAY: ${{ steps.first_replay.outcome }}
          FIRST_E2E: ${{ steps.first_e2e.outcome }}
          FIRST_STATUS: ${{ steps.first_e2e.outputs.status }}
          FIRST_VALID: ${{ steps.first_e2e.outputs.valid }}
          FIRST_ZERO: ${{ steps.first_e2e.outputs.remaining_zero }}
          CATALOG: ${{ steps.catalog.outcome }}
          CATALOG_VALID: ${{ steps.catalog.outputs.valid }}
          RLS_COUNT: ${{ steps.catalog.outputs.rlsForcedCount }}
          RAW_GRANTS: ${{ steps.catalog.outputs.rawGrantCount }}
          PRIVATE_GRANTS: ${{ steps.catalog.outputs.privateHelperGrantCount }}
          ACTIVE_INDEX: ${{ steps.catalog.outputs.activeIndexCount }}
          APPEND_TRIGGERS: ${{ steps.catalog.outputs.appendOnlyTriggerCount }}
          SECOND_REPLAY: ${{ steps.second_replay.outcome }}
          SECOND_E2E: ${{ steps.second_e2e.outcome }}
          SECOND_STATUS: ${{ steps.second_e2e.outputs.status }}
          SECOND_VALID: ${{ steps.second_e2e.outputs.valid }}
          SECOND_ZERO: ${{ steps.second_e2e.outputs.remaining_zero }}
        shell: bash
        run: |
          report=pr342-final-database-result.txt
          {
            echo "exact_private_sha=$PRIVATE_SHA"
            echo "exact_base_sha=$BASE_SHA"
            echo "credential=${CREDENTIAL:-missing}"
            echo "first_full_replay=${FIRST_REPLAY:-missing}"
            echo "first_sql_e2e=${FIRST_E2E:-missing}"
            echo "first_status=${FIRST_STATUS:-MISSING}"
            echo "first_acceptance_valid=${FIRST_VALID:-false}"
            echo "first_remaining_zero=${FIRST_ZERO:-false}"
            echo "catalog_checks=${CATALOG:-missing}"
            echo "catalog_valid=${CATALOG_VALID:-false}"
            echo "rls_forced_count=${RLS_COUNT:-0}"
            echo "raw_grant_count=${RAW_GRANTS:-missing}"
            echo "private_helper_grant_count=${PRIVATE_GRANTS:-missing}"
            echo "active_index_count=${ACTIVE_INDEX:-0}"
            echo "append_only_trigger_count=${APPEND_TRIGGERS:-0}"
            echo "second_full_replay=${SECOND_REPLAY:-missing}"
            echo "second_sql_e2e=${SECOND_E2E:-missing}"
            echo "second_status=${SECOND_STATUS:-MISSING}"
            echo "second_acceptance_valid=${SECOND_VALID:-false}"
            echo "second_remaining_zero=${SECOND_ZERO:-false}"
            echo 'raw_database_logs_private_source_and_fixture_output=SEALED_AND_DELETED'
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          cat "$report"

      - name: Upload sanitized database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr342-final-7c575a2e-database-result
          path: pr342-final-database-result.txt
          retention-days: 3

      - name: Cleanup isolated database private checkout and sealed logs
        if: always()
        shell: bash
        run: |
          (cd private-repo && supabase stop --no-backup >/dev/null 2>&1) || true
          rm -rf private-repo "$RUNNER_TEMP"/pr342-* pr342-final-database-result.txt

      - name: Final database enforcement
        if: always()
        env:
          CREDENTIAL: ${{ steps.credential.outcome }}
          FIRST_REPLAY: ${{ steps.first_replay.outcome }}
          FIRST_E2E: ${{ steps.first_e2e.outcome }}
          FIRST_VALID: ${{ steps.first_e2e.outputs.valid }}
          FIRST_ZERO: ${{ steps.first_e2e.outputs.remaining_zero }}
          CATALOG: ${{ steps.catalog.outcome }}
          CATALOG_VALID: ${{ steps.catalog.outputs.valid }}
          SECOND_REPLAY: ${{ steps.second_replay.outcome }}
          SECOND_E2E: ${{ steps.second_e2e.outcome }}
          SECOND_VALID: ${{ steps.second_e2e.outputs.valid }}
          SECOND_ZERO: ${{ steps.second_e2e.outputs.remaining_zero }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CREDENTIAL" == success ]]
          [[ "$FIRST_REPLAY" == success ]]
          [[ "$FIRST_E2E" == success && "$FIRST_VALID" == true && "$FIRST_ZERO" == true ]]
          [[ "$CATALOG" == success && "$CATALOG_VALID" == true ]]
          [[ "$SECOND_REPLAY" == success ]]
