name: PR342 Classroom Explanation final exact-head CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr342-classroom-explanation-final-exact-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  exact-head-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRIVATE_SHA: 230f97d1be72d79dd5aeb36f8348a7a42e6e6d20
      PRIVATE_BASE_SHA: 9b8f04f29d572d22434ea577b5ed3543e4f6a2d3

    steps:
      - name: Validate exact refs and credential
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRIVATE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]

      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run sealed exact-head validation
        id: validate
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/pr342-final-exact.log"
          {
            [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]]
            [[ "$(git merge-base HEAD "$PRIVATE_BASE_SHA")" == "$PRIVATE_BASE_SHA" ]]
            changed="$(git diff --name-only "$PRIVATE_BASE_SHA"...HEAD)"
            [[ -n "$changed" ]]
            while IFS= read -r path; do
              case "$path" in
                docs/architecture/trainingos-classroom-explanation-runtime-v1.md|\
                docs/verification/trainingos-classroom-explanation-runtime-v1.md|\
                lib/trainingos-agent-gateway/classroom-explanation-*.mjs|\
                prototypes/trainingos-agent-mvp-v1/test/classroom-explanation-runtime.test.mjs|\
                supabase/migrations/2026072816*_trainingos_classroom_explanation_*.sql|\
                tests/sql/trainingos_classroom_explanation_e2e.sql|\
                tests/test_trainingos_classroom_explanation_contract.py)
                  ;;
                *)
                  echo "WINDOW1_ALLOWLIST_REJECTED"
                  exit 41
                  ;;
              esac
            done <<< "$changed"
            npm ci
            node --check lib/trainingos-agent-gateway/classroom-explanation-runtime.mjs
            node --check lib/trainingos-agent-gateway/classroom-explanation-mcp-layer.mjs
            node --test prototypes/trainingos-agent-mvp-v1/test/classroom-explanation-runtime.test.mjs
            python -m unittest -v tests.test_trainingos_classroom_explanation_contract
            npm --prefix packages/training-classroom-intelligence test
            npm run typecheck
            npm run build
          } > "$log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          python - "$log" "$GITHUB_OUTPUT" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          node_tests = sum(map(int, re.findall(r'# tests\s+(\d+)', text)))
          node_pass = sum(map(int, re.findall(r'# pass\s+(\d+)', text)))
          py = re.findall(r'Ran\s+(\d+)\s+tests?', text)
          allowlist = 'FAIL' if 'WINDOW1_ALLOWLIST_REJECTED' in text else 'PASS'
          with open(sys.argv[2], 'a', encoding='utf-8') as out:
              out.write(f'node_tests={node_tests}\n')
              out.write(f'node_pass={node_pass}\n')
              out.write(f'python_tests={py[-1] if py else 0}\n')
              out.write(f'allowlist={allowlist}\n')
          PY
          exit 0

      - name: Publish sanitized exact-head result
        if: always()
        env:
          CODE: ${{ steps.validate.outputs.exit_code }}
          NODE_TESTS: ${{ steps.validate.outputs.node_tests }}
          NODE_PASS: ${{ steps.validate.outputs.node_pass }}
          PYTHON_TESTS: ${{ steps.validate.outputs.python_tests }}
          ALLOWLIST: ${{ steps.validate.outputs.allowlist }}
        run: |
          status=FAIL
          [[ "${CODE:-1}" == "0" ]] && status=PASS
          report=pr342-classroom-explanation-final-exact.txt
          {
            echo "exact_private_sha=$PRIVATE_SHA"
            echo "exact_private_base_sha=$PRIVATE_BASE_SHA"
            echo "exact_head_validation=$status"
            echo "window1_file_allowlist=${ALLOWLIST:-MISSING}"
            echo "node_tests=${NODE_PASS:-0}/${NODE_TESTS:-0}"
            echo "python_tests=${PYTHON_TESTS:-0}"
            echo 'raw_logs_private_source_and_build_output=SEALED_AND_DELETED'
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          cat "$report"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr342-classroom-explanation-final-exact
          path: pr342-classroom-explanation-final-exact.txt
          retention-days: 3

      - name: Cleanup and enforce
        if: always()
        env:
          CODE: ${{ steps.validate.outputs.exit_code }}
          ALLOWLIST: ${{ steps.validate.outputs.allowlist }}
        run: |
          rm -rf private-repo "$RUNNER_TEMP/pr342-final-exact.log" pr342-classroom-explanation-final-exact.txt
          [[ "${CODE:-1}" == "0" ]]
          [[ "$ALLOWLIST" == "PASS" ]]
