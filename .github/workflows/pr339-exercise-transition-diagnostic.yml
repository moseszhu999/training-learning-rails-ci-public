name: PR339 exercise transition diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr339-exercise-transition-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_SHA: c5f101def0853baebbe27f8ec256698b3b44a6ed
  BASE_SHA: e15dbe5d1e6513c8b1816d61c8e0978fdaebaae0
  DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      guard: ${{ steps.guard.outputs.guard }}
      trigger_order: ${{ steps.guard.outputs.trigger_order }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Start exact canonical database
        working-directory: private-repo
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/pr339-guard-db"
          supabase --workdir "$workdir" init --force --yes >/dev/null 2>&1
          python scripts/build-trainingos-fresh-bootstrap.py --repo-root "$PWD" --output-dir "$workdir/supabase/migrations" --commit-sha "$PRIVATE_SHA" >/dev/null 2>&1
          supabase --workdir "$workdir" start >/dev/null 2>&1
      - name: Publish bounded transition guard
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          definition="$(psql "$DB_URL" -X -Atv ON_ERROR_STOP=1 <<'SQL'
          select p.prosrc
          from pg_catalog.pg_proc p
          join pg_catalog.pg_namespace n on n.oid=p.pronamespace
          where p.proname='validate_exercise_submission_scope'
          order by n.nspname
          limit 1;
          SQL
          )"
          triggers="$(psql "$DB_URL" -X -Atv ON_ERROR_STOP=1 <<'SQL'
          select string_agg(t.tgname,',' order by t.tgname)
          from pg_catalog.pg_trigger t
          where t.tgrelid='public.exercise_submissions'::pg_catalog.regclass
            and not t.tgisinternal;
          SQL
          )"
          guard="$(python - "$definition" <<'PY'
          import re,sys
          text=sys.argv[1]
          lines=text.splitlines()
          idx=next((i for i,x in enumerate(lines) if 'student_transition_invalid' in x.lower()),-1)
          part=' '.join(x.strip() for x in lines[max(0,idx-13):idx+3]) if idx>=0 else 'NOT_FOUND'
          part=re.sub(r'\s+',' ',part)
          part=re.sub(r'[^A-Za-z0-9_''(),.=<>: |!-]+','_',part)
          print(part[:700])
          PY
          )"
          echo "guard=$guard" >> "$GITHUB_OUTPUT"
          echo "trigger_order=$triggers" >> "$GITHUB_OUTPUT"
      - name: Cleanup
        if: always()
        run: |
          supabase --workdir "$RUNNER_TEMP/pr339-guard-db" stop --no-backup >/dev/null 2>&1 || true
          rm -rf private-repo "$RUNNER_TEMP"/pr339-*

  disposition:
    if: always()
    needs: inspect
    name: guard-${{ needs.inspect.outputs.trigger_order }}-${{ needs.inspect.outputs.guard }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo bounded_guard_published=true >> "$GITHUB_STEP_SUMMARY"
