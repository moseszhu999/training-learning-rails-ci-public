name: PR339 PostgreSQL error diagnostic v3

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr339-db-error-diagnostic-v3.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_SHA: dddfec403fad343ce22af1c61dc1b7c5e1ad6215

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Execute sealed canonical bootstrap
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          workdir="$RUNNER_TEMP/pr339-error-v3"
          mkdir -p "$workdir"
          supabase --workdir "$workdir" init --force --yes >/dev/null 2>&1
          python scripts/build-trainingos-fresh-bootstrap.py --repo-root "$PWD" --output-dir "$workdir/supabase/migrations" --commit-sha "$PRIVATE_SHA" >/dev/null 2>&1
          supabase --workdir "$workdir" start --debug > "$RUNNER_TEMP/pr339-error-v3.log" 2>&1
          code=$?
          set -e
          python - "$RUNNER_TEMP/pr339-error-v3.log" "$code" <<'PY' | tee "$GITHUB_WORKSPACE/pr339-db-error-v3.txt" >> "$GITHUB_STEP_SUMMARY"
          import pathlib,re,sys
          raw=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          text=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',raw)
          patterns={
            'parameter_rename':r'cannot change name of input parameter\s+"([^"]+)"',
            'return_type_change':r'cannot change return type of existing function',
            'same_signature':r'function\s+"?([^"\n]+?)"?\s+already exists with same argument types',
            'duplicate_column':r'column\s+"([^"]+)"\s+of relation\s+"([^"]+)"\s+already exists',
            'duplicate_relation':r'relation\s+"([^"]+)"\s+already exists',
            'duplicate_constraint':r'constraint\s+"([^"]+)"\s+for relation\s+"([^"]+)"\s+already exists',
            'duplicate_trigger':r'trigger\s+"([^"]+)"\s+for relation\s+"([^"]+)"\s+already exists',
            'missing_object':r'(?:relation|function|column|type|schema)\s+"([^"]+)"\s+does not exist',
            'syntax':r'syntax error at or near\s+"([^"]+)"',
          }
          findings=[]
          for kind,pattern in patterns.items():
              for match in re.finditer(pattern,text,re.I):
                  value='|'.join(' '.join(x.split()) for x in match.groups() if x)[:220]
                  token=f'{kind}:{value or "true"}'
                  if token not in findings: findings.append(token)
          states=[]
          for pattern in (r'SQLSTATE\s*[:=]?\s*([0-9A-Z]{5})',r'SQL state:\s*([0-9A-Z]{5})',r'\bcode\s*[:=]\s*([0-9A-Z]{5})'):
              states.extend(re.findall(pattern,text,re.I))
          statement_numbers=re.findall(r'(?:At statement|statement index|statement)\s*[:#]?\s*(\d+)',text,re.I)
          messages=[]
          for line in text.splitlines():
              clean=' '.join(line.split())
              low=clean.lower()
              if not any(t in low for t in ('error:', 'sqlerror', 'failed to execute statement', 'cannot change ', 'already exists with same argument', 'does not exist', 'syntax error', 'hint:', 'detail:')):
                  continue
              if re.match(r'^(create|alter|drop|insert|update|delete|select|grant|revoke|comment|do\s|begin|commit)\b',clean,re.I):
                  clean='<sql-statement-redacted>'
              clean=re.sub(r'[0-9a-f]{8}-[0-9a-f-]{27,}','<uuid>',clean,flags=re.I)
              clean=re.sub(r'/home/runner/[^ :]+','<runner-path>',clean)
              clean=re.sub(r'postgresql://\S+','<database-url>',clean)
              clean=clean[:420]
              if clean not in messages: messages.append(clean)
          migrations=re.findall(r'Applying migration\s+([^\s]+)',text)
          print(f'exact_private_sha=dddfec403fad343ce22af1c61dc1b7c5e1ad6215')
          print(f'start_exit={sys.argv[2]}')
          print(f'last_migration={migrations[-1] if migrations else "NONE"}')
          print(f'sqlstates={"|".join(dict.fromkeys(states)) if states else "NONE"}')
          print(f'statement_numbers={"|".join(dict.fromkeys(statement_numbers[-8:])) if statement_numbers else "NONE"}')
          print(f'findings={"|".join(findings[:8]) if findings else "NONE"}')
          print(f'messages={" || ".join(messages[-8:]) if messages else "NONE"}')
          print('raw_sql_and_private_output=SEALED_AND_DELETED')
          PY
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr339-db-error-v3
          path: pr339-db-error-v3.txt
          retention-days: 3
      - name: Cleanup
        if: always()
        run: |
          supabase --workdir "$RUNNER_TEMP/pr339-error-v3" stop --no-backup >/dev/null 2>&1 || true
          rm -rf private-repo "$RUNNER_TEMP"/pr339-error-v3* pr339-db-error-v3.txt
