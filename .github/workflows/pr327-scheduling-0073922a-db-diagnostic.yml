name: PR327 Scheduling Runtime database diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr327-scheduling-0073922a-db-diagnostic-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sanitized-database-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRIVATE_SHA: 0073922ae1ebda5f19e3c6b22d84324976e9a691
      LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run one fresh replay and capture only stable SQL error
        id: diagnostic
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          workdir="$RUNNER_TEMP/pr327-diagnostic-supabase"
          raw="$RUNNER_TEMP/pr327-diagnostic-raw.log"
          stdout="$RUNNER_TEMP/pr327-diagnostic-out.txt"
          stderr="$RUNNER_TEMP/pr327-diagnostic-err.txt"
          rm -rf "$workdir" && mkdir -p "$workdir"
          {
            [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]]
            supabase --workdir "$workdir" init --force --yes
            python scripts/build-trainingos-fresh-bootstrap.py \
              --repo-root "$PWD" \
              --output-dir "$workdir/supabase/migrations" \
              --commit-sha "$PRIVATE_SHA"
            supabase --workdir "$workdir" start
            supabase --workdir "$workdir" db reset --local --no-seed
            psql "$LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At \
              -f tests/sql/trainingos_scheduling_delivery_runtime_v2_replay.sql >/dev/null
          } > "$raw" 2>&1
          setup_code=$?
          e2e_code=99
          if [[ "$setup_code" == 0 ]]; then
            psql "$LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At \
              -f tests/sql/trainingos_scheduling_delivery_runtime_v2_e2e.sql \
              > "$stdout" 2> "$stderr"
            e2e_code=$?
          fi
          python - "$setup_code" "$e2e_code" "$stdout" "$stderr" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          setup_code, e2e_code = map(int, sys.argv[1:3])
          stdout, stderr, output = map(pathlib.Path, sys.argv[3:])
          payload = {}
          if stdout.exists():
              for line in reversed(stdout.read_text(encoding='utf-8', errors='replace').splitlines()):
                  line = line.strip()
                  if line.startswith('{'):
                      try: payload = json.loads(line); break
                      except json.JSONDecodeError: pass
          error_text = stderr.read_text(encoding='utf-8', errors='replace') if stderr.exists() else ''
          match = re.search(r'ERROR:\s+([^\r\n]+)', error_text)
          stable = match.group(1).strip() if match else ('SETUP_FAILED' if setup_code else 'NO_STABLE_SQL_ERROR')
          stable = re.sub(r'[^A-Za-z0-9_ :.,()\-]', '?', stable)[:180]
          status = 'PASS' if setup_code == 0 and e2e_code == 0 and payload.get('status') == 'PASS' else 'FAIL'
          with output.open('a', encoding='utf-8') as out:
              out.write(f'status={status}\nsetup_code={setup_code}\ne2e_code={e2e_code}\n')
              out.write(f'stable_error={stable}\n')
          PY
          exit 0

      - name: Publish sanitized diagnostic
        if: always()
        shell: bash
        env:
          STATUS: ${{ steps.diagnostic.outputs.status }}
          SETUP_CODE: ${{ steps.diagnostic.outputs.setup_code }}
          E2E_CODE: ${{ steps.diagnostic.outputs.e2e_code }}
          STABLE_ERROR: ${{ steps.diagnostic.outputs.stable_error }}
        run: |
          {
            echo "exact_private_sha=$PRIVATE_SHA"
            echo "diagnostic_status=${STATUS:-FAIL}"
            echo "setup_code=${SETUP_CODE:-99}"
            echo "e2e_code=${E2E_CODE:-99}"
            echo "stable_sql_error=${STABLE_ERROR:-MISSING}"
            echo "raw_private_database_output=SEALED_AND_DELETED"
          } > pr327-scheduling-db-diagnostic.txt
          cat pr327-scheduling-db-diagnostic.txt >> "$GITHUB_STEP_SUMMARY"
          cat pr327-scheduling-db-diagnostic.txt

      - name: Upload sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr327-scheduling-db-diagnostic
          path: pr327-scheduling-db-diagnostic.txt
          retention-days: 3

      - name: Cleanup and enforce diagnostic
        if: always()
        shell: bash
        env:
          STATUS: ${{ steps.diagnostic.outputs.status }}
        run: |
          supabase --workdir "$RUNNER_TEMP/pr327-diagnostic-supabase" stop --no-backup >/dev/null 2>&1 || true
          rm -rf private-repo "$RUNNER_TEMP/pr327-diagnostic-supabase" "$RUNNER_TEMP"/pr327-diagnostic-* pr327-scheduling-db-diagnostic.txt
          [[ "$STATUS" == PASS ]]
