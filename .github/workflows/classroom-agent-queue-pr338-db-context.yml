name: Classroom Agent Queue PR338 DB contract diagnosis

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/classroom-agent-queue-pr338-db-context.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitized-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PRIVATE_SHA: 72038282775db0142f615a0bc97c796644fa58b8
      BASE_SHA: 9b8f04f29d572d22434ea577b5ed3543e4f6a2d3
      MAIN_SHA: a2875b971b513f667caa67272eb4271485d2858c
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Diagnose canonical trigger anchor and candidate fix
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C private-repo rev-parse HEAD)" == "$PRIVATE_SHA" ]]
          [[ "$(git -C private-repo merge-base "$BASE_SHA" "$PRIVATE_SHA")" == "$BASE_SHA" ]]
          mkdir -p replay-project sanitized held-migrations
          supabase --workdir replay-project init --force --yes >/dev/null
          rm -rf replay-project/supabase/migrations
          python private-repo/scripts/build-trainingos-fresh-bootstrap.py \
            --repo-root private-repo \
            --output-dir replay-project/supabase/migrations \
            --commit-sha "$PRIVATE_SHA" >/dev/null

          target="replay-project/supabase/migrations/20260728180000_trainingos_classroom_agent_queue_integration_v1.sql"
          cp "$target" held-migrations/original.sql
          rm -f \
            replay-project/supabase/migrations/20260728180000_trainingos_classroom_agent_queue_integration_v1.sql \
            replay-project/supabase/migrations/20260728190000_trainingos_classroom_zoom_adapter_schema_v1.sql \
            replay-project/supabase/migrations/20260728190100_trainingos_classroom_zoom_adapter_rpc_v1.sql

          supabase --workdir replay-project start > "$RUNNER_TEMP/pr338-base-start.log" 2>&1
          eval "$(supabase --workdir replay-project status -o env | grep '^DB_URL=')"

          psql "$DB_URL" -X -At -v ON_ERROR_STOP=1 > "$RUNNER_TEMP/pr338-base-definitions.txt" <<'SQL'
          select pg_get_functiondef(p.oid)
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public'
            and p.proname in ('get_trainingos_teacher_action_queue','trigger_trainingos_teacher_agent_from_queue')
          order by p.proname,pg_get_function_identity_arguments(p.oid);
          SQL

          {
            echo "private_sha=$PRIVATE_SHA"
            echo "base_sha=$BASE_SHA"
            echo "main_sha=$MAIN_SHA"
            echo "private_tree=$(git -C private-repo rev-parse "$PRIVATE_SHA^{tree}")"
            echo "main_tree=$(git -C private-repo rev-parse "$MAIN_SHA^{tree}")"
            echo '[base_queue_contract_lines]'
            grep -Ei 'p_limit|LIMIT_INVALID|get_trainingos_teacher_action_queue\(' "$RUNNER_TEMP/pr338-base-definitions.txt" | head -40 || true
            echo '[base_confirmation_guard_context]'
            grep -n -Ei -B6 -A10 'v_requires_human|suggestion_only' "$RUNNER_TEMP/pr338-base-definitions.txt" | head -80 || true
          } > sanitized/pr338-db-context.txt

          set +e
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f held-migrations/original.sql \
            > "$RUNNER_TEMP/pr338-original.log" 2>&1
          original_code=$?
          set -e
          {
            echo "original_status=$([[ "$original_code" == 0 ]] && echo PASS || echo FAIL)"
            echo '[original_redacted_error_context]'
            grep -Ei -B4 -A8 'TRAININGOS_[A-Z0-9_]+|SQLSTATE|CONTEXT:|PL/pgSQL|ERROR' \
              "$RUNNER_TEMP/pr338-original.log" | tail -40 | cut -c1-600 || true
          } >> sanitized/pr338-db-context.txt

          supabase --workdir replay-project db reset --local --no-seed \
            > "$RUNNER_TEMP/pr338-base-reset.log" 2>&1

          cp held-migrations/original.sql held-migrations/candidate.sql
          python - <<'PY'
          from pathlib import Path
          migration = Path('held-migrations/candidate.sql')
          definition = Path('/home/runner/work/_temp/pr338-base-definitions.txt').read_text()
          guards = []
          for raw in definition.splitlines():
              line = raw.strip()
              if 'v_requires_human' in line and line.lower().endswith(' then') and line.lower().split()[0] in {'if','elsif'}:
                  guards.append(line)
          guards = list(dict.fromkeys(guards))
          Path('sanitized/canonical-guard-candidates.txt').write_text(repr(guards) + '\n')
          if len(guards) != 1:
              raise SystemExit(f'canonical_guard_candidates={guards!r}')
          actual = guards[0]
          keyword = actual.split()[0]
          text = migration.read_text()
          anchor_decl = "v_confirmation_anchor constant text := 'elsif v_requires_human then';"
          replacement_open = '$replacement$elsif v_requires_human\n'
          if text.count(anchor_decl) != 1 or text.count(replacement_open) != 1:
              raise SystemExit('migration_confirmation_anchor_not_unique')
          text = text.replace(anchor_decl, f"v_confirmation_anchor constant text := '{actual}';")
          text = text.replace(replacement_open, f'$replacement${keyword} v_requires_human\n')
          migration.write_text(text)
          Path('sanitized/canonical-guard.txt').write_text(actual + '\n')
          PY

          set +e
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f held-migrations/candidate.sql \
            > "$RUNNER_TEMP/pr338-candidate.log" 2>&1
          candidate_code=$?
          set -e
          {
            echo "canonical_guard=$(cat sanitized/canonical-guard.txt)"
            echo "candidate_status=$([[ "$candidate_code" == 0 ]] && echo PASS || echo FAIL)"
            echo '[candidate_redacted_error_context]'
            grep -Ei -B4 -A8 'TRAININGOS_[A-Z0-9_]+|SQLSTATE|CONTEXT:|PL/pgSQL|ERROR' \
              "$RUNNER_TEMP/pr338-candidate.log" | tail -40 | cut -c1-600 || true
          } >> sanitized/pr338-db-context.txt
          rm -f sanitized/canonical-guard.txt sanitized/canonical-guard-candidates.txt

          supabase --workdir replay-project stop --no-backup || true
          rm -rf private-repo replay-project held-migrations
          rm -f "$RUNNER_TEMP"/pr338-*.log "$RUNNER_TEMP/pr338-base-definitions.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-agent-queue-pr338-db-context
          path: sanitized
          if-no-files-found: error
          retention-days: 1
