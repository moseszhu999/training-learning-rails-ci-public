name: Classroom Agent Queue PR338 DB contract diagnosis

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/classroom-agent-queue-pr338-db-context.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitized-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PRIVATE_SHA: 72038282775db0142f615a0bc97c796644fa58b8
      BASE_SHA: 9b8f04f29d572d22434ea577b5ed3543e4f6a2d3
      MAIN_SHA: a2875b971b513f667caa67272eb4271485d2858c
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Verify canonical trigger insertion candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C private-repo rev-parse HEAD)" == "$PRIVATE_SHA" ]]
          [[ "$(git -C private-repo merge-base "$BASE_SHA" "$PRIVATE_SHA")" == "$BASE_SHA" ]]
          mkdir -p replay-project sanitized held-migrations
          supabase --workdir replay-project init --force --yes >/dev/null
          rm -rf replay-project/supabase/migrations
          python private-repo/scripts/build-trainingos-fresh-bootstrap.py \
            --repo-root private-repo \
            --output-dir replay-project/supabase/migrations \
            --commit-sha "$PRIVATE_SHA" >/dev/null

          target="replay-project/supabase/migrations/20260728180000_trainingos_classroom_agent_queue_integration_v1.sql"
          cp "$target" held-migrations/original.sql
          rm -f \
            replay-project/supabase/migrations/20260728180000_trainingos_classroom_agent_queue_integration_v1.sql \
            replay-project/supabase/migrations/20260728190000_trainingos_classroom_zoom_adapter_schema_v1.sql \
            replay-project/supabase/migrations/20260728190100_trainingos_classroom_zoom_adapter_rpc_v1.sql

          supabase --workdir replay-project start > "$RUNNER_TEMP/pr338-base-start.log" 2>&1
          eval "$(supabase --workdir replay-project status -o env | grep '^DB_URL=')"

          cp held-migrations/original.sql held-migrations/candidate.sql
          python - <<'PY'
          from pathlib import Path
          migration = Path('held-migrations/candidate.sql')
          text = migration.read_text()
          old_decl = "v_confirmation_anchor constant text := 'elsif v_requires_human then';"
          old_replacement = """v_confirmation_replacement constant text := $replacement$elsif v_requires_human
      and not (
        coalesce((v_item->>'agentDraftEligible')::boolean,false)
        and v_workflow in (
          'classroom_plan_draft',
          'classroom_explanation_analysis',
          'classroom_follow_up_draft'
        )
      ) then$replacement$;"""
          new_decl = "v_confirmation_anchor constant text := $$elsif v_policy_projection->>'effectiveMode'='assisted' then$$;"
          new_replacement = """v_confirmation_replacement constant text := $replacement$elsif v_requires_human
      and not (
        coalesce((v_item->>'agentDraftEligible')::boolean,false)
        and v_workflow in (
          'classroom_plan_draft',
          'classroom_explanation_analysis',
          'classroom_follow_up_draft'
        )
      ) then
    v_disposition := 'suggestion_only';
  elsif v_policy_projection->>'effectiveMode'='assisted' then$replacement$;"""
          if text.count(old_decl) != 1 or text.count(old_replacement) != 1:
              raise SystemExit('candidate_anchor_source_not_unique')
          migration.write_text(text.replace(old_decl,new_decl).replace(old_replacement,new_replacement))
          PY

          set +e
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f held-migrations/candidate.sql \
            > "$RUNNER_TEMP/pr338-candidate.log" 2>&1
          candidate_code=$?
          set -e

          if [[ "$candidate_code" == 0 ]]; then
            trigger_definition="$(psql "$DB_URL" -X -At -v ON_ERROR_STOP=1 <<'SQL'
          select pg_get_functiondef(p.oid)
          from pg_proc p join pg_namespace n on n.oid=p.pronamespace
          where n.nspname='public'
            and p.proname='trigger_trainingos_teacher_agent_from_queue'
            and pg_get_function_identity_arguments(p.oid)='p_class_id uuid, p_device_id uuid, p_queue_item_key text, p_expected_source_version text, p_expected_source_digest text, p_trigger_key text, p_executor_context jsonb, p_trigger_context jsonb';
          SQL
          )"
            [[ "$(grep -o "elsif v_requires_human" <<<"$trigger_definition" | wc -l | tr -d ' ')" == 1 ]]
            [[ "$(grep -o "agentDraftEligible" <<<"$trigger_definition" | wc -l | tr -d ' ')" == 1 ]]
            [[ "$(grep -o "v_disposition := 'suggestion_only'" <<<"$trigger_definition" | wc -l | tr -d ' ')" -ge 2 ]]
            trigger_status=PASS
          else
            trigger_status=FAIL
          fi

          {
            echo "private_sha=$PRIVATE_SHA"
            echo "base_sha=$BASE_SHA"
            echo "main_sha=$MAIN_SHA"
            echo "private_tree=$(git -C private-repo rev-parse "$PRIVATE_SHA^{tree}")"
            echo "main_tree=$(git -C private-repo rev-parse "$MAIN_SHA^{tree}")"
            echo "candidate_status=$([[ "$candidate_code" == 0 ]] && echo PASS || echo FAIL)"
            echo "trigger_guard_status=$trigger_status"
            echo '[candidate_redacted_error_context]'
            grep -Ei -B4 -A8 'TRAININGOS_[A-Z0-9_]+|SQLSTATE|CONTEXT:|PL/pgSQL|ERROR' \
              "$RUNNER_TEMP/pr338-candidate.log" | tail -40 | cut -c1-600 || true
          } > sanitized/pr338-db-context.txt

          supabase --workdir replay-project stop --no-backup || true
          rm -rf private-repo replay-project held-migrations
          rm -f "$RUNNER_TEMP"/pr338-*.log
          [[ "$candidate_code" == 0 ]]
          [[ "$trigger_status" == PASS ]]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-agent-queue-pr338-db-context
          path: sanitized/pr338-db-context.txt
          if-no-files-found: error
          retention-days: 1
