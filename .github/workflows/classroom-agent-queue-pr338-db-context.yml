name: Classroom Agent Queue PR338 DB error context

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/classroom-agent-queue-pr338-db-context.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitized-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRIVATE_SHA: 7751ec7d0e0535036c500e315078646ef1dc81f2
      BASE_SHA: 9b8f04f29d572d22434ea577b5ed3543e4f6a2d3
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Produce redacted database error context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C private-repo rev-parse HEAD)" == "$PRIVATE_SHA" ]]
          [[ "$(git -C private-repo merge-base "$BASE_SHA" "$PRIVATE_SHA")" == "$BASE_SHA" ]]
          mkdir -p replay-project sanitized
          supabase --workdir replay-project init --force --yes >/dev/null
          rm -rf replay-project/supabase/migrations
          python private-repo/scripts/build-trainingos-fresh-bootstrap.py \
            --repo-root private-repo \
            --output-dir replay-project/supabase/migrations \
            --commit-sha "$PRIVATE_SHA" >/dev/null
          set +e
          supabase --workdir replay-project start > "$RUNNER_TEMP/pr338-db-context.log" 2>&1
          code=$?
          set -e
          applied="$(grep -c 'Applying migration ' "$RUNNER_TEMP/pr338-db-context.log" || true)"
          last="$(grep 'Applying migration ' "$RUNNER_TEMP/pr338-db-context.log" | tail -1 | sed -E 's/.*Applying migration ([A-Za-z0-9_.-]+).*/\1/' || true)"
          grep -E 'ERROR:|CONTEXT:' "$RUNNER_TEMP/pr338-db-context.log" \
            | tail -8 \
            | sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<uuid>/g; s#https?://[^ ]+#<url>#g' \
            | cut -c1-500 \
            > sanitized/error-context.txt || true
          {
            echo "private_sha=$PRIVATE_SHA"
            echo "base_sha=$BASE_SHA"
            echo "status=$([[ "$code" == 0 ]] && echo PASS || echo FAIL)"
            echo "applied_count=$applied"
            echo "last_migration=${last:-none}"
            echo '[redacted_error_context]'
            cat sanitized/error-context.txt
          } > sanitized/pr338-db-context.txt
          rm -f sanitized/error-context.txt "$RUNNER_TEMP/pr338-db-context.log"
          supabase --workdir replay-project stop --no-backup || true
          rm -rf private-repo replay-project
      - uses: actions/upload-artifact@v4
        with:
          name: classroom-agent-queue-pr338-db-context
          path: sanitized/pr338-db-context.txt
          if-no-files-found: error
          retention-days: 1
