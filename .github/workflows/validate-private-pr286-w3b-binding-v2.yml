name: Validate private TrainingOS PR 286 exact head

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/validate-private-pr286-w3b-binding-v2.yml

permissions:
  contents: read

concurrency:
  group: private-pr286-3e9da22be591206f933e9bbf5ca88446beeeca8d
  cancel-in-progress: false

jobs:
  exact-head-validation:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ci/verify-private-pr286-w3b-binding-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRIVATE_SHA: 3e9da22be591206f933e9bbf5ca88446beeeca8d
    outputs:
      python_status: ${{ steps.python.outputs.status }}
      python_count: ${{ steps.python.outputs.count }}
      node_status: ${{ steps.node.outputs.status }}
      node_count: ${{ steps.node.outputs.count }}
      node_pass: ${{ steps.node.outputs.pass }}
      node_fail: ${{ steps.node.outputs.fail }}
      owned_status: ${{ steps.sanitize.outputs.owned_status }}
      owned_step: ${{ steps.sanitize.outputs.owned_step }}
      owned_exit: ${{ steps.owned.outputs.exit_code }}

    steps:
      - name: Validate exact head and private read credential
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]

      - name: Check out private PR 286 exact head
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: 3e9da22be591206f933e9bbf5ca88446beeeca8d
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact SHA and clean checkout
        working-directory: private-repo
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Focused Python contract
        id: python
        working-directory: private-repo
        run: |
          set +e
          python -m unittest -v \
            tests.test_trainingos_wave3_enterprise_report_w3b_binding_v2_contract \
            > "$RUNNER_TEMP/pr286-python.log" 2>&1
          code=$?
          python - "$RUNNER_TEMP/pr286-python.log" "$code" "$GITHUB_OUTPUT" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          code = int(sys.argv[2])
          match = re.search(r'Ran\s+(\d+)\s+tests?', text)
          count = int(match.group(1)) if match else 0
          ok = code == 0 and count == 12 and re.search(r'(?:^|\n)OK(?:\s|\n|$)', text) is not None
          with open(sys.argv[3], 'a', encoding='utf-8') as out:
              out.write(f'status={"PASS" if ok else "FAIL"}\n')
              out.write(f'count={count}\n')
          PY
          exit 0

      - name: Focused Node contracts
        id: node
        working-directory: private-repo
        run: |
          set +e
          node --test \
            prototypes/trainingos-agent-mvp-v1/test/enterprise-report-w3a-integration.test.mjs \
            prototypes/trainingos-agent-mvp-v1/test/enterprise-report-w3b-integration.test.mjs \
            > "$RUNNER_TEMP/pr286-node.log" 2>&1
          code=$?
          python - "$RUNNER_TEMP/pr286-node.log" "$code" "$GITHUB_OUTPUT" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          code = int(sys.argv[2])
          def metric(name):
              match = re.search(rf'^#\s+{name}\s+(\d+)\s*$', text, re.MULTILINE)
              return int(match.group(1)) if match else 0
          count = metric('tests')
          passed = metric('pass')
          failed = metric('fail')
          ok = code == 0 and (count, passed, failed) == (6, 6, 0)
          with open(sys.argv[3], 'a', encoding='utf-8') as out:
              out.write(f'status={"PASS" if ok else "FAIL"}\n')
              out.write(f'count={count}\n')
              out.write(f'pass={passed}\n')
              out.write(f'fail={failed}\n')
          PY
          exit 0

      - name: Full owned CI
        id: owned
        working-directory: private-repo
        env:
          TRAININGOS_CI_INSTALL: always
          TRAININGOS_CI_INCLUDE_PLAYWRIGHT: '0'
          TRAININGOS_CI_OUTPUT_DIR: ${{ github.workspace }}/private-repo/.trainingos-ci
        run: |
          set +e
          npm run ci:owned > "$RUNNER_TEMP/pr286-owned.log" 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish sanitized result
        id: sanitize
        if: always()
        env:
          REPORT: ${{ github.workspace }}/private-repo/.trainingos-ci/owned-container-ci-report.json
          OWNED_EXIT: ${{ steps.owned.outputs.exit_code }}
          PY_STATUS: ${{ steps.python.outputs.status }}
          PY_COUNT: ${{ steps.python.outputs.count }}
          NODE_STATUS: ${{ steps.node.outputs.status }}
          NODE_COUNT: ${{ steps.node.outputs.count }}
          NODE_PASS: ${{ steps.node.outputs.pass }}
          NODE_FAIL: ${{ steps.node.outputs.fail }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          let owned = {
            status: process.env.OWNED_EXIT === '0' ? 'PASS' : 'FAIL',
            failedOrLastStep: 'report-unavailable',
          };
          try {
            if (fs.existsSync(process.env.REPORT)) {
              const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
              owned = {
                status: report.status === 'PASS' ? 'PASS' : 'FAIL',
                failedOrLastStep: String(report.failedOrLastStep || 'unknown'),
              };
            }
          } catch {
            owned = { status: 'FAIL', failedOrLastStep: 'invalid-report' };
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `owned_status=${owned.status}\nowned_step=${owned.failedOrLastStep}\n`);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '## TrainingOS PR 286 exact-head validation',
              '',
              `- SHA: \`${process.env.PRIVATE_SHA}\``,
              `- Python: **${process.env.PY_STATUS || 'FAIL'} ${process.env.PY_COUNT || '0'}/12**`,
              `- Node: **${process.env.NODE_STATUS || 'FAIL'} ${process.env.NODE_PASS || '0'}/${process.env.NODE_COUNT || '0'}**, fail ${process.env.NODE_FAIL || '0'}`,
              `- ci:owned: **${owned.status}** (${owned.failedOrLastStep})`,
              '',
              'Raw private output remained sealed and was deleted.',
            ].join('\n') + '\n',
          );
          NODE

      - name: Cleanup private checkout and sealed logs
        if: always()
        run: |
          rm -rf private-repo \
            "$RUNNER_TEMP/pr286-python.log" \
            "$RUNNER_TEMP/pr286-node.log" \
            "$RUNNER_TEMP/pr286-owned.log"

  enforce-results:
    needs: exact-head-validation
    if: always()
    name: >-
      result python-${{ needs.exact-head-validation.outputs.python_status }}-${{ needs.exact-head-validation.outputs.python_count }}
      node-${{ needs.exact-head-validation.outputs.node_status }}-${{ needs.exact-head-validation.outputs.node_pass }}
      owned-${{ needs.exact-head-validation.outputs.owned_status }}-${{ needs.exact-head-validation.outputs.owned_step }}
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce sanitized results
        env:
          PY_STATUS: ${{ needs.exact-head-validation.outputs.python_status }}
          PY_COUNT: ${{ needs.exact-head-validation.outputs.python_count }}
          NODE_STATUS: ${{ needs.exact-head-validation.outputs.node_status }}
          NODE_COUNT: ${{ needs.exact-head-validation.outputs.node_count }}
          NODE_PASS: ${{ needs.exact-head-validation.outputs.node_pass }}
          NODE_FAIL: ${{ needs.exact-head-validation.outputs.node_fail }}
          OWNED_STATUS: ${{ needs.exact-head-validation.outputs.owned_status }}
          OWNED_EXIT: ${{ needs.exact-head-validation.outputs.owned_exit }}
        run: |
          [[ "$PY_STATUS" == PASS && "$PY_COUNT" == 12 ]]
          [[ "$NODE_STATUS" == PASS && "$NODE_COUNT" == 6 && "$NODE_PASS" == 6 && "$NODE_FAIL" == 0 ]]
          [[ "$OWNED_STATUS" == PASS && "$OWNED_EXIT" == 0 ]]
