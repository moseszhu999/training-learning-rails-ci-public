name: PR340 database catalog diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr340-db-catalog-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_SHA: 0df28f3d4056cc8aa2b65baa30981713a02f5b6a
  DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Build canonical database and emit bounded catalog counts
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/pr340-catalog"
          mkdir -p "$workdir"
          supabase --workdir "$workdir" init --force --yes > "$RUNNER_TEMP/pr340-catalog-init.log" 2>&1
          python scripts/build-trainingos-fresh-bootstrap.py --repo-root "$PWD" --output-dir "$workdir/supabase/migrations" --commit-sha "$PRIVATE_SHA" > "$RUNNER_TEMP/pr340-catalog-bootstrap.log" 2>&1
          supabase --workdir "$workdir" start > "$RUNNER_TEMP/pr340-catalog-start.log" 2>&1
          catalog="$(psql "$DB_URL" -X -Atv ON_ERROR_STOP=1 <<'SQL'
          with expected_tables(name) as (
            values ('trainingos_classroom_lark_meeting_bindings'),('trainingos_classroom_lark_recording_events'),('trainingos_classroom_lark_minute_sources'),('trainingos_classroom_lark_transcripts'),('trainingos_classroom_lark_speaker_candidates'),('trainingos_classroom_lark_speaker_confirmations'),('trainingos_classroom_lark_audit_events')
          ), expected_triggers(name) as (
            values ('trainingos_lark_binding_immutable'),('trainingos_lark_recording_event_immutable'),('trainingos_lark_minute_source_immutable'),('trainingos_lark_transcript_immutable'),('trainingos_lark_candidate_immutable'),('trainingos_lark_confirmation_immutable'),('trainingos_lark_audit_immutable')
          )
          select jsonb_build_object(
            'tables',(select count(*) from expected_tables e join pg_class c on c.relname=e.name join pg_namespace n on n.oid=c.relnamespace and n.nspname='public'),
            'forced',(select count(*) from expected_tables e join pg_class c on c.relname=e.name join pg_namespace n on n.oid=c.relnamespace and n.nspname='public' where c.relrowsecurity and c.relforcerowsecurity),
            'directGrants',(select count(*) from information_schema.role_table_grants g join expected_tables e on e.name=g.table_name where g.table_schema='public' and g.grantee in ('PUBLIC','anon','authenticated','service_role')),
            'privateExec',(select count(*) from information_schema.routine_privileges r where r.specific_schema='private' and r.routine_name like 'trainingos_lark%' and r.grantee in ('PUBLIC','anon','authenticated','service_role') and r.privilege_type='EXECUTE'),
            'publicFunctions',(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname like '%trainingos_lark%'),
            'securePublicEmpty',(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname like '%trainingos_lark%' and p.prosecdef and exists(select 1 from unnest(coalesce(p.proconfig,array[]::text[])) setting where setting='search_path=')),
            'securePublicQuoted',(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname like '%trainingos_lark%' and p.prosecdef and exists(select 1 from unnest(coalesce(p.proconfig,array[]::text[])) setting where setting='search_path=""')),
            'securityDefiner',(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname like '%trainingos_lark%' and p.prosecdef),
            'immutableTriggers',(select count(*) from expected_triggers e join pg_trigger t on t.tgname=e.name where not t.tgisinternal)
          );
          SQL
          )"
          {
            echo "exact_private_sha=$PRIVATE_SHA"
            echo "catalog=$catalog"
            echo 'raw_private_output=SEALED_AND_DELETED'
          } | tee "$GITHUB_WORKSPACE/pr340-db-catalog-diagnostic.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pr340-db-catalog-diagnostic
          path: pr340-db-catalog-diagnostic.txt
          retention-days: 3
      - name: Cleanup
        if: always()
        run: |
          supabase --workdir "$RUNNER_TEMP/pr340-catalog" stop --no-backup >/dev/null 2>&1 || true
          rm -rf private-repo "$RUNNER_TEMP"/pr340-catalog* pr340-db-catalog-diagnostic.txt
