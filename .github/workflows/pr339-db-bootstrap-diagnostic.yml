name: PR339 canonical bootstrap diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr339-db-bootstrap-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_SHA: dddfec403fad343ce22af1c61dc1b7c5e1ad6215
  BASE_SHA: e15dbe5d1e6513c8b1816d61c8e0978fdaebaae0

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Execute sealed bootstrap and classify
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          workdir="$RUNNER_TEMP/pr339-diag"
          mkdir -p "$workdir"
          supabase --workdir "$workdir" init --force --yes > "$RUNNER_TEMP/pr339-diag-init.log" 2>&1
          init_code=$?
          python scripts/build-trainingos-fresh-bootstrap.py --repo-root "$PWD" --output-dir "$workdir/supabase/migrations" --commit-sha "$PRIVATE_SHA" > "$RUNNER_TEMP/pr339-diag-build.log" 2>&1
          build_code=$?
          migration_count="$(find "$workdir/supabase/migrations" -type f -name '*.sql' 2>/dev/null | wc -l | tr -d ' ')"
          supabase --workdir "$workdir" start --debug > "$RUNNER_TEMP/pr339-diag-start.log" 2>&1
          start_code=$?
          set -e
          log="$RUNNER_TEMP/pr339-diag-start.log"
          last_migration="$(grep -E 'Applying migration ' "$log" | tail -1 | sed -E 's/.*Applying migration[[:space:]]+([^[:space:]]+).*/\1/' | tr -cd 'A-Za-z0-9_.-' || true)"
          failed_migration="$(grep -E 'failed to apply migration|migration .* failed|ERROR:' "$log" | tail -15 | grep -Eo '[0-9]{8,14}_[A-Za-z0-9_.-]+\.sql' | tail -1 || true)"
          sqlstate="$(grep -Eo '(SQLSTATE|SQL state:|code:)[ =:]+[0-9A-Z]{5}' "$log" | tail -1 | grep -Eo '[0-9A-Z]{5}' | tail -1 || true)"
          kind=unknown
          grep -qi 'does not exist' "$log" && kind=dependency_object_missing
          grep -qi 'already exists' "$log" && kind=duplicate_object
          grep -qi 'syntax error' "$log" && kind=sql_syntax_error
          grep -qi 'unexpected end of function definition' "$log" && kind=unexpected_function_end
          grep -qi 'violates.*constraint' "$log" && kind=constraint_violation
          grep -qi 'permission denied' "$log" && kind=permission_denied
          grep -qiE 'docker|container|port is already allocated|health check' "$log" && kind=container_infrastructure
          marker="$(grep -Eo 'TRAININGOS_[A-Z0-9_]+' "$log" | tail -1 || true)"
          {
            echo "exact_private_sha=$PRIVATE_SHA"
            echo "exact_base_sha=$BASE_SHA"
            echo "init_exit=$init_code"
            echo "builder_exit=$build_code"
            echo "bootstrap_migration_count=${migration_count:-0}"
            echo "start_exit=$start_code"
            echo "last_migration=${last_migration:-NONE}"
            echo "failed_migration=${failed_migration:-NONE}"
            echo "sqlstate=${sqlstate:-NONE}"
            echo "classification=$kind"
            echo "trainingos_marker=${marker:-NONE}"
            echo "raw_private_output=SEALED_AND_DELETED"
          } | tee "$GITHUB_WORKSPACE/pr339-db-bootstrap-diagnostic.txt" >> "$GITHUB_STEP_SUMMARY"
          [[ $start_code -ne 0 || $build_code -ne 0 ]]
      - uses: actions/upload-artifact@v4
        with:
          name: pr339-db-bootstrap-diagnostic
          path: pr339-db-bootstrap-diagnostic.txt
          retention-days: 3
      - name: Cleanup
        if: always()
        run: |
          supabase --workdir "$RUNNER_TEMP/pr339-diag" stop --no-backup >/dev/null 2>&1 || true
          rm -rf private-repo "$RUNNER_TEMP"/pr339-diag* pr339-db-bootstrap-diagnostic.txt
