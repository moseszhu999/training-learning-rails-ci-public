name: TrainingOS #812 reconciled-head current-main validation
# Fresh binding: reconciled #812 2240e045 contains current main 8e44d06.

on:
  pull_request:
    paths:
      - '.github/workflows/trainingos-812-current-main-repair-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trainingos-812-current-main-repair-integration-v1
  cancel-in-progress: false

jobs:
  exact-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_HEAD: 2240e0457d6bbac69c671c2a18a04b8feeb1e08d
      EXPECTED_MAIN: 8e44d06a1ffe8a6f559dade1dcd8dbe0694924e5
    steps:
      - name: Validate private read credential
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout exact reconciled TrainingOS #812 head
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.EXPECTED_HEAD }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact head contains exact current main and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$EXPECTED_MAIN" "$EXPECTED_HEAD"
          test "$(git merge-base "$EXPECTED_MAIN" "$EXPECTED_HEAD")" = "$EXPECTED_MAIN"
          git diff --name-only "$EXPECTED_MAIN" "$EXPECTED_HEAD" | sort > "$RUNNER_TEMP/actual-files.txt"
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          docs/architecture/trainingos-live-classroom-livekit-server-authorization-v1.md
          lib/trainingos-agent-gateway/livekit-live-classroom-authorization.mjs
          prototypes/trainingos-agent-mvp-v1/test/livekit-live-classroom-server-authorization.test.mjs
          tests/test_trainingos_live_classroom_livekit_server_authorization_v1.py
          EOF
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/actual-files.txt"
          test "$(wc -l < "$RUNNER_TEMP/actual-files.txt" | tr -d ' ')" -eq 4
          ! grep -q '^supabase/migrations/' "$RUNNER_TEMP/actual-files.txt"
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: npm ci
      - name: Exact reconciled-head gates
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:workspace-realtime-client
          npm run test:trainingos-workspace-realtime-leave-contract
          python -m unittest tests.test_trainingos_live_classroom_tencent_provider_v1 -v
          node --test prototypes/trainingos-agent-mvp-v1/test/livekit-live-classroom-server-authorization.test.mjs
          python -m unittest tests.test_trainingos_live_classroom_livekit_server_authorization_v1 -v
          npm run typecheck
          npm run build
          npm run verify:build
      - name: Prove current-main containment and rerun gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$EXPECTED_MAIN" HEAD
          npm run validate:workspace-realtime-client
          npm run test:trainingos-workspace-realtime-leave-contract
          python -m unittest tests.test_trainingos_live_classroom_tencent_provider_v1 -v
          node --test prototypes/trainingos-agent-mvp-v1/test/livekit-live-classroom-server-authorization.test.mjs
          python -m unittest tests.test_trainingos_live_classroom_livekit_server_authorization_v1 -v
          npm run typecheck
          npm run build
          npm run verify:build
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git diff --check
          echo TRAININGOS_812_CURRENT_MAIN_CONTAINED_VALIDATION=PASS
