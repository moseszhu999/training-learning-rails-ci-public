name: Classroom Agent Queue PR338 main sync evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/classroom-agent-queue-pr338-sync.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-sync-inputs:
    runs-on: ubuntu-24.04
    env:
      MAIN_SHA: 542c590e6ce8ebefeb0c5a010e4dc3bfa9f75547
      PRIVATE_SHA: 3203894f89d956023d5f399c9a5c02f33447a03a
      OLD_BASE_SHA: cf3a6cd4062c00c6798ea0c20e7c2f1c642f7d37
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - name: Verify disjoint latest-main sync inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C private-repo rev-parse HEAD)" == "$PRIVATE_SHA" ]]
          branch_files="$(git -C private-repo diff --name-only "$OLD_BASE_SHA" "$PRIVATE_SHA" | sort)"
          main_files="$(git -C private-repo diff --name-only "$OLD_BASE_SHA" "$MAIN_SHA" | sort)"
          overlap="$(comm -12 <(printf '%s\n' "$branch_files") <(printf '%s\n' "$main_files"))"
          [[ -z "$overlap" ]]
          mkdir sanitized
          {
            echo "main_sha=$MAIN_SHA"
            echo "main_tree=$(git -C private-repo rev-parse "$MAIN_SHA^{tree}")"
            echo "private_sha=$PRIVATE_SHA"
            echo "private_tree=$(git -C private-repo rev-parse "$PRIVATE_SHA^{tree}")"
            echo "old_base_sha=$OLD_BASE_SHA"
            echo "merge_base=$(git -C private-repo merge-base "$MAIN_SHA" "$PRIVATE_SHA")"
            echo "branch_file_count=$(printf '%s\n' "$branch_files" | sed '/^$/d' | wc -l | tr -d ' ')"
            echo "main_file_count=$(printf '%s\n' "$main_files" | sed '/^$/d' | wc -l | tr -d ' ')"
            echo "overlap_count=0"
          } > sanitized/pr338-sync.txt
          rm -rf private-repo
      - uses: actions/upload-artifact@v4
        with:
          name: classroom-agent-queue-pr338-sync
          path: sanitized/pr338-sync.txt
          if-no-files-found: error
          retention-days: 1
