name: PR339 sequential bootstrap diagnostic v4

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr339-bootstrap-sequential-diagnostic-v4.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_SHA: dddfec403fad343ce22af1c61dc1b7c5e1ad6215
  BASE_SHA: e15dbe5d1e6513c8b1816d61c8e0978fdaebaae0
  DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      exit_code: ${{ steps.probe.outputs.exit_code }}
      applied_count: ${{ steps.probe.outputs.applied_count }}
      migration_version: ${{ steps.probe.outputs.migration_version }}
      failure_line: ${{ steps.probe.outputs.failure_line }}
      category: ${{ steps.probe.outputs.category }}
    steps:
      - name: Validate exact private inputs
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]

      - name: Checkout exact private candidate read-only
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply canonical bootstrap sequentially with sealed output
        id: probe
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          workdir="$RUNNER_TEMP/pr339-sequential-v4"
          staged="$RUNNER_TEMP/pr339-sequential-v4-migrations"
          bootstrap_log="$RUNNER_TEMP/pr339-sequential-v4-bootstrap.log"
          migration_log="$RUNNER_TEMP/pr339-sequential-v4-migration.log"
          rm -rf "$workdir" "$staged"
          mkdir -p "$workdir" "$staged"

          exact_code=1; init_code=1; builder_code=1; start_code=1
          actual_sha="$(git rev-parse HEAD 2>/dev/null)"
          merge_base="$(git merge-base "$BASE_SHA" "$PRIVATE_SHA" 2>/dev/null)"
          behind="$(git rev-list --count "$PRIVATE_SHA..$BASE_SHA" 2>/dev/null)"
          [[ "$actual_sha" == "$PRIVATE_SHA" && "$merge_base" == "$BASE_SHA" && "$behind" == 0 ]]
          exact_code=$?

          if [[ "$exact_code" == 0 ]]; then
            supabase --workdir "$workdir" init --force --yes > "$bootstrap_log" 2>&1
            init_code=$?
          fi
          if [[ "$init_code" == 0 ]]; then
            python scripts/build-trainingos-fresh-bootstrap.py \
              --repo-root "$PWD" \
              --output-dir "$staged" \
              --commit-sha "$PRIVATE_SHA" >> "$bootstrap_log" 2>&1
            builder_code=$?
          fi
          if [[ "$builder_code" == 0 ]]; then
            supabase --workdir "$workdir" start >> "$bootstrap_log" 2>&1
            start_code=$?
          fi

          applied=0
          failed_version=NONE
          failed_line=0
          category=NOT_RUN
          migration_exit=1
          if [[ "$start_code" == 0 ]]; then
            migration_exit=0
            for file in "$staged"/*.sql; do
              : > "$migration_log"
              psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$file" > "$migration_log" 2>&1
              code=$?
              if [[ "$code" != 0 ]]; then
                migration_exit="$code"
                failed_version="$(basename "$file" | cut -d_ -f1)"
                failed_line="$(python - "$migration_log" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          matches=re.findall(r'psql:[^:]+:(\d+):',text)
          print(matches[-1] if matches else 0)
          PY
          )"
                category="$(python - "$migration_log" <<'PY'
          import pathlib,sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace').lower()
          if 'cannot change name of input parameter' in text:
              print('INPUT_PARAMETER_RENAME')
          elif 'cannot change return type of existing function' in text:
              print('FUNCTION_RETURN_TYPE_CHANGE')
          elif 'policy' in text and 'already exists' in text:
              print('DUPLICATE_POLICY')
          elif 'trigger' in text and 'already exists' in text:
              print('DUPLICATE_TRIGGER')
          elif 'constraint' in text and 'already exists' in text:
              print('DUPLICATE_CONSTRAINT')
          elif ('relation' in text or 'table' in text or 'index' in text) and 'already exists' in text:
              print('DUPLICATE_RELATION')
          elif ('function' in text or 'procedure' in text) and 'already exists' in text:
              print('DUPLICATE_FUNCTION')
          elif 'does not exist' in text:
              print('MISSING_DEPENDENCY')
          elif 'syntax error' in text:
              print('SQL_SYNTAX')
          elif 'permission denied' in text:
              print('PERMISSION_DENIED')
          else:
              print('SQL_FAILURE')
          PY
          )"
                break
              fi
              applied=$((applied + 1))
            done
            if [[ "$migration_exit" == 0 ]]; then category=SUCCESS; fi
          elif [[ "$start_code" != 0 ]]; then
            category=EMPTY_DATABASE_START_FAILURE
          fi

          {
            echo "exit_code=$migration_exit"
            echo "applied_count=$applied"
            echo "migration_version=$failed_version"
            echo "failure_line=$failed_line"
            echo "category=$category"
            echo "exact_code=$exact_code"
            echo "init_code=$init_code"
            echo "builder_code=$builder_code"
            echo "start_code=$start_code"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Cleanup sealed sequential bootstrap
        if: always()
        shell: bash
        run: |
          supabase --workdir "$RUNNER_TEMP/pr339-sequential-v4" stop --no-backup >/dev/null 2>&1 || true
          rm -rf private-repo "$RUNNER_TEMP"/pr339-sequential-v4*

  sanitized-disposition:
    if: always()
    needs: diagnose
    name: sequential-${{ needs.diagnose.outputs.exit_code }}-${{ needs.diagnose.outputs.applied_count }}-${{ needs.diagnose.outputs.migration_version }}-L${{ needs.diagnose.outputs.failure_line }}-${{ needs.diagnose.outputs.category }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "bounded_sequential_bootstrap_diagnostic=published" >> "$GITHUB_STEP_SUMMARY"
