name: TrainingOS Workspace Adapter cda98c current-main CI

on:
  push:
    branches:
      - ci/exact-head-request/workspace-adapter-cda98c80-d4ea8575-v1
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/trainingos-workspace-adapter-cda98c-d4ea-current-pair-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-current-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PRIVATE_SHA: cda98c80605e8ced06265c9b5c3723729174a1bf
      CURRENT_MAIN_SHA: d4ea85759ac3746ddc6ad795b0671602219a2bea
      MERGE_BASE_SHA: 73221fccb8c042427561229f6981f27a7708a439
    steps:
      - name: Check out exact private head
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: private-repo/package-lock.json
      - name: Verify exact head and bounded scope
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
          git cat-file -e "$CURRENT_MAIN_SHA^{commit}"
          actual="$(git diff --name-only "$MERGE_BASE_SHA" "$PRIVATE_SHA" | sort)"
          expected=$'data/trainingos-workspace-fixtures/jhc-13-person-workspace-v1.json\ndocs/architecture/trainingos-organizational-workspace-adapter-v1.md\npackages/training-organizational-workspace-adapter-core/package.json\npackages/training-organizational-workspace-adapter-core/src/index.mjs\ntests/training-organizational-workspace-adapter-v1.test.mjs'
          test "$actual" = "$expected"
          ! printf '%s\n' "$actual" | grep -q '^supabase/migrations/'
          ! printf '%s\n' "$actual" | grep -q '^.github/workflows/'
      - name: Reject production capabilities
        shell: bash
        run: |
          set -euo pipefail
          privileged_role="SERVICE""_ROLE"
          sensitive_env_pattern="(^|_)(PRODUCTION|PROD|${privileged_role}|BILLING|PAYMENT|STRIPE)(_|$)"
          env | cut -d= -f1 | grep -E "$sensitive_env_pattern" && exit 1 || true
      - name: Install dependencies
        working-directory: private-repo
        shell: bash
        run: npm ci >/dev/null 2>&1
      - name: Exact-head focused adapter contracts
        working-directory: private-repo
        shell: bash
        run: node --test tests/training-organizational-workspace-adapter-v1.test.mjs
      - name: Exact-head repository gates
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          npm run verify:build
      - name: Integrate exact current main without commit
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name trainingos-public-ci
          git config user.email trainingos-public-ci@users.noreply.github.com
          git merge --no-commit --no-ff "$CURRENT_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
          test "$(git rev-parse MERGE_HEAD)" = "$CURRENT_MAIN_SHA"
          git diff --check
      - name: Integrated focused adapter contracts
        working-directory: private-repo
        shell: bash
        run: node --test tests/training-organizational-workspace-adapter-v1.test.mjs
      - name: Integrated repository gates
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
          npm run verify:build
          test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
          test "$(git rev-parse MERGE_HEAD)" = "$CURRENT_MAIN_SHA"
          git diff --check
