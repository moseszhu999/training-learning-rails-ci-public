name: Recipe Runtime PR325 focused diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: recipe-runtime-pr325-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PRIVATE_SHA: cbcdb11c20856258165846252763b2a379be89cc

jobs:
  focused-python-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate exact SHA and private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ -n "$PRIVATE_TOKEN" ]] || exit 2

      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture sanitized failing test identifiers
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          python -m unittest -v \
            tests/test_trainingos_agent_recipe_contract.py \
            tests/test_trainingos_agent_recipe_review_contract.py \
            > "$RUNNER_TEMP/recipe-python-diagnostic.log" 2>&1
          code=$?
          CODE="$code" PRIVATE_SHA="$PRIVATE_SHA" python - "$RUNNER_TEMP/recipe-python-diagnostic.log" "$RUNNER_TEMP/recipe-python-diagnostic.json" <<'PY'
          import json, os, pathlib, re, sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          match=re.search(r'Ran\s+(\d+)\s+tests?',text)
          failures=[item.strip() for _,item in re.findall(r'^(FAIL|ERROR):\s+(.+)$',text,re.M)]
          payload={
              'schemaVersion':'trainingos-recipe-focused-python-diagnostic-v1',
              'privateSha':os.environ['PRIVATE_SHA'],
              'status':'PASS' if int(os.environ['CODE'])==0 else 'FAIL',
              'testCount':int(match.group(1)) if match else 0,
              'failureIdentifiers':failures,
              'rawOutputPublished':False,
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(payload,indent=2)+'\n',encoding='utf-8')
          print('RECIPE_PY_DIAGNOSTIC status=%s count=%s failures=%s' % (
              payload['status'],payload['testCount'],'|'.join(failures) if failures else 'none'))
          PY
          exit 0

      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: recipe-pr325-focused-python-diagnostic
          path: ${{ runner.temp }}/recipe-python-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove private checkout and sealed log
        if: always()
        shell: bash
        run: rm -rf private-repo "$RUNNER_TEMP/recipe-python-diagnostic.log" "$RUNNER_TEMP/recipe-python-diagnostic.json"
