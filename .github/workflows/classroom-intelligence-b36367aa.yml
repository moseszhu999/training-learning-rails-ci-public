name: Classroom intelligence exact-head CI

on:
  push:
    branches:
      - ci/classroom-intelligence-b36367aa
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/classroom-intelligence-b36367aa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-intelligence-b36367aa
  cancel-in-progress: false

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRIVATE_SHA: b36367aaccc0c11e1e82cb45a99f8a6a7c6489b4

    steps:
      - name: Validate exact SHA and private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::PRIVATE_SHA must be an exact lowercase 40-character commit SHA"
            exit 2
          fi
          if [[ -z "$PRIVATE_TOKEN" ]]; then
            echo "::error::PRIVATE_REPO_READ_TOKEN is not configured"
            exit 2
          fi

      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 3
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: private-repo/package-lock.json

      - name: Verify exact private head and merge scope
        id: scope
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          status=PASS
          actual_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          if [[ "$actual_sha" != "$PRIVATE_SHA" ]]; then
            status=FAIL
          fi
          if ! git rev-parse "${PRIVATE_SHA}^1" >/dev/null 2>&1; then
            status=FAIL
          else
            actual_files="$(git diff --name-only "${PRIVATE_SHA}^1" "$PRIVATE_SHA" | sort)"
            expected_files=$'packages/training-classroom-intelligence/src/index.mjs\npackages/training-classroom-intelligence/test/classroom-intelligence.test.mjs'
            if [[ "$actual_files" != "$expected_files" ]]; then
              status=FAIL
            fi
          fi
          {
            echo "status=$status"
            echo "actual_sha=$actual_sha"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run classroom intelligence syntax checks with sealed output
        id: syntax
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          {
            node --check packages/training-classroom-intelligence/src/index.mjs
            node --check lib/trainingos-agent-gateway/classroom-intelligence.mjs
            node --check packages/training-classroom-intelligence/test/classroom-intelligence.test.mjs
          } > "$RUNNER_TEMP/classroom-intelligence-syntax.log" 2>&1
          code=$?
          {
            echo "exit_code=$code"
            if [[ "$code" == "0" ]]; then echo "status=PASS"; else echo "status=FAIL"; fi
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run focused pure-function tests with sealed output
        id: focused
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm --prefix packages/training-classroom-intelligence test \
            > "$RUNNER_TEMP/classroom-intelligence-focused.log" 2>&1
          code=$?
          python - "$RUNNER_TEMP/classroom-intelligence-focused.log" "$code" "$GITHUB_OUTPUT" <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          code = int(sys.argv[2])
          output = pathlib.Path(sys.argv[3])
          tests = re.search(r'# tests\s+(\d+)', text)
          passed = re.search(r'# pass\s+(\d+)', text)
          failed = re.search(r'# fail\s+(\d+)', text)
          test_count = int(tests.group(1)) if tests else 0
          pass_count = int(passed.group(1)) if passed else 0
          fail_count = int(failed.group(1)) if failed else -1
          ok = code == 0 and test_count == 8 and pass_count == 8 and fail_count == 0
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f'exit_code={code}\n')
              handle.write(f'test_count={test_count}\n')
              handle.write(f'pass_count={pass_count}\n')
              handle.write(f'fail_count={fail_count}\n')
              handle.write(f'status={"PASS" if ok else "FAIL"}\n')
          PY
          exit 0

      - name: Install private repository dependencies with sealed output
        id: install
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm ci > "$RUNNER_TEMP/classroom-intelligence-install.log" 2>&1
          code=$?
          {
            echo "exit_code=$code"
            if [[ "$code" == "0" ]]; then echo "status=PASS"; else echo "status=FAIL"; fi
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run repository typecheck with sealed output
        id: typecheck
        if: steps.install.outputs.status == 'PASS'
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm run typecheck > "$RUNNER_TEMP/classroom-intelligence-typecheck.log" 2>&1
          code=$?
          {
            echo "exit_code=$code"
            if [[ "$code" == "0" ]]; then echo "status=PASS"; else echo "status=FAIL"; fi
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run production build with sealed output
        id: build
        if: steps.install.outputs.status == 'PASS'
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm run build > "$RUNNER_TEMP/classroom-intelligence-build.log" 2>&1
          code=$?
          {
            echo "exit_code=$code"
            if [[ "$code" == "0" ]]; then echo "status=PASS"; else echo "status=FAIL"; fi
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish sanitized exact-head result
        if: always()
        shell: bash
        env:
          SCOPE_STATUS: ${{ steps.scope.outputs.status }}
          ACTUAL_SHA: ${{ steps.scope.outputs.actual_sha }}
          SYNTAX_STATUS: ${{ steps.syntax.outputs.status }}
          FOCUSED_STATUS: ${{ steps.focused.outputs.status }}
          FOCUSED_COUNT: ${{ steps.focused.outputs.test_count }}
          FOCUSED_PASS: ${{ steps.focused.outputs.pass_count }}
          INSTALL_STATUS: ${{ steps.install.outputs.status }}
          TYPECHECK_STATUS: ${{ steps.typecheck.outputs.status }}
          BUILD_STATUS: ${{ steps.build.outputs.status }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const value = (input) => input || 'NOT_RUN';
          const lines = [
            '## Classroom Intelligence exact-head CI',
            '',
            `- Exact private SHA: \`${process.env.ACTUAL_SHA || process.env.PRIVATE_SHA}\``,
            `- Merge scope: **${value(process.env.SCOPE_STATUS)}**`,
            `- Syntax checks: **${value(process.env.SYNTAX_STATUS)}**`,
            `- Focused pure-function tests: **${value(process.env.FOCUSED_STATUS)} ${process.env.FOCUSED_PASS || '0'}/${process.env.FOCUSED_COUNT || '0'}**`,
            `- Dependency install: **${value(process.env.INSTALL_STATUS)}**`,
            `- Repository typecheck: **${value(process.env.TYPECHECK_STATUS)}**`,
            `- Production build: **${value(process.env.BUILD_STATUS)}**`,
            '',
            'Raw private output is sealed and deleted. No private source, fixtures, identifiers, or logs are published.',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          console.log(
            `CLASSROOM_INTELLIGENCE_EXACT_CI scope=${value(process.env.SCOPE_STATUS)} ` +
            `syntax=${value(process.env.SYNTAX_STATUS)} ` +
            `focused=${value(process.env.FOCUSED_STATUS)}:${process.env.FOCUSED_PASS || '0'}/${process.env.FOCUSED_COUNT || '0'} ` +
            `install=${value(process.env.INSTALL_STATUS)} ` +
            `typecheck=${value(process.env.TYPECHECK_STATUS)} ` +
            `build=${value(process.env.BUILD_STATUS)} sha=${process.env.ACTUAL_SHA || process.env.PRIVATE_SHA}`,
          );
          NODE

      - name: Remove private checkout and sealed logs
        if: always()
        shell: bash
        run: |
          rm -rf private-repo \
            "$RUNNER_TEMP/classroom-intelligence-syntax.log" \
            "$RUNNER_TEMP/classroom-intelligence-focused.log" \
            "$RUNNER_TEMP/classroom-intelligence-install.log" \
            "$RUNNER_TEMP/classroom-intelligence-typecheck.log" \
            "$RUNNER_TEMP/classroom-intelligence-build.log"

      - name: Enforce exact-head result
        if: always()
        shell: bash
        env:
          SCOPE_STATUS: ${{ steps.scope.outputs.status }}
          SYNTAX_STATUS: ${{ steps.syntax.outputs.status }}
          FOCUSED_STATUS: ${{ steps.focused.outputs.status }}
          FOCUSED_COUNT: ${{ steps.focused.outputs.test_count }}
          FOCUSED_PASS: ${{ steps.focused.outputs.pass_count }}
          INSTALL_STATUS: ${{ steps.install.outputs.status }}
          TYPECHECK_STATUS: ${{ steps.typecheck.outputs.status }}
          BUILD_STATUS: ${{ steps.build.outputs.status }}
        run: |
          failed=0
          [[ "${SCOPE_STATUS:-FAIL}" == "PASS" ]] || failed=1
          [[ "${SYNTAX_STATUS:-FAIL}" == "PASS" ]] || failed=1
          [[ "${FOCUSED_STATUS:-FAIL}" == "PASS" ]] || failed=1
          [[ "${FOCUSED_COUNT:-0}" == "8" ]] || failed=1
          [[ "${FOCUSED_PASS:-0}" == "8" ]] || failed=1
          [[ "${INSTALL_STATUS:-FAIL}" == "PASS" ]] || failed=1
          [[ "${TYPECHECK_STATUS:-FAIL}" == "PASS" ]] || failed=1
          [[ "${BUILD_STATUS:-FAIL}" == "PASS" ]] || failed=1
          if [[ "$failed" != "0" ]]; then
            echo "::error::Classroom Intelligence exact-head validation failed. Review the sanitized step summary."
          fi
          exit "$failed"
