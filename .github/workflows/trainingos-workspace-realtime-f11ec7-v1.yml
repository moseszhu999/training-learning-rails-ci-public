name: TrainingOS Workspace Realtime exact-head CI

on:
  push:
    branches:
      - ci/trainingos-workspace-realtime-f11ec7-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trainingos-workspace-realtime-f11ec7-v1
  cancel-in-progress: false

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRIVATE_SHA: f11ec7c981ad34971b0cf5177950649c52c608d5
      BASE_SHA: b5f25d56ab8f69968e047c1323cdcc68d31d7c0f

    steps:
      - name: Validate immutable inputs
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]

      - name: Check out exact private head
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: private-repo/package-lock.json

      - name: Verify exact head and bounded scope
        id: scope
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          status=PASS
          actual_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          if [[ "$actual_sha" != "$PRIVATE_SHA" ]]; then status=FAIL; fi
          actual_files="$(git diff --name-only "$BASE_SHA" "$PRIVATE_SHA" | sort)"
          expected_files=$'apps/training-web/src/lib/trainingos-workspace-realtime-contribution-core.ts\napps/training-web/src/lib/trainingos-workspace-realtime-contribution.ts\napps/training-web/src/workspace-domain-contribution.ts\npackage.json\nscripts/run-trainingos-workspace-realtime-client-validation.ts\nvite.config.ts'
          if [[ "$actual_files" != "$expected_files" ]]; then status=FAIL; fi
          if printf '%s\n' "$actual_files" | grep -q '^supabase/migrations/'; then status=FAIL; fi
          file_count="$(printf '%s\n' "$actual_files" | sed '/^$/d' | wc -l | tr -d ' ')"
          {
            echo "status=$status"
            echo "actual_sha=$actual_sha"
            echo "file_count=$file_count"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install dependencies with sealed output
        id: install
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm ci > "$RUNNER_TEMP/workspace-realtime-install.log" 2>&1
          code=$?
          echo "status=$([[ $code == 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run focused Workspace Realtime validation with sealed output
        id: focused
        if: steps.install.outputs.status == 'PASS'
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm run validate:workspace-realtime-client > "$RUNNER_TEMP/workspace-realtime-focused.log" 2>&1
          code=$?
          echo "status=$([[ $code == 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run repository typecheck with sealed output
        id: typecheck
        if: steps.install.outputs.status == 'PASS'
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm run typecheck > "$RUNNER_TEMP/workspace-realtime-typecheck.log" 2>&1
          code=$?
          echo "status=$([[ $code == 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run production build with sealed output
        id: build
        if: steps.install.outputs.status == 'PASS'
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm run build > "$RUNNER_TEMP/workspace-realtime-build.log" 2>&1
          code=$?
          echo "status=$([[ $code == 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run bundle verification with sealed output
        id: verify
        if: steps.install.outputs.status == 'PASS'
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm run verify:build > "$RUNNER_TEMP/workspace-realtime-verify.log" 2>&1
          code=$?
          echo "status=$([[ $code == 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish sanitized result
        if: always()
        shell: bash
        env:
          SCOPE: ${{ steps.scope.outputs.status }}
          FILE_COUNT: ${{ steps.scope.outputs.file_count }}
          INSTALL: ${{ steps.install.outputs.status }}
          FOCUSED: ${{ steps.focused.outputs.status }}
          TYPECHECK: ${{ steps.typecheck.outputs.status }}
          BUILD: ${{ steps.build.outputs.status }}
          VERIFY: ${{ steps.verify.outputs.status }}
        run: |
          printf 'private_head=%s\nbase=%s\nfiles=%s\nscope=%s\ninstall=%s\nfocused=%s\ntypecheck=%s\nbuild=%s\nverify=%s\n' \
            "$PRIVATE_SHA" "$BASE_SHA" "$FILE_COUNT" "$SCOPE" "$INSTALL" "$FOCUSED" "$TYPECHECK" "$BUILD" "$VERIFY"

      - name: Enforce exact-head result
        if: always()
        shell: bash
        env:
          SCOPE: ${{ steps.scope.outputs.status }}
          INSTALL: ${{ steps.install.outputs.status }}
          FOCUSED: ${{ steps.focused.outputs.status }}
          TYPECHECK: ${{ steps.typecheck.outputs.status }}
          BUILD: ${{ steps.build.outputs.status }}
          VERIFY: ${{ steps.verify.outputs.status }}
        run: |
          set -euo pipefail
          [[ "$SCOPE" == PASS ]]
          [[ "$INSTALL" == PASS ]]
          [[ "$FOCUSED" == PASS ]]
          [[ "$TYPECHECK" == PASS ]]
          [[ "$BUILD" == PASS ]]
          [[ "$VERIFY" == PASS ]]

      - name: Cleanup sealed private output
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/workspace-realtime-*.log
