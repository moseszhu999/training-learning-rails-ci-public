name: PR339 synchronized Student Learning canonical final

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr339-final-dddfec40.yml
      - carriers/pr339-final-dddfec40.txt
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_SHA: dddfec403fad343ce22af1c61dc1b7c5e1ad6215
  BASE_SHA: e15dbe5d1e6513c8b1816d61c8e0978fdaebaae0
  DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Validate exact inputs and credential
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]
      - name: Checkout exact private candidate
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-repo/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact head ancestry and canonical scope
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$PRIVATE_SHA")" == "$BASE_SHA" ]]
          [[ "$(git rev-list --count "$PRIVATE_SHA..$BASE_SHA")" == 0 ]]
          git diff --name-only "$BASE_SHA" "$PRIVATE_SHA" | sort > "$RUNNER_TEMP/pr339-files.txt"
          python - "$RUNNER_TEMP/pr339-files.txt" <<'PY'
          import pathlib,sys
          actual=set(pathlib.Path(sys.argv[1]).read_text().splitlines())
          expected={
            '.github/workflows/trainingos-learning-workspace-bridge.yml',
            'api/integrations/agents/mcp.mjs',
            'apps/training-web/src/components/TrainingOsStudentAssessmentActivity.tsx',
            'apps/training-web/src/lib/jhc-exercise-lifecycle.ts',
            'apps/training-web/src/lib/trainingos-assessment-runtime.ts',
            'apps/training-web/src/trainingos-student-assessment-activity.css',
            'extensions/trainingos-classroom-vscode/esbuild.mjs',
            'extensions/trainingos-classroom-vscode/package.json',
            'extensions/trainingos-classroom-vscode/src/extension-entry.mjs',
            'extensions/trainingos-classroom-vscode/src/student-exercise-execution.mjs',
            'lib/trainingos-agent-gateway/mcp-student-assessment-resume-layer.mjs',
            'lib/trainingos-agent-gateway/mcp-student-exercise-execution-layer.mjs',
            'lib/trainingos-agent-gateway/student-assessment-resume.mjs',
            'lib/trainingos-agent-gateway/student-exercise-execution.mjs',
            'netlify/functions/trainingos-mcp.mjs',
            'packages/training-learning-workspace/src/adapters/assessment-lifecycle.d.mts',
            'packages/training-learning-workspace/src/adapters/assessment-lifecycle.mjs',
            'prototypes/trainingos-agent-mvp-v1/learning-workspace-assessment-activity-projection.test.mjs',
            'prototypes/trainingos-agent-mvp-v1/student-assessment-resume.test.mjs',
            'prototypes/trainingos-agent-mvp-v1/student-exercise-execution.test.mjs',
            'prototypes/trainingos-agent-mvp-v1/student-learning-canonical-reconciliation.test.mjs',
            'scripts/run-trainingos-learning-workspace-bridge-validation.mjs',
            'supabase/migrations/20260728100000_trainingos_student_exercise_execution_v1.sql',
            'supabase/migrations/20260728100100_trainingos_assessment_answer_resume_projection_v1.sql',
            'supabase/migrations/20260728100200_trainingos_student_exercise_start_concurrency_v1.sql',
            'supabase/migrations/20260728100300_trainingos_student_learning_execution_canonical_reconciliation_v1.sql',
            'tests/sql/trainingos_student_exercise_canonical_reconciliation_e2e.sql',
            'tests/sql/trainingos_student_learning_canonical_reconciliation_e2e.sql',
            'tests/test_trainingos_assessment_resume_execution_contract.py',
            'tests/test_trainingos_learning_workspace_assessment_projection_contract.py',
            'tests/test_trainingos_student_exercise_execution_contract.py',
            'tests/test_trainingos_vscode_exercise_execution_contract.py',
          }
          print(f'PR339_SCOPE actual={len(actual)} expected={len(expected)}')
          raise SystemExit(0 if actual==expected else 1)
          PY
      - name: Run focused Node contracts
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            prototypes/trainingos-agent-mvp-v1/student-exercise-execution.test.mjs \
            prototypes/trainingos-agent-mvp-v1/student-assessment-resume.test.mjs \
            prototypes/trainingos-agent-mvp-v1/student-learning-canonical-reconciliation.test.mjs \
            > "$RUNNER_TEMP/pr339-node.log" 2>&1
          python - "$RUNNER_TEMP/pr339-node.log" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          def n(pattern,default):
              match=re.search(pattern,text)
              return int(match.group(1)) if match else default
          tests=n(r'# tests\s+(\d+)',0); passed=n(r'# pass\s+(\d+)',0); failed=n(r'# fail\s+(\d+)',-1)
          assert tests>0 and passed==tests and failed==0,(tests,passed,failed)
          print(f'PR339_NODE {passed}/{tests}')
          PY
      - name: Run focused Python contracts
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/pr339-python.log"
          for test_file in \
            tests/test_trainingos_student_exercise_execution_contract.py \
            tests/test_trainingos_assessment_resume_execution_contract.py \
            tests/test_trainingos_learning_workspace_assessment_projection_contract.py \
            tests/test_trainingos_vscode_exercise_execution_contract.py
          do
            python "$test_file" >> "$RUNNER_TEMP/pr339-python.log" 2>&1
          done
          python - "$RUNNER_TEMP/pr339-python.log" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          counts=[int(x) for x in re.findall(r'Ran\s+(\d+)\s+tests?',text)]
          ok=len(re.findall(r'(?:^|\n)OK(?:\s|\n|$)',text))
          assert len(counts)==4 and sum(counts)>0 and ok==4,(counts,ok,text[-700:])
          print(f'PR339_PYTHON {sum(counts)}/{sum(counts)}')
          PY
      - name: Install and run repository gates
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          npm ci > "$RUNNER_TEMP/pr339-install.log" 2>&1
          npm run typecheck > "$RUNNER_TEMP/pr339-typecheck.log" 2>&1
          node extensions/trainingos-classroom-vscode/esbuild.mjs --production > "$RUNNER_TEMP/pr339-vscode.log" 2>&1
          npm run validate:learning-workspace-bridge > "$RUNNER_TEMP/pr339-workspace.log" 2>&1
          npm run validate:zero-permission-bridge > "$RUNNER_TEMP/pr339-zero-permission.log" 2>&1
          npm run build > "$RUNNER_TEMP/pr339-build.log" 2>&1
      - name: Independent canonical-boundary review
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          migration=(root/'supabase/migrations/20260728100300_trainingos_student_learning_execution_canonical_reconciliation_v1.sql').read_text()
          exercise=(root/'lib/trainingos-agent-gateway/student-exercise-execution.mjs').read_text()
          assessment=(root/'lib/trainingos-agent-gateway/student-assessment-resume.mjs').read_text()
          web=(root/'apps/training-web/src/lib/trainingos-assessment-runtime.ts').read_text()
          gates={
            'no_second_fact_table':'create table' not in migration.lower(),
            'assessment_owners':all(x in migration for x in ('trainingos_assessment_attempts','trainingos_assessment_answers','trainingos_assessment_results','trainingos_assessment_result_items')),
            'exercise_owner':"canonicalOwners: Object.freeze(['exercise_publications', 'exercise_submissions'])" in exercise,
            'exact_attempt_version':'p_expected_attempt_version integer' in migration,
            'exact_answer_version':'p_expected_previous_answer_version integer' in migration,
            'answer_digest':'answer_set_digest' in migration,
            'answer_conflict':'TRAININGOS_ASSESSMENT_ANSWER_IDEMPOTENCY_CONFLICT' in migration,
            'submit_conflict':'TRAININGOS_ASSESSMENT_SUBMISSION_IDEMPOTENCY_CONFLICT' in migration,
            'formal_freeze':'is_submitted_version = true' in migration,
            'current_result':"r.status in ('finalized','corrected')" in migration,
            'weak_save_revoked':'save_trainingos_assessment_answer(uuid,uuid,integer,jsonb)' in migration,
            'weak_submit_revoked':'submit_trainingos_assessment_attempt(uuid,integer,jsonb)' in migration,
            'old_exercise_confirm_revoked':'confirm_my_trainingos_exercise_submission(uuid,bigint,text,boolean,text)' in migration,
            'exercise_human_actor':'p_actor_kind: actor.actorKind' in exercise,
            'assessment_agent_denial':'TRAININGOS_ASSESSMENT_AGENT_CONFIRMATION_FORBIDDEN' in assessment,
            'web_prepare_confirm':all(x in web for x in ('prepare_trainingos_assessment_submission','confirm_trainingos_assessment_submission')),
            'no_service_role_client':'service_role' not in (exercise+assessment).lower(),
          }
          failed=[k for k,v in gates.items() if not v]
          print(f'PR339_REVIEW passed={len(gates)-len(failed)}/{len(gates)} failed={failed or "none"}')
          raise SystemExit(1 if failed else 0)
          PY
      - name: Publish sanitized application result
        shell: bash
        run: |
          {
            echo 'exact_private_sha=dddfec403fad343ce22af1c61dc1b7c5e1ad6215'
            echo 'exact_base_sha=e15dbe5d1e6513c8b1816d61c8e0978fdaebaae0'
            echo 'scope=PASS_32_FILES_4_MIGRATIONS'
            echo 'node=PASS'
            echo 'python=PASS_4_SUITES'
            echo 'install=PASS'
            echo 'typecheck=PASS'
            echo 'vscode_bundle=PASS'
            echo 'learning_workspace_bridge=PASS'
            echo 'zero_permission_bridge=PASS'
            echo 'build=PASS'
            echo 'independent_review=PASS'
            echo 'raw_private_output=SEALED_AND_DELETED'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup
        if: always()
        run: rm -rf private-repo "$RUNNER_TEMP"/pr339-*

  canonical-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - name: Validate exact inputs and credential
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_TOKEN" ]]
      - name: Checkout exact private candidate
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Verify exact head and build canonical bootstrap
        working-directory: private-repo
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$PRIVATE_SHA")" == "$BASE_SHA" ]]
          workdir="$RUNNER_TEMP/pr339-db"
          rm -rf "$workdir" && mkdir -p "$workdir"
          supabase --workdir "$workdir" init --force --yes > "$RUNNER_TEMP/pr339-db-init.log" 2>&1
          python scripts/build-trainingos-fresh-bootstrap.py --repo-root "$PWD" --output-dir "$workdir/supabase/migrations" --commit-sha "$PRIVATE_SHA" > "$RUNNER_TEMP/pr339-db-bootstrap.log" 2>&1
          supabase --workdir "$workdir" start > "$RUNNER_TEMP/pr339-db-start.log" 2>&1
      - name: Verify canonical owners and ACLs
        run: |
          set -euo pipefail
          acl="$(psql "$DB_URL" -X -Atv ON_ERROR_STOP=1 <<'SQL'
          select jsonb_build_object(
            'duplicateTables',(select count(*) from information_schema.tables where table_schema='public' and table_name in ('student_exercise_submissions','student_exercise_answers','student_assessment_attempts','student_assessment_answers','assessment_resume_answers','assessment_execution_state')),
            'assessmentDirectPrivileges',(select count(*) from information_schema.role_table_grants where grantee='authenticated' and table_schema='public' and table_name in ('trainingos_assessment_attempts','trainingos_assessment_answers') and privilege_type in ('INSERT','UPDATE','DELETE')),
            'oldAssessmentSave',case when to_regprocedure('public.save_trainingos_assessment_answer(uuid,uuid,integer,jsonb)') is null then false else has_function_privilege('authenticated','public.save_trainingos_assessment_answer(uuid,uuid,integer,jsonb)','execute') end,
            'oldAssessmentSubmit',case when to_regprocedure('public.submit_trainingos_assessment_attempt(uuid,integer,jsonb)') is null then false else has_function_privilege('authenticated','public.submit_trainingos_assessment_attempt(uuid,integer,jsonb)','execute') end,
            'newAssessmentSave',has_function_privilege('authenticated','public.save_trainingos_assessment_answer(uuid,uuid,integer,integer,jsonb,text)','execute'),
            'newAssessmentConfirm',has_function_privilege('authenticated','public.confirm_trainingos_assessment_submission(uuid,integer,text,text)','execute'),
            'oldExerciseConfirm',case when to_regprocedure('public.confirm_my_trainingos_exercise_submission(uuid,bigint,text,boolean,text)') is null then false else has_function_privilege('authenticated','public.confirm_my_trainingos_exercise_submission(uuid,bigint,text,boolean,text)','execute') end,
            'newExerciseConfirm',has_function_privilege('authenticated','public.confirm_my_trainingos_exercise_submission(uuid,bigint,text,text,text)','execute')
          );
          SQL
          )"
          python - "$acl" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          expected={'duplicateTables':0,'assessmentDirectPrivileges':0,'oldAssessmentSave':False,'oldAssessmentSubmit':False,'newAssessmentSave':True,'newAssessmentConfirm':True,'oldExerciseConfirm':False,'newExerciseConfirm':True}
          assert d==expected,(d,expected)
          PY
      - name: First exercise assessment and result E2E pass
        working-directory: private-repo
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f tests/sql/trainingos_student_exercise_canonical_reconciliation_e2e.sql > "$RUNNER_TEMP/pr339-exercise-first.log" 2>&1
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f tests/sql/trainingos_student_learning_canonical_reconciliation_e2e.sql > "$RUNNER_TEMP/pr339-assessment-first.log" 2>&1
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f tests/sql/trainingos_wave3_assessment_grading_result_e2e.sql > "$RUNNER_TEMP/pr339-result-first.log" 2>&1
      - name: Second deterministic replay and E2E pass
        working-directory: private-repo
        run: |
          set -euo pipefail
          supabase --workdir "$RUNNER_TEMP/pr339-db" db reset --local --no-seed > "$RUNNER_TEMP/pr339-db-reset.log" 2>&1
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f tests/sql/trainingos_student_exercise_canonical_reconciliation_e2e.sql > "$RUNNER_TEMP/pr339-exercise-second.log" 2>&1
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f tests/sql/trainingos_student_learning_canonical_reconciliation_e2e.sql > "$RUNNER_TEMP/pr339-assessment-second.log" 2>&1
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f tests/sql/trainingos_wave3_assessment_grading_result_e2e.sql > "$RUNNER_TEMP/pr339-result-second.log" 2>&1
      - name: Publish sanitized database result
        run: |
          {
            echo 'exact_private_sha=dddfec403fad343ce22af1c61dc1b7c5e1ad6215'
            echo 'exact_base_sha=e15dbe5d1e6513c8b1816d61c8e0978fdaebaae0'
            echo 'canonical_bootstrap=PASS'
            echo 'canonical_owner_acl=PASS_8_8'
            echo 'exercise_e2e_first=PASS_ZERO_RESIDUE'
            echo 'assessment_e2e_first=PASS_ZERO_RESIDUE'
            echo 'grading_result_e2e_first=PASS'
            echo 'second_replay=PASS'
            echo 'exercise_e2e_second=PASS_ZERO_RESIDUE'
            echo 'assessment_e2e_second=PASS_ZERO_RESIDUE'
            echo 'grading_result_e2e_second=PASS'
            echo 'raw_private_database_output=SEALED_AND_DELETED'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup
        if: always()
        run: |
          supabase --workdir "$RUNNER_TEMP/pr339-db" stop --no-backup >/dev/null 2>&1 || true
          rm -rf private-repo "$RUNNER_TEMP"/pr339-*
