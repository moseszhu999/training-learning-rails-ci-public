name: PR339 canonical database final

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr339-db-final-ce66d6d3.yml
      - carriers/pr339-db-final-ce66d6d3.txt
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_SHA: ce66d6d388b6f6353e3b7967f392dec58e31a551
  BASE_SHA: 26fc34af65b9489985aa9a5cbe45c9d1590826bf
  DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  canonical-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Validate exact inputs and credential
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]
      - uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Verify exact ancestry and start fresh canonical database
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$PRIVATE_SHA")" == "$BASE_SHA" ]]
          [[ "$(git rev-list --count "$PRIVATE_SHA..$BASE_SHA")" == 0 ]]
          workdir="$RUNNER_TEMP/pr339-db-final"
          supabase --workdir "$workdir" init --force --yes > "$RUNNER_TEMP/pr339-db-init.log" 2>&1
          python scripts/build-trainingos-fresh-bootstrap.py --repo-root "$PWD" --output-dir "$workdir/supabase/migrations" --commit-sha "$PRIVATE_SHA" > "$RUNNER_TEMP/pr339-db-bootstrap.log" 2>&1
          supabase --workdir "$workdir" start > "$RUNNER_TEMP/pr339-db-start.log" 2>&1
      - name: Verify canonical ACL trigger privacy and revoked weak RPC
        shell: bash
        run: |
          set -euo pipefail
          result="$(psql "$DB_URL" -X -Atv ON_ERROR_STOP=1 <<'SQL'
          select jsonb_build_object(
            'duplicateTables',(select count(*) from information_schema.tables where table_schema='public' and table_name in ('student_exercise_submissions','student_exercise_answers','student_assessment_attempts','student_assessment_answers','assessment_resume_answers','assessment_execution_state')),
            'assessmentDirectPrivileges',(select count(*) from information_schema.role_table_grants where grantee='authenticated' and table_schema='public' and table_name in ('trainingos_assessment_attempts','trainingos_assessment_answers') and privilege_type in ('INSERT','UPDATE','DELETE')),
            'weakAssessmentSaveExecutable',case when to_regprocedure('public.save_trainingos_assessment_answer(uuid,uuid,integer,jsonb)') is null then false else has_function_privilege('authenticated','public.save_trainingos_assessment_answer(uuid,uuid,integer,jsonb)','execute') end,
            'weakAssessmentSubmitExecutable',case when to_regprocedure('public.submit_trainingos_assessment_attempt(uuid,integer,jsonb)') is null then false else has_function_privilege('authenticated','public.submit_trainingos_assessment_attempt(uuid,integer,jsonb)','execute') end,
            'exactAssessmentSaveExecutable',has_function_privilege('authenticated','public.save_trainingos_assessment_answer(uuid,uuid,integer,integer,jsonb,text)','execute'),
            'exactAssessmentConfirmExecutable',has_function_privilege('authenticated','public.confirm_trainingos_assessment_submission(uuid,integer,text,text)','execute'),
            'assessmentStartExecutable',has_function_privilege('authenticated','public.start_trainingos_assessment_attempt(uuid,integer)','execute'),
            'weakExerciseConfirmExecutable',case when to_regprocedure('public.confirm_my_trainingos_exercise_submission(uuid,bigint,text,boolean,text)') is null then false else has_function_privilege('authenticated','public.confirm_my_trainingos_exercise_submission(uuid,bigint,text,boolean,text)','execute') end,
            'exactExerciseConfirmExecutable',has_function_privilege('authenticated','public.confirm_my_trainingos_exercise_submission(uuid,bigint,text,text,text)','execute'),
            'transitionTriggers',(select count(*) from pg_catalog.pg_trigger where tgrelid='public.exercise_submissions'::pg_catalog.regclass and not tgisinternal and tgname in ('validate_exercise_submission_scope','validate_exercise_submission_rpc_scope')),
            'privateExerciseTriggerExecutable',has_function_privilege('authenticated','trainingos_student_exercise_private.validate_rpc_submission_scope()','execute'),
            'privateAnswerValidatorExecutable',has_function_privilege('authenticated','trainingos_assessment_private.validate_answer()','execute'),
            'functionBodies',current_setting('check_function_bodies')
          );
          SQL
          )"
          python - "$result" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          expected={
            'duplicateTables':0,
            'assessmentDirectPrivileges':0,
            'weakAssessmentSaveExecutable':False,
            'weakAssessmentSubmitExecutable':False,
            'exactAssessmentSaveExecutable':True,
            'exactAssessmentConfirmExecutable':True,
            'assessmentStartExecutable':True,
            'weakExerciseConfirmExecutable':False,
            'exactExerciseConfirmExecutable':True,
            'transitionTriggers':2,
            'privateExerciseTriggerExecutable':False,
            'privateAnswerValidatorExecutable':False,
            'functionBodies':'on',
          }
          assert d==expected,(d,expected)
          PY
      - name: First canonical business E2E pass
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f tests/sql/trainingos_student_exercise_canonical_reconciliation_e2e.sql > "$RUNNER_TEMP/pr339-exercise-first.log" 2>&1
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f tests/sql/trainingos_student_learning_canonical_reconciliation_e2e.sql > "$RUNNER_TEMP/pr339-assessment-first.log" 2>&1
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f tests/sql/trainingos_wave3_assessment_grading_result_canonical_bridge_e2e.sql > "$RUNNER_TEMP/pr339-result-first.log" 2>&1
      - name: Second deterministic reset and E2E pass
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          supabase --workdir "$RUNNER_TEMP/pr339-db-final" db reset --local --no-seed > "$RUNNER_TEMP/pr339-reset.log" 2>&1
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f tests/sql/trainingos_student_exercise_canonical_reconciliation_e2e.sql > "$RUNNER_TEMP/pr339-exercise-second.log" 2>&1
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f tests/sql/trainingos_student_learning_canonical_reconciliation_e2e.sql > "$RUNNER_TEMP/pr339-assessment-second.log" 2>&1
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -f tests/sql/trainingos_wave3_assessment_grading_result_canonical_bridge_e2e.sql > "$RUNNER_TEMP/pr339-result-second.log" 2>&1
      - name: Publish sanitized final database evidence
        run: |
          {
            echo 'exact_private_sha=ce66d6d388b6f6353e3b7967f392dec58e31a551'
            echo 'exact_base_sha=26fc34af65b9489985aa9a5cbe45c9d1590826bf'
            echo 'canonical_bootstrap=PASS'
            echo 'acl_trigger_privacy_contract=PASS'
            echo 'weak_assessment_rpc_revocation=PASS'
            echo 'weak_exercise_confirmation_revocation=PASS'
            echo 'exercise_e2e_first=PASS_ZERO_RESIDUE'
            echo 'assessment_e2e_first=PASS_ZERO_RESIDUE'
            echo 'grading_result_bridge_first=PASS_ZERO_RESIDUE'
            echo 'second_reset_replay=PASS'
            echo 'exercise_e2e_second=PASS_ZERO_RESIDUE'
            echo 'assessment_e2e_second=PASS_ZERO_RESIDUE'
            echo 'grading_result_bridge_second=PASS_ZERO_RESIDUE'
            echo 'raw_private_database_output=SEALED_AND_DELETED'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup
        if: always()
        run: |
          supabase --workdir "$RUNNER_TEMP/pr339-db-final" stop --no-backup >/dev/null 2>&1 || true
          rm -rf private-repo "$RUNNER_TEMP"/pr339-*
