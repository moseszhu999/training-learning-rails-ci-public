name: Validate current private TrainingOS GC-03 fresh replay

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/validate-private-gc03-fresh-replay-current.yml

permissions:
  contents: read

concurrency:
  group: private-gc03-fresh-current-dea1609b239c8d10dffab5fa3ef235a12c8f2926
  cancel-in-progress: false

jobs:
  fresh-replay:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ci/verify-private-gc03-fresh-replay-current'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRIVATE_SHA: dea1609b239c8d10dffab5fa3ef235a12c8f2926
      SUPABASE_CLI_VERSION: 2.109.1
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    outputs:
      init_status: ${{ steps.replay.outputs.init_status }}
      start_status: ${{ steps.replay.outputs.start_status }}
      reset_status: ${{ steps.replay.outputs.reset_status }}
      last_migration: ${{ steps.replay.outputs.last_migration }}
      failure_stage: ${{ steps.replay.outputs.failure_stage }}
      error_class: ${{ steps.replay.outputs.error_class }}

    steps:
      - name: Validate exact head and local prerequisites
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]
          docker version >/dev/null

      - name: Check out current private GC-03 exact head
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: dea1609b239c8d10dffab5fa3ef235a12c8f2926
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact SHA and clean checkout
        working-directory: private-repo
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          [[ -d supabase/migrations ]]
          [[ ! -f supabase/config.toml ]]

      - name: Run fresh local Supabase replay
        id: replay
        working-directory: private-repo
        run: |
          set +e
          init_status=FAIL
          start_status=NOT_RUN
          reset_status=NOT_RUN
          failure_stage=init
          last_migration=none
          error_class=none

          npx --yes "supabase@$SUPABASE_CLI_VERSION" init \
            > "$RUNNER_TEMP/fresh-init.log" 2>&1
          init_code=$?
          if [[ $init_code -eq 0 && -f supabase/config.toml ]]; then
            init_status=PASS
            failure_stage=start
            timeout 35m npx --yes "supabase@$SUPABASE_CLI_VERSION" start \
              > "$RUNNER_TEMP/fresh-start.log" 2>&1
            start_code=$?
            if [[ $start_code -eq 0 ]]; then
              start_status=PASS
              failure_stage=reset
              timeout 15m npx --yes "supabase@$SUPABASE_CLI_VERSION" db reset --local --no-seed \
                > "$RUNNER_TEMP/fresh-reset.log" 2>&1
              reset_code=$?
              if [[ $reset_code -eq 0 ]]; then
                reset_status=PASS
                failure_stage=none
              else
                reset_status=FAIL
              fi
            else
              start_status=FAIL
            fi
          fi

          for log in "$RUNNER_TEMP/fresh-start.log" "$RUNNER_TEMP/fresh-reset.log"; do
            if [[ -f "$log" ]]; then
              candidate=$(grep -oE 'Applying migration [^[:space:]]+\.sql' "$log" | tail -1 | sed 's/^Applying migration //' || true)
              if [[ -n "$candidate" ]]; then
                last_migration=$(basename "$candidate" | tr -cd 'A-Za-z0-9_.-')
              fi
            fi
          done

          error_class=$(python - "$RUNNER_TEMP/fresh-start.log" "$RUNNER_TEMP/fresh-reset.log" <<'PY'
          import pathlib, re, sys
          text = "\n".join(
              pathlib.Path(path).read_text(encoding="utf-8", errors="replace")
              for path in sys.argv[1:]
              if pathlib.Path(path).exists()
          )
          checks = [
              (r'relation\s+"?([A-Za-z0-9_.]+)"?\s+does not exist', 'missing_relation'),
              (r'column\s+"?([A-Za-z0-9_.]+)"?\s+does not exist', 'missing_column'),
              (r'function\s+([A-Za-z0-9_.]+)[^(\n]*does not exist', 'missing_function'),
              (r'type\s+"?([A-Za-z0-9_.]+)"?\s+does not exist', 'missing_type'),
          ]
          result = 'none'
          for pattern, prefix in checks:
              matches = re.findall(pattern, text, flags=re.IGNORECASE)
              if matches:
                  token = re.sub(r'[^A-Za-z0-9_.-]', '', matches[-1])[:80]
                  result = f'{prefix}_{token}' if token else prefix
                  break
          lower = text.lower()
          if result == 'none':
              if 'duplicate key value' in lower:
                  result = 'duplicate_key'
              elif 'syntax error' in lower:
                  result = 'syntax_error'
              elif 'permission denied' in lower:
                  result = 'permission_denied'
              elif 'container is not ready' in lower or 'failed to start docker' in lower:
                  result = 'docker_start'
              elif 'error:' in lower or 'error ' in lower:
                  result = 'unclassified_error'
          print(result)
          PY
          )
          error_class=$(printf '%s' "$error_class" | tr -cd 'A-Za-z0-9_.-')
          [[ -n "$error_class" ]] || error_class=unclassified_error

          {
            echo "init_status=$init_status"
            echo "start_status=$start_status"
            echo "reset_status=$reset_status"
            echo "last_migration=$last_migration"
            echo "failure_stage=$failure_stage"
            echo "error_class=$error_class"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Destroy local stack and sealed logs
        if: always()
        working-directory: private-repo
        run: |
          set +e
          if [[ -f supabase/config.toml ]]; then
            npx --yes "supabase@$SUPABASE_CLI_VERSION" stop --no-backup \
              > "$RUNNER_TEMP/fresh-stop.log" 2>&1
          fi
          docker ps -aq --filter 'label=com.supabase.cli.project' | xargs -r docker rm -f >/dev/null 2>&1
          docker volume ls -q --filter 'label=com.supabase.cli.project' | xargs -r docker volume rm -f >/dev/null 2>&1
          cd ..
          rm -rf private-repo \
            "$RUNNER_TEMP/fresh-init.log" \
            "$RUNNER_TEMP/fresh-start.log" \
            "$RUNNER_TEMP/fresh-reset.log" \
            "$RUNNER_TEMP/fresh-stop.log"
          exit 0

  enforce-results:
    needs: fresh-replay
    if: always()
    name: >-
      result init-${{ needs.fresh-replay.outputs.init_status }}
      start-${{ needs.fresh-replay.outputs.start_status }}
      reset-${{ needs.fresh-replay.outputs.reset_status }}
      stage-${{ needs.fresh-replay.outputs.failure_stage }}
      migration-${{ needs.fresh-replay.outputs.last_migration }}
      error-${{ needs.fresh-replay.outputs.error_class }}
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce fresh replay
        env:
          INIT_STATUS: ${{ needs.fresh-replay.outputs.init_status }}
          START_STATUS: ${{ needs.fresh-replay.outputs.start_status }}
          RESET_STATUS: ${{ needs.fresh-replay.outputs.reset_status }}
        run: |
          [[ "$INIT_STATUS" == PASS ]]
          [[ "$START_STATUS" == PASS ]]
          [[ "$RESET_STATUS" == PASS ]]
