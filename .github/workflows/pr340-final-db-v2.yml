name: PR340 synchronized Classroom Lark database v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr340-final-db-v2.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_SHA: b7ef9890d18a97dc501057c51a955a730b62f53e
  BASE_SHA: 542c590e6ce8ebefeb0c5a010e4dc3bfa9f75547
  DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  canonical-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Validate credential and exact SHAs
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Verify exact head and current-main ancestry
        working-directory: private-repo
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$PRIVATE_SHA")" == "$BASE_SHA" ]]
          [[ "$(git rev-list --count "$PRIVATE_SHA..$BASE_SHA")" == 0 ]]
      - name: Build and start canonical fresh bootstrap
        working-directory: private-repo
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/pr340-db-v2"
          rm -rf "$workdir" && mkdir -p "$workdir"
          supabase --workdir "$workdir" init --force --yes > "$RUNNER_TEMP/pr340-v2-init.log" 2>&1
          python scripts/build-trainingos-fresh-bootstrap.py \
            --repo-root "$PWD" \
            --output-dir "$workdir/supabase/migrations" \
            --commit-sha "$PRIVATE_SHA" > "$RUNNER_TEMP/pr340-v2-bootstrap.log" 2>&1
          test -n "$(find "$workdir/supabase/migrations" -type f -name '*.sql' -print -quit)"
          supabase --workdir "$workdir" start > "$RUNNER_TEMP/pr340-v2-start.log" 2>&1
      - name: First Lark transaction E2E
        working-directory: private-repo
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -1 -v ON_ERROR_STOP=1 -At \
            -f tests/sql/trainingos_classroom_lark_adapter_e2e.sql \
            > "$RUNNER_TEMP/pr340-v2-first.out" 2> "$RUNNER_TEMP/pr340-v2-first.err"
          python - "$RUNNER_TEMP/pr340-v2-first.out" <<'PY'
          import json,pathlib,sys
          lines=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace').splitlines()
          payload=next(json.loads(line) for line in reversed(lines) if line.strip().startswith('{'))
          required={
              'status':'PASS','cleanupStatus':'PASS','zeroResidueCount':0,
              'transcriptImmutable':True,'studentProjectionRejected':True,
              'agentConfirmationRejected':True,'attendanceDeterminationPerformed':False,
              'exactRecordingStatusEvents':True,'completedRecordingTokenBinding':True,
              'minuteTokenExposed':False,'speakerCandidatesOnly':True,
          }
          for key,value in required.items():
              assert payload.get(key)==value,(key,payload.get(key),value,payload)
          PY
      - name: Live RLS ACL search-path and immutability catalog
        run: |
          set -euo pipefail
          catalog="$(psql "$DB_URL" -X -Atv ON_ERROR_STOP=1 <<'SQL'
          with expected_tables(name) as (
            values
              ('trainingos_classroom_lark_meeting_bindings'),
              ('trainingos_classroom_lark_recording_events'),
              ('trainingos_classroom_lark_minute_sources'),
              ('trainingos_classroom_lark_transcripts'),
              ('trainingos_classroom_lark_speaker_candidates'),
              ('trainingos_classroom_lark_speaker_confirmations'),
              ('trainingos_classroom_lark_audit_events')
          ), expected_triggers(name) as (
            values
              ('trainingos_lark_binding_immutable'),
              ('trainingos_lark_recording_event_immutable'),
              ('trainingos_lark_minute_source_immutable'),
              ('trainingos_lark_transcript_immutable'),
              ('trainingos_lark_candidate_immutable'),
              ('trainingos_lark_confirmation_immutable'),
              ('trainingos_lark_audit_immutable')
          )
          select jsonb_build_object(
            'tables',(select count(*) from expected_tables e join pg_class c on c.relname=e.name join pg_namespace n on n.oid=c.relnamespace and n.nspname='public'),
            'forced',(select count(*) from expected_tables e join pg_class c on c.relname=e.name join pg_namespace n on n.oid=c.relnamespace and n.nspname='public' where c.relrowsecurity and c.relforcerowsecurity),
            'directGrants',(select count(*) from information_schema.role_table_grants g join expected_tables e on e.name=g.table_name where g.table_schema='public' and g.grantee in ('PUBLIC','anon','authenticated','service_role')),
            'privateExec',(select count(*) from information_schema.routine_privileges r where r.specific_schema='private' and r.routine_name like 'trainingos_lark%' and r.grantee in ('PUBLIC','anon','authenticated','service_role') and r.privilege_type='EXECUTE'),
            'publicFunctions',(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname like '%trainingos_lark%'),
            'securePublic',(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname like '%trainingos_lark%' and p.prosecdef and exists(select 1 from unnest(coalesce(p.proconfig,array[]::text[])) setting where setting='search_path=')),
            'immutableTriggers',(select count(*) from expected_triggers e join pg_trigger t on t.tgname=e.name where not t.tgisinternal)
          );
          SQL
          )"
          python - "$catalog" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          assert d['tables']==7,d
          assert d['forced']==7,d
          assert d['directGrants']==0,d
          assert d['privateExec']==0,d
          assert d['publicFunctions']>=1,d
          assert d['securePublic']==d['publicFunctions'],d
          assert d['immutableTriggers']==7,d
          PY
      - name: Second deterministic replay and E2E
        working-directory: private-repo
        run: |
          set -euo pipefail
          supabase --workdir "$RUNNER_TEMP/pr340-db-v2" db reset --local --no-seed > "$RUNNER_TEMP/pr340-v2-reset.log" 2>&1
          psql "$DB_URL" -X -1 -v ON_ERROR_STOP=1 -At \
            -f tests/sql/trainingos_classroom_lark_adapter_e2e.sql \
            > "$RUNNER_TEMP/pr340-v2-second.out" 2> "$RUNNER_TEMP/pr340-v2-second.err"
          python - "$RUNNER_TEMP/pr340-v2-second.out" <<'PY'
          import json,pathlib,sys
          payload=next(json.loads(line) for line in reversed(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace').splitlines()) if line.strip().startswith('{'))
          assert payload.get('status')=='PASS',payload
          assert payload.get('cleanupStatus')=='PASS',payload
          assert payload.get('zeroResidueCount')==0,payload
          assert payload.get('transcriptImmutable') is True,payload
          assert payload.get('studentProjectionRejected') is True,payload
          assert payload.get('agentConfirmationRejected') is True,payload
          assert payload.get('attendanceDeterminationPerformed') is False,payload
          PY
      - name: Sanitized database result
        run: |
          {
            echo 'exact_private_sha=b7ef9890d18a97dc501057c51a955a730b62f53e'
            echo 'exact_base_sha=542c590e6ce8ebefeb0c5a010e4dc3bfa9f75547'
            echo 'canonical_bootstrap=PASS'
            echo 'first_lark_e2e=PASS'
            echo 'tables_force_rls=PASS_7_7'
            echo 'raw_direct_grants=PASS_0'
            echo 'private_helper_execute=PASS_0'
            echo 'public_fixed_search_path=PASS'
            echo 'immutable_triggers=PASS_7_7'
            echo 'second_replay_lark_e2e=PASS'
            echo 'zero_residue=PASS'
            echo 'raw_private_database_output=SEALED_AND_DELETED'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup
        if: always()
        run: |
          supabase --workdir "$RUNNER_TEMP/pr340-db-v2" stop --no-backup >/dev/null 2>&1 || true
          rm -rf private-repo "$RUNNER_TEMP"/pr340-v2-*
