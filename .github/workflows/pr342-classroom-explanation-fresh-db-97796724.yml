name: PR342 Classroom Explanation fresh database replay

on:
  push:
    branches:
      - ci/pr342-classroom-explanation-97796724
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr342-classroom-explanation-fresh-db-97796724
  cancel-in-progress: false

jobs:
  fresh-database-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PRIVATE_SHA: 977967243264c23f377570d3658f97cc5b3a6703
      LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify exact head and local runtime
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]]
          docker version >/dev/null
          supabase --version >/dev/null
          psql --version >/dev/null

      - name: Build fresh bootstrap and run SQL E2E twice
        id: database
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          workdir="$RUNNER_TEMP/pr342-supabase"
          raw_log="$RUNNER_TEMP/pr342-database.log"
          evidence_one="$RUNNER_TEMP/pr342-evidence-1.txt"
          evidence_two="$RUNNER_TEMP/pr342-evidence-2.txt"
          rm -rf "$workdir"
          mkdir -p "$workdir"
          {
            supabase --workdir "$workdir" init --force --yes
            python scripts/build-trainingos-fresh-bootstrap.py \
              --repo-root "$PWD" \
              --output-dir "$workdir/supabase/migrations" \
              --commit-sha "$PRIVATE_SHA"
            echo stage=initial_start
            supabase --workdir "$workdir" start
            echo stage=destructive_reset_1
            supabase --workdir "$workdir" db reset --local --no-seed
            psql "$LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At \
              -f tests/sql/trainingos_classroom_explanation_e2e.sql > "$evidence_one"
            echo stage=destructive_reset_2
            supabase --workdir "$workdir" db reset --local --no-seed
            psql "$LOCAL_DATABASE_URL" -X -v ON_ERROR_STOP=1 -At \
              -f tests/sql/trainingos_classroom_explanation_e2e.sql > "$evidence_two"
          } > "$raw_log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          python - "$evidence_one" "$evidence_two" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys

          expected_true = (
              'oneActiveExplanationEnforced',
              'activeSlotReleasedAfterUpload',
              'secondExplanationStarted',
              'classEndedStartRejected',
              'agentRecordingRejected',
              'agentInferencePersisted',
              'prohibitedCandidateRejected',
              'teacherEvaluationConfirmed',
              'agentConfirmRejected',
              'staleVersionRejected',
              'staleTranscriptRejected',
              'crossClassRejected',
              'transcriptUpdateRejected',
              'transcriptDeleteRejected',
              'rawAudioHidden',
              'idempotencyConflictRejected',
              'transcriptIdempotencyConflictRejected',
          )

          def load(path):
              lines = [line.strip() for line in pathlib.Path(path).read_text(encoding='utf-8', errors='replace').splitlines()]
              objects = []
              for line in lines:
                  if not line.startswith('{'):
                      continue
                  try:
                      objects.append(json.loads(line))
                  except json.JSONDecodeError:
                      pass
              return objects[-1] if objects else {}

          first = load(sys.argv[1])
          second = load(sys.argv[2])
          def valid(value):
              return (
                  value.get('status') == 'PASS'
                  and value.get('fixtureCleanup') == 'PLPGSQL_SUBTRANSACTION_ROLLBACK'
                  and all(value.get(key) is True for key in expected_true)
                  and all(value.get(key) == 0 for key in value if key.startswith('remaining'))
              )
          with open(sys.argv[3], 'a', encoding='utf-8') as out:
              out.write(f'first_pass={str(valid(first)).lower()}\n')
              out.write(f'second_pass={str(valid(second)).lower()}\n')
              out.write(f'first_status={first.get("status", "MISSING")}\n')
              out.write(f'second_status={second.get("status", "MISSING")}\n')
              out.write(f'first_remaining_zero={str(bool(first) and all(first.get(key) == 0 for key in first if key.startswith("remaining"))).lower()}\n')
              out.write(f'second_remaining_zero={str(bool(second) and all(second.get(key) == 0 for key in second if key.startswith("remaining"))).lower()}\n')
          PY
          exit 0

      - name: Publish sanitized database result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.database.outputs.exit_code }}
          FIRST_PASS: ${{ steps.database.outputs.first_pass }}
          SECOND_PASS: ${{ steps.database.outputs.second_pass }}
          FIRST_STATUS: ${{ steps.database.outputs.first_status }}
          SECOND_STATUS: ${{ steps.database.outputs.second_status }}
          FIRST_ZERO: ${{ steps.database.outputs.first_remaining_zero }}
          SECOND_ZERO: ${{ steps.database.outputs.second_remaining_zero }}
        run: |
          status=FAIL
          if [[ "${EXIT_CODE:-1}" == "0" && "$FIRST_PASS" == "true" && "$SECOND_PASS" == "true" ]]; then
            status=PASS
          fi
          report="$GITHUB_WORKSPACE/pr342-classroom-explanation-fresh-db.txt"
          {
            echo 'Private PR #342 Classroom Explanation fresh database E2E'
            echo "exact_private_sha=$PRIVATE_SHA"
            echo "fresh_database_e2e=$status"
            echo "first_status=${FIRST_STATUS:-MISSING}"
            echo "second_status=${SECOND_STATUS:-MISSING}"
            echo "first_remaining_zero=${FIRST_ZERO:-false}"
            echo "second_remaining_zero=${SECOND_ZERO:-false}"
            echo 'destructive_reset_count=2'
            echo 'private_checkout_raw_logs_database_and_fixture_evidence=SEALED_AND_DELETED'
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          cat "$report"

      - name: Upload sanitized database result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr342-classroom-explanation-fresh-db-97796724
          path: pr342-classroom-explanation-fresh-db.txt
          if-no-files-found: error
          retention-days: 3

      - name: Cleanup private checkout, database, and sealed logs
        if: always()
        shell: bash
        run: |
          supabase --workdir "$RUNNER_TEMP/pr342-supabase" stop --no-backup >/dev/null 2>&1 || true
          rm -rf private-repo "$RUNNER_TEMP/pr342-supabase" "$RUNNER_TEMP"/pr342-*.log \
            "$RUNNER_TEMP"/pr342-evidence-*.txt "$GITHUB_WORKSPACE/pr342-classroom-explanation-fresh-db.txt"

      - name: Enforce fresh database result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.database.outputs.exit_code }}
          FIRST_PASS: ${{ steps.database.outputs.first_pass }}
          SECOND_PASS: ${{ steps.database.outputs.second_pass }}
        run: |
          [[ "${EXIT_CODE:-1}" == "0" ]]
          [[ "$FIRST_PASS" == "true" ]]
          [[ "$SECOND_PASS" == "true" ]]
