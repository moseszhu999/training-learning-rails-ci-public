name: Classroom Lark DB replay diagnostic

on:
  push:
    branches:
      - ci/classroom-lark-6663e16e
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/classroom-lark-db-diagnostic-6663e16e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      diagnostic: ${{ steps.scan.outputs.diagnostic }}
    env:
      PRIVATE_SHA: 6663e16e0ab44c9e91d6d8c012928b561691c029

    steps:
      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1

      - name: Locate canonical classroom session migration owner
        id: scan
        working-directory: private-repo
        shell: bash
        run: |
          diagnostic="$(python <<'PY'
          from pathlib import Path
          import re

          root = Path('supabase/migrations')
          create_pattern = re.compile(
              r'create\s+table(?:\s+if\s+not\s+exists)?\s+(?:public\.)?classroom_sessions\b',
              re.I,
          )
          reference_pattern = re.compile(r'\bclassroom_sessions\b', re.I)
          creators = []
          references = []
          for path in sorted(root.glob('*.sql')):
              text = path.read_text(encoding='utf-8', errors='replace')
              if create_pattern.search(text):
                  creators.append(path.name)
              if reference_pattern.search(text):
                  references.append(path.name)
          legacy = [path.name for path in sorted(root.glob('*.sql')) if re.match(r'^\d{8}_', path.name)]
          print(
              'MIGRATION_OWNER_DIAGNOSTIC '
              f'creators={",".join(creators) if creators else "none"} '
              f'first_reference={references[0] if references else "none"} '
              f'reference_count={len(references)} legacy_count={len(legacy)} '
              f'legacy_first={legacy[0] if legacy else "none"} legacy_last={legacy[-1] if legacy else "none"}'
          )
          PY
          )"
          echo "diagnostic=$diagnostic" >> "$GITHUB_OUTPUT"

  report:
    needs: discover
    runs-on: ubuntu-24.04
    steps:
      - name: Print migration-owner diagnostic
        shell: bash
        env:
          DIAGNOSTIC: ${{ needs.discover.outputs.diagnostic }}
        run: |
          echo "$DIAGNOSTIC"
