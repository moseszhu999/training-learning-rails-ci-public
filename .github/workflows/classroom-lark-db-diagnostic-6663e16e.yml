name: Classroom Lark DB replay diagnostic

on:
  push:
    branches:
      - ci/classroom-lark-6663e16e
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/classroom-lark-db-diagnostic-6663e16e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      diagnostic: ${{ steps.scan.outputs.diagnostic }}
    env:
      PRIVATE_SHA: 6663e16e0ab44c9e91d6d8c012928b561691c029

    steps:
      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - name: Locate legacy migration creation order
        id: scan
        working-directory: private-repo
        shell: bash
        run: |
          diagnostic="$(python <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('supabase/migrations')
          create_pattern = re.compile(
              r'create\s+table(?:\s+if\s+not\s+exists)?\s+(?:public\.)?classroom_sessions\b',
              re.I,
          )
          creators = []
          legacy = []
          for path in sorted(root.glob('*.sql')):
              text = path.read_text(encoding='utf-8', errors='replace')
              if create_pattern.search(text):
                  creators.append(path.name)
              if re.match(r'^\d{8}_', path.name):
                  result = subprocess.run(
                      ['git', 'log', '--diff-filter=A', '--format=%ct', '--', str(path)],
                      check=False,
                      capture_output=True,
                      text=True,
                  )
                  timestamps = [int(item) for item in result.stdout.split() if item.isdigit()]
                  created_at = min(timestamps) if timestamps else 0
                  legacy.append((created_at, path.name))
          git_order = [name for _, name in sorted(legacy, key=lambda item: (item[0], item[1]))]
          print(
              'MIGRATION_ORDER_DIAGNOSTIC '
              f'creators={",".join(creators) if creators else "none"} '
              f'legacy_count={len(legacy)} '
              f'git_order={",".join(git_order)}'
          )
          PY
          )"
          echo "diagnostic=$diagnostic" >> "$GITHUB_OUTPUT"

  report:
    needs: discover
    runs-on: ubuntu-24.04
    steps:
      - name: Print migration-order diagnostic
        shell: bash
        env:
          DIAGNOSTIC: ${{ needs.discover.outputs.diagnostic }}
        run: |
          echo "$DIAGNOSTIC"
