name: Classroom Lark DB replay diagnostic

on:
  push:
    branches:
      - ci/classroom-lark-6663e16e
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/classroom-lark-db-diagnostic-6663e16e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      diagnostic: ${{ steps.scan.outputs.diagnostic }}
    env:
      PRIVATE_SHA: 6663e16e0ab44c9e91d6d8c012928b561691c029

    steps:
      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1

      - name: Locate catalog metadata migration owner
        id: scan
        working-directory: private-repo
        shell: bash
        run: |
          diagnostic="$(python <<'PY'
          from pathlib import Path
          import re

          root = Path('supabase/migrations')
          mentions = []
          owners = []
          source_asset_creators = []
          add_pattern = re.compile(
              r'alter\s+table\s+(?:if\s+exists\s+)?(?:public\.)?source_assets[\s\S]{0,800}?add\s+column(?:\s+if\s+not\s+exists)?\s+catalog_metadata\b',
              re.I,
          )
          create_table_pattern = re.compile(
              r'create\s+table(?:\s+if\s+not\s+exists)?\s+(?:public\.)?source_assets\b',
              re.I,
          )
          inline_column_pattern = re.compile(r'\bcatalog_metadata\b', re.I)
          for path in sorted(root.glob('*.sql')):
              text = path.read_text(encoding='utf-8', errors='replace')
              if inline_column_pattern.search(text):
                  mentions.append(path.name)
              if add_pattern.search(text):
                  owners.append(path.name)
              if create_table_pattern.search(text):
                  source_asset_creators.append(path.name)
                  table_chunk = text[create_table_pattern.search(text).end():]
                  if re.search(r'\bcatalog_metadata\b', table_chunk[:5000], re.I):
                      owners.append(path.name)
          print(
              'CATALOG_METADATA_DIAGNOSTIC '
              f'table_creators={",".join(source_asset_creators) if source_asset_creators else "none"} '
              f'column_owners={",".join(sorted(set(owners))) if owners else "none"} '
              f'mentions={",".join(mentions) if mentions else "none"}'
          )
          PY
          )"
          echo "diagnostic=$diagnostic" >> "$GITHUB_OUTPUT"

  report:
    needs: discover
    runs-on: ubuntu-24.04
    steps:
      - name: Print catalog metadata diagnostic
        shell: bash
        env:
          DIAGNOSTIC: ${{ needs.discover.outputs.diagnostic }}
        run: |
          echo "$DIAGNOSTIC"
