name: Classroom Lark DB replay diagnostic

on:
  push:
    branches:
      - ci/classroom-lark-6663e16e
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/classroom-lark-db-diagnostic-6663e16e.yml
      - scripts/reorder-migrations-for-replay.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      diagnostic: ${{ steps.classify.outputs.diagnostic }}
    env:
      PRIVATE_SHA: f55b6383861bb604c83e4423add51ff1fb994a87

    steps:
      - name: Check out public CI runner
        uses: actions/checkout@v4
        with:
          path: ci-runner
          persist-credentials: false

      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Replay exact head with dependency ordering
        id: classify
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          db_log="$RUNNER_TEMP/classroom-lark-db-diagnostic.log"
          normalizer_log="$RUNNER_TEMP/classroom-lark-normalizer.log"
          order_report="$RUNNER_TEMP/classroom-lark-order-report.txt"
          saved_migrations="$RUNNER_TEMP/classroom-lark-migrations"
          : > "$db_log"
          : > "$normalizer_log"

          supabase init --force >> "$db_log" 2>&1
          init_code=$?
          start_code=1
          normalize_code=1
          reset_code=1

          if [[ "$init_code" == "0" ]]; then
            mv supabase/migrations "$saved_migrations"
            mkdir -p supabase/migrations
            supabase start --debug >> "$db_log" 2>&1
            start_code=$?
            rm -rf supabase/migrations
            mv "$saved_migrations" supabase/migrations
          fi

          if [[ "$start_code" == "0" ]]; then
            python ../ci-runner/scripts/reorder-migrations-for-replay.py \
              supabase/migrations --report "$order_report" \
              > "$normalizer_log" 2>&1
            normalize_code=$?
          fi

          if [[ "$normalize_code" == "0" ]]; then
            supabase db reset --local --no-seed --debug >> "$db_log" 2>&1
            reset_code=$?
          fi

          diagnostic="$(python - "$db_log" "$normalizer_log" "$order_report" "$init_code" "$start_code" "$normalize_code" "$reset_code" <<'PY'
          import hashlib
          import pathlib
          import re
          import sys

          db_path = pathlib.Path(sys.argv[1])
          normalizer_path = pathlib.Path(sys.argv[2])
          report_path = pathlib.Path(sys.argv[3])
          raw = db_path.read_text(encoding='utf-8', errors='replace')
          normalizer = normalizer_path.read_text(encoding='utf-8', errors='replace')
          report = report_path.read_text(encoding='utf-8', errors='replace') if report_path.exists() else 'status=NO_REPORT'
          text = re.sub(r'\x1b\[[0-9;?]*[ -/]*[@-~]', '', raw)
          applying = re.findall(r'Applying migration\s+([^\s]+)', text, flags=re.I)
          candidates = []
          for line in text.splitlines():
              stripped = re.sub(r'\s+', ' ', line.strip())
              if re.search(
                  r'(ERROR:|FATAL:|SQLSTATE|DETAIL:|HINT:|CONTEXT:|failed to apply|migration failed|syntax error|does not exist|already exists|duplicate|violates|permission denied|effect/sql/SqlError|Failed to execute statement)',
                  stripped,
                  flags=re.I,
              ) and 'Try rerunning the command with --debug' not in stripped:
                  candidates.append(stripped)
          if int(sys.argv[6]) != 0:
              candidates.extend(normalizer.splitlines()[-8:])
          error = ' | '.join(candidates[-12:]) if candidates else 'none-captured'
          error = re.sub(r'https?://\S+', '<url>', error)
          error = re.sub(r'[0-9a-f]{8}-[0-9a-f-]{27,}', '<uuid>', error, flags=re.I)
          error = re.sub(r"'[^']*'", "'<redacted>'", error)
          error = re.sub(r'\s+', ' ', error)[:2400]
          report = re.sub(r'\s+', '_', report)[:1000]
          digest = hashlib.sha256(raw.encode('utf-8', errors='replace')).hexdigest()
          print(
              'DB_REPLAY_DIAGNOSTIC '
              f'init={sys.argv[4]} start={sys.argv[5]} normalize={sys.argv[6]} reset={sys.argv[7]} '
              f'order={report} '
              f'last_migration={pathlib.Path(applying[-1]).name if applying else "none"} '
              f'error={error} log_sha256={digest}'
          )
          PY
          )"
          echo "diagnostic=$diagnostic" >> "$GITHUB_OUTPUT"
          supabase stop --no-backup > /dev/null 2>&1 || true
          rm -f "$db_log" "$normalizer_log" "$order_report"
          exit 0

  report:
    needs: diagnose
    runs-on: ubuntu-24.04
    steps:
      - name: Print sanitized replay diagnostic
        shell: bash
        env:
          DIAGNOSTIC: ${{ needs.diagnose.outputs.diagnostic }}
        run: |
          echo "$DIAGNOSTIC"
