name: Classroom Lark DB replay diagnostic

on:
  push:
    branches:
      - ci/classroom-lark-6663e16e
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/classroom-lark-db-diagnostic-6663e16e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      diagnostic: ${{ steps.classify.outputs.diagnostic }}
    env:
      PRIVATE_SHA: 6663e16e0ab44c9e91d6d8c012928b561691c029

    steps:
      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Replay with dependency-ordered legacy migration normalization
        id: classify
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          db_log="$RUNNER_TEMP/classroom-lark-db-diagnostic.log"
          saved_migrations="$RUNNER_TEMP/classroom-lark-migrations"
          order_report="$RUNNER_TEMP/classroom-lark-order-report.txt"
          : > "$db_log"
          supabase init --force >> "$db_log" 2>&1
          init_code=$?
          start_code=1
          reset_code=1
          normalized_count=0
          order_status=NOT_RUN
          if [[ "$init_code" == "0" ]]; then
            mv supabase/migrations "$saved_migrations"
            mkdir -p supabase/migrations
            supabase start --debug >> "$db_log" 2>&1
            start_code=$?
            rm -rf supabase/migrations
            mv "$saved_migrations" supabase/migrations
          fi
          if [[ "$start_code" == "0" ]]; then
            normalized_count="$(python - "$order_report" <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import heapq
          import re
          import subprocess
          import sys

          report_path = Path(sys.argv[1])
          root = Path('supabase/migrations')
          used = {
              path.name.split('_', 1)[0]
              for path in root.glob('*.sql')
              if re.match(r'^\d{14}_', path.name)
          }
          groups = defaultdict(list)
          contents = {}
          created_at = {}
          create_pattern = re.compile(
              r'create\s+table(?:\s+if\s+not\s+exists)?\s+(?:public\.)?([a-z_][a-z0-9_]*)',
              re.I,
          )
          public_ref_pattern = re.compile(r'\bpublic\.([a-z_][a-z0-9_]*)', re.I)

          for path in root.glob('*.sql'):
              match = re.match(r'^(\d{8})_(.+\.sql)$', path.name)
              if not match:
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              contents[path] = text
              result = subprocess.run(
                  ['git', 'log', '--diff-filter=A', '--format=%ct', '--', str(path)],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              timestamps = [int(item) for item in result.stdout.split() if item.isdigit()]
              created_at[path] = min(timestamps) if timestamps else 0
              groups[match.group(1)].append((path, match.group(2)))

          ordered_all = []
          dependency_edges = []
          for day, entries in sorted(groups.items()):
              paths = [path for path, _ in entries]
              suffix_by_path = {path: suffix for path, suffix in entries}
              creator_by_table = {}
              for path in paths:
                  for table in create_pattern.findall(contents[path]):
                      creator_by_table.setdefault(table.lower(), path)

              outgoing = {path: set() for path in paths}
              indegree = {path: 0 for path in paths}
              for consumer in paths:
                  refs = {name.lower() for name in public_ref_pattern.findall(contents[consumer])}
                  for table in refs:
                      producer = creator_by_table.get(table)
                      if producer is None or producer == consumer or consumer in outgoing[producer]:
                          continue
                      outgoing[producer].add(consumer)
                      indegree[consumer] += 1
                      dependency_edges.append(f'{producer.name}->{consumer.name}:{table}')

              heap = []
              for path in paths:
                  if indegree[path] == 0:
                      heapq.heappush(heap, (created_at[path], path.name, path))
              ordered = []
              while heap:
                  _, _, path = heapq.heappop(heap)
                  ordered.append(path)
                  for consumer in sorted(outgoing[path], key=lambda item: (created_at[item], item.name)):
                      indegree[consumer] -= 1
                      if indegree[consumer] == 0:
                          heapq.heappush(heap, (created_at[consumer], consumer.name, consumer))
              if len(ordered) != len(paths):
                  unresolved = sorted(path.name for path in paths if path not in ordered)
                  report_path.write_text(
                      f'status=CYCLE unresolved={",".join(unresolved)} edges={";".join(dependency_edges)}',
                      encoding='utf-8',
                  )
                  raise SystemExit(2)

              slot = 0
              for path in ordered:
                  while f'{day}{slot:06d}' in used:
                      slot += 1
                  version = f'{day}{slot:06d}'
                  target = path.with_name(f'{version}_{suffix_by_path[path]}')
                  path.rename(target)
                  used.add(version)
                  slot += 1
                  ordered_all.append(target.name)

          report_path.write_text(
              f'status=PASS count={len(ordered_all)} edges={len(dependency_edges)} '
              f'first={ordered_all[0] if ordered_all else "none"} '
              f'last={ordered_all[-1] if ordered_all else "none"}',
              encoding='utf-8',
          )
          print(len(ordered_all))
          PY
            )"
            normalize_code=$?
            order_status="$(cat "$order_report" 2>/dev/null || echo status=FAILED)"
            if [[ "$normalize_code" == "0" ]]; then
              supabase db reset --local --no-seed --debug >> "$db_log" 2>&1
              reset_code=$?
            fi
          fi
          diagnostic="$(python - "$db_log" "$init_code" "$start_code" "$reset_code" "$normalized_count" "$order_status" <<'PY'
          import hashlib
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          raw = path.read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'\x1b\[[0-9;?]*[ -/]*[@-~]', '', raw)
          applying = re.findall(r'Applying migration\s+([^\s]+)', text, flags=re.I)
          candidates = []
          for line in text.splitlines():
              stripped = re.sub(r'\s+', ' ', line.strip())
              if not re.search(
                  r'(ERROR:|FATAL:|SQLSTATE|DETAIL:|HINT:|CONTEXT:|failed to apply|migration failed|syntax error|does not exist|already exists|duplicate|violates|permission denied|effect/sql/SqlError|Failed to execute statement)',
                  stripped,
                  flags=re.I,
              ):
                  continue
              if 'Try rerunning the command with --debug' in stripped:
                  continue
              candidates.append(stripped)
          selected = candidates[-12:]
          error = ' | '.join(selected) if selected else 'none-captured'
          error = re.sub(r'https?://\S+', '<url>', error)
          error = re.sub(r'[0-9a-f]{8}-[0-9a-f-]{27,}', '<uuid>', error, flags=re.I)
          error = re.sub(r"'[^']*'", "'<redacted>'", error)
          error = re.sub(r'\s+', ' ', error)[:2400]
          order_status = re.sub(r'\s+', '_', sys.argv[6])[:600]
          digest = hashlib.sha256(raw.encode('utf-8', errors='replace')).hexdigest()
          print(
              'DB_REPLAY_DIAGNOSTIC '
              f'init={sys.argv[2]} start={sys.argv[3]} reset={sys.argv[4]} '
              f'normalized_legacy={sys.argv[5]} order={order_status} '
              f'last_migration={pathlib.Path(applying[-1]).name if applying else "none"} '
              f'error={error} log_sha256={digest}'
          )
          PY
          )"
          echo "diagnostic=$diagnostic" >> "$GITHUB_OUTPUT"
          supabase stop --no-backup > /dev/null 2>&1 || true
          rm -f "$db_log" "$order_report"
          exit 0

  report:
    needs: diagnose
    runs-on: ubuntu-24.04
    steps:
      - name: Print sanitized replay diagnostic
        shell: bash
        env:
          DIAGNOSTIC: ${{ needs.diagnose.outputs.diagnostic }}
        run: |
          echo "$DIAGNOSTIC"
