name: PR340 synchronized Classroom Lark final

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr340-final-b7ef9890.yml
      - carriers/pr340-final-b7ef9890.txt
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_SHA: b7ef9890d18a97dc501057c51a955a730b62f53e
  BASE_SHA: 542c590e6ce8ebefeb0c5a010e4dc3bfa9f75547
  DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Validate credential
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: private-repo/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact head and owned scope
        working-directory: private-repo
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$PRIVATE_SHA")" == "$BASE_SHA" ]]
          [[ "$(git rev-list --count "$PRIVATE_SHA..$BASE_SHA")" == 0 ]]
          git diff --name-only "$BASE_SHA" "$PRIVATE_SHA" | sort > "$RUNNER_TEMP/pr340-files.txt"
          python - "$RUNNER_TEMP/pr340-files.txt" <<'PY'
          import pathlib,re,sys
          files=[x for x in pathlib.Path(sys.argv[1]).read_text().splitlines() if x]
          expected={
          'docs/architecture/trainingos-classroom-lark-adapter-v1.md','docs/architecture/trainingos-classroom-provider-adapter-contract-v1.md','docs/testing/trainingos-classroom-lark-adapter-validation-v1.md','lib/trainingos-agent-gateway/classroom-lark-adapter.mjs','packages/training-classroom-lark/src/lark-adapter.d.mts','packages/training-classroom-lark/src/lark-adapter.mjs','packages/training-classroom-provider/src/provider-adapter.d.mts','packages/training-classroom-provider/src/provider-adapter.mjs','packages/training-classroom-zoom/src/provider-adapter.d.mts','packages/training-classroom-zoom/src/provider-adapter.mjs','prototypes/trainingos-agent-mvp-v1/classroom-lark-adapter.test.mjs','prototypes/trainingos-agent-mvp-v1/classroom-provider-adapter-contract.test.mjs','scripts/run-trainingos-classroom-lark-adapter-validation.mjs','supabase/migrations/20260728195000_trainingos_classroom_lark_schema_v1.sql','supabase/migrations/20260728195100_trainingos_classroom_lark_rpc_v1.sql','supabase/migrations/20260728195200_trainingos_classroom_lark_projection_v1.sql','supabase/migrations/20260728195300_trainingos_classroom_lark_security_hardening_v1.sql','supabase/migrations/20260728195400_trainingos_database_replay_source_assets_catalog_metadata_v1.sql','tests/sql/trainingos_classroom_lark_adapter_e2e.sql','tests/test_trainingos_classroom_lark_adapter_contract.py'}
          print(f'PR340_SCOPE files={len(files)} expected={len(expected)}')
          raise SystemExit(0 if set(files)==expected else 1)
          PY
      - name: Focused provider contracts
        working-directory: private-repo
        run: |
          set -euo pipefail
          node --check packages/training-classroom-provider/src/provider-adapter.mjs
          node --check packages/training-classroom-zoom/src/provider-adapter.mjs
          node --check packages/training-classroom-lark/src/lark-adapter.mjs
          node --check lib/trainingos-agent-gateway/classroom-zoom-adapter.mjs
          node --check lib/trainingos-agent-gateway/classroom-lark-adapter.mjs
          node --check scripts/run-trainingos-classroom-lark-adapter-validation.mjs
          node scripts/run-trainingos-classroom-lark-adapter-validation.mjs > "$RUNNER_TEMP/pr340-node.log" 2>&1
          grep -q '^# tests 16$' "$RUNNER_TEMP/pr340-node.log"
          grep -q '^# pass 16$' "$RUNNER_TEMP/pr340-node.log"
          grep -q '^# fail 0$' "$RUNNER_TEMP/pr340-node.log"
          python tests/test_trainingos_classroom_lark_adapter_contract.py > "$RUNNER_TEMP/pr340-python.log" 2>&1
          grep -q 'Ran 11 tests' "$RUNNER_TEMP/pr340-python.log"
          grep -q '^OK$' "$RUNNER_TEMP/pr340-python.log"
      - name: Repository gates
        working-directory: private-repo
        run: |
          set -euo pipefail
          npm ci > "$RUNNER_TEMP/pr340-install.log" 2>&1
          npm run typecheck > "$RUNNER_TEMP/pr340-typecheck.log" 2>&1
          npm run build > "$RUNNER_TEMP/pr340-build.log" 2>&1
      - name: Sanitized application result
        run: |
          {
            echo 'exact_private_sha=b7ef9890d18a97dc501057c51a955a730b62f53e'
            echo 'exact_base_sha=542c590e6ce8ebefeb0c5a010e4dc3bfa9f75547'
            echo 'scope=PASS_20_FILES'
            echo 'syntax=PASS_6_6'
            echo 'provider_contracts=PASS_16_16'
            echo 'python=PASS_11_11'
            echo 'typecheck=PASS'
            echo 'build=PASS'
            echo 'raw_private_output=SEALED_AND_DELETED'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup
        if: always()
        run: rm -rf private-repo "$RUNNER_TEMP"/pr340-*

  canonical-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Validate credential
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$PRIVATE_TOKEN" ]]
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Build and start canonical fresh bootstrap
        working-directory: private-repo
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/pr340-bootstrap"
          rm -rf "$workdir" && mkdir -p "$workdir"
          supabase --workdir "$workdir" init --force --yes > "$RUNNER_TEMP/pr340-init.log" 2>&1
          python scripts/build-trainingos-fresh-bootstrap.py --repo-root "$PWD" --output-dir "$workdir/supabase/migrations" --commit-sha "$PRIVATE_SHA" > "$RUNNER_TEMP/pr340-bootstrap.log" 2>&1
          supabase --workdir "$workdir" start > "$RUNNER_TEMP/pr340-start.log" 2>&1
      - name: First Lark SQL E2E and live ACL checks
        working-directory: private-repo
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -1 -v ON_ERROR_STOP=1 -At -f tests/sql/trainingos_classroom_lark_adapter_e2e.sql > "$RUNNER_TEMP/pr340-first.out" 2> "$RUNNER_TEMP/pr340-first.err"
          python - "$RUNNER_TEMP/pr340-first.out" <<'PY'
          import json,pathlib,sys
          lines=pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          d=next(json.loads(x) for x in reversed(lines) if x.strip().startswith('{'))
          assert d.get('status')=='PASS' and d.get('cleanupStatus')=='PASS',d
          assert d.get('zeroResidueCount')==0,d
          assert d.get('studentProjectionRejected') is True,d
          assert d.get('agentConfirmationRejected') is True,d
          assert d.get('transcriptImmutable') is True,d
          assert d.get('attendanceDeterminationPerformed') is False,d
          PY
          acl="$(psql "$DB_URL" -X -Atv ON_ERROR_STOP=1 <<'SQL'
          with e(name) as (values ('trainingos_classroom_lark_bindings'),('trainingos_classroom_lark_recording_events'),('trainingos_classroom_lark_minute_sources'),('trainingos_classroom_lark_transcripts'),('trainingos_classroom_lark_speaker_candidates'),('trainingos_classroom_lark_speaker_confirmations'))
          select jsonb_build_object(
            'forced',(select count(*) from e join pg_class c on c.relname=e.name join pg_namespace n on n.oid=c.relnamespace and n.nspname='public' where c.relrowsecurity and c.relforcerowsecurity),
            'direct',(select count(*) from information_schema.role_table_grants g join e on e.name=g.table_name where g.table_schema='public' and g.grantee in ('PUBLIC','anon','authenticated','service_role')),
            'privateExec',(select count(*) from information_schema.routine_privileges where specific_schema='private' and routine_name like 'trainingos_classroom_lark%' and grantee in ('PUBLIC','anon','authenticated','service_role')),
            'securePublic',(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname like '%trainingos_classroom_lark%' and p.prosecdef and exists(select 1 from unnest(coalesce(p.proconfig,array[]::text[])) x where x='search_path=')));
          SQL
          )"
          python - "$acl" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1]); assert d['forced']==6 and d['direct']==0 and d['privateExec']==0 and d['securePublic']>=1,d
          PY
      - name: Second deterministic replay and E2E
        working-directory: private-repo
        run: |
          set -euo pipefail
          supabase --workdir "$RUNNER_TEMP/pr340-bootstrap" db reset --local --no-seed > "$RUNNER_TEMP/pr340-reset.log" 2>&1
          psql "$DB_URL" -X -1 -v ON_ERROR_STOP=1 -At -f tests/sql/trainingos_classroom_lark_adapter_e2e.sql > "$RUNNER_TEMP/pr340-second.out" 2> "$RUNNER_TEMP/pr340-second.err"
          python - "$RUNNER_TEMP/pr340-second.out" <<'PY'
          import json,pathlib,sys
          d=next(json.loads(x) for x in reversed(pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()) if x.strip().startswith('{'))
          assert d.get('status')=='PASS' and d.get('cleanupStatus')=='PASS' and d.get('zeroResidueCount')==0,d
          PY
      - name: Sanitized database result
        run: |
          {
            echo 'exact_private_sha=b7ef9890d18a97dc501057c51a955a730b62f53e'
            echo 'canonical_bootstrap=PASS'
            echo 'first_lark_e2e=PASS'
            echo 'rls_acl_search_path=PASS'
            echo 'second_replay_lark_e2e=PASS'
            echo 'zero_residue=PASS'
            echo 'raw_private_database_output=SEALED_AND_DELETED'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup
        if: always()
        run: |
          supabase --workdir "$RUNNER_TEMP/pr340-bootstrap" stop --no-backup >/dev/null 2>&1 || true
          rm -rf private-repo "$RUNNER_TEMP"/pr340-*
