name: Recipe Runtime PR325 fresh database replay

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: recipe-pr325-db-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  recipe-db-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRIVATE_SHA: 7f8118afd2e8a5d12154d678cab9fa929a76d079

    steps:
      - name: Validate exact SHA and private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ -n "$PRIVATE_TOKEN" ]] || exit 2

      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Prepare isolated migration replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir replay-project
          cd replay-project
          supabase init
          rm -rf supabase/migrations
          cp -R ../private-repo/supabase/migrations supabase/migrations
          rm -f supabase/seed.sql
          count="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          echo "RECIPE_DB_PREP status=PASS migration_files=$count sha=$PRIVATE_SHA"

      - name: First fresh migration replay
        working-directory: replay-project
        shell: bash
        run: |
          set +e
          supabase db start > "$RUNNER_TEMP/recipe-db-first.log" 2>&1
          code=$?
          applied="$(grep -c 'Applying migration ' "$RUNNER_TEMP/recipe-db-first.log" || true)"
          last="$(grep 'Applying migration ' "$RUNNER_TEMP/recipe-db-first.log" | tail -1 | sed 's/.*Applying migration //' || true)"
          echo "RECIPE_DB_FIRST status=$([[ "$code" == 0 ]] && echo PASS || echo FAIL) applied=$applied last=${last:-none}"
          exit "$code"

      - name: Second deterministic migration replay
        working-directory: replay-project
        shell: bash
        run: |
          set +e
          supabase db reset --local --no-seed > "$RUNNER_TEMP/recipe-db-second.log" 2>&1
          code=$?
          applied="$(grep -c 'Applying migration ' "$RUNNER_TEMP/recipe-db-second.log" || true)"
          last="$(grep 'Applying migration ' "$RUNNER_TEMP/recipe-db-second.log" | tail -1 | sed 's/.*Applying migration //' || true)"
          echo "RECIPE_DB_SECOND status=$([[ "$code" == 0 ]] && echo PASS || echo FAIL) applied=$applied last=${last:-none}"
          exit "$code"

      - name: Verify Recipe objects and direct ACL boundary
        working-directory: replay-project
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep '^DB_URL=')"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 > "$RUNNER_TEMP/recipe-db-acl.log" 2>&1 <<'SQL'
          do $verify$
          declare
            v_tables integer;
            v_forced integer;
            v_authenticated integer;
            v_service integer;
          begin
            select count(*) into v_tables
            from information_schema.tables
            where table_schema='public' and table_name in (
              'trainingos_agent_recipes',
              'trainingos_agent_recipe_versions',
              'trainingos_agent_recipe_events',
              'trainingos_agent_recipe_trigger_receipts'
            );
            select count(*) into v_forced
            from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and c.relname in (
              'trainingos_agent_recipes',
              'trainingos_agent_recipe_versions',
              'trainingos_agent_recipe_events',
              'trainingos_agent_recipe_trigger_receipts'
            ) and c.relrowsecurity and c.relforcerowsecurity;
            select count(*) into v_authenticated
            from information_schema.role_table_grants
            where grantee='authenticated' and table_schema='public' and table_name like 'trainingos_agent_recipe%';
            select count(*) into v_service
            from information_schema.role_table_grants
            where grantee='service_role' and table_schema='public' and table_name like 'trainingos_agent_recipe%';
            if v_tables<>4 or v_forced<>4 or v_authenticated<>0 or v_service<>0 then
              raise exception 'RECIPE_DB_ACL_INVALID';
            end if;
          end;
          $verify$;
SQL
          echo 'RECIPE_DB_OBJECTS status=PASS tables=4 forced_rls=4 authenticated_direct=0 service_role_direct=0'

      - name: Stop isolated database and remove sealed files
        if: always()
        working-directory: replay-project
        shell: bash
        run: |
          supabase stop --no-backup || true
          rm -f "$RUNNER_TEMP/recipe-db-first.log" "$RUNNER_TEMP/recipe-db-second.log" "$RUNNER_TEMP/recipe-db-acl.log"
          rm -rf ../private-repo
