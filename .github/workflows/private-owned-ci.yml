name: Private exact-head focused and owned CI

on:
  workflow_dispatch:
    inputs:
      private_sha:
        description: Exact 40-character commit SHA from the private repository
        required: true
        type: string
      include_playwright:
        description: Include the browser acceptance suite
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: private-focused-owned-${{ inputs.private_sha }}
  cancel-in-progress: false

jobs:
  focused-and-owned-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Validate exact SHA and private read credential
        shell: bash
        env:
          PRIVATE_SHA: ${{ inputs.private_sha }}
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::private_sha must be an exact lowercase 40-character commit SHA"
            exit 2
          fi
          if [[ -z "$PRIVATE_TOKEN" ]]; then
            echo "::error::PRIVATE_REPO_READ_TOKEN is not configured"
            exit 2
          fi

      - name: Check out the exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ inputs.private_sha }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the checked-out exact head
        working-directory: private-repo
        shell: bash
        env:
          PRIVATE_SHA: ${{ inputs.private_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$PRIVATE_SHA" ]]; then
            echo "::error::Checked-out commit does not match the requested exact SHA"
            exit 3
          fi
          printf 'Verified private exact head: `%s`\n' "$actual_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Run W4-3 focused contract with sealed output
        id: focused
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          python -m unittest -v tests/test_trainingos_wave4_deliverable_evidence_contract.py \
            > "$RUNNER_TEMP/private-w43-focused.log" 2>&1
          exit_code=$?
          python - "$RUNNER_TEMP/private-w43-focused.log" "$exit_code" "$GITHUB_OUTPUT" <<'PY'
          import pathlib
          import re
          import sys

          log_path = pathlib.Path(sys.argv[1])
          exit_code = int(sys.argv[2])
          output_path = pathlib.Path(sys.argv[3])
          text = log_path.read_text(encoding="utf-8", errors="replace") if log_path.exists() else ""
          match = re.search(r"Ran\s+(\d+)\s+tests?", text)
          test_count = int(match.group(1)) if match else 0
          ok = exit_code == 0 and test_count == 19 and re.search(r"(?:^|\n)OK(?:\s|\n|$)", text) is not None
          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(f"exit_code={exit_code}\n")
              handle.write(f"test_count={test_count}\n")
              handle.write(f"status={'PASS' if ok else 'FAIL'}\n")
          PY
          exit 0

      - name: Run private ci:owned with sealed output
        id: owned
        working-directory: private-repo
        shell: bash
        env:
          TRAININGOS_CI_INSTALL: always
          TRAININGOS_CI_INCLUDE_PLAYWRIGHT: ${{ inputs.include_playwright && '1' || '0' }}
          TRAININGOS_CI_OUTPUT_DIR: ${{ github.workspace }}/private-repo/.trainingos-ci
        run: |
          set +e
          npm run ci:owned > "$RUNNER_TEMP/private-owned-ci.log" 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish sanitized result
        if: always()
        shell: bash
        env:
          PRIVATE_SHA: ${{ inputs.private_sha }}
          FOCUSED_STATUS: ${{ steps.focused.outputs.status }}
          FOCUSED_TEST_COUNT: ${{ steps.focused.outputs.test_count }}
          FOCUSED_EXIT_CODE: ${{ steps.focused.outputs.exit_code }}
          OWNED_EXIT_CODE: ${{ steps.owned.outputs.exit_code }}
          REPORT_FILE: ${{ github.workspace }}/private-repo/.trainingos-ci/owned-container-ci-report.json
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const requestedSha = process.env.PRIVATE_SHA || 'unknown';
          const focusedStatus = process.env.FOCUSED_STATUS === 'PASS' ? 'PASS' : 'FAIL';
          const focusedTestCount = /^\d+$/.test(process.env.FOCUSED_TEST_COUNT || '')
            ? Number(process.env.FOCUSED_TEST_COUNT)
            : 0;
          const focusedExitCode = /^\d+$/.test(process.env.FOCUSED_EXIT_CODE || '')
            ? Number(process.env.FOCUSED_EXIT_CODE)
            : 1;
          const rawOwnedExitCode = process.env.OWNED_EXIT_CODE;
          const ownedExitCode = /^\d+$/.test(rawOwnedExitCode || '') ? Number(rawOwnedExitCode) : 1;
          let owned = {
            status: ownedExitCode === 0 ? 'PASS' : 'FAIL',
            failedOrLastStep: 'report-unavailable',
            startedAt: null,
            finishedAt: null,
            exitCode: ownedExitCode,
            runtime: null,
          };

          try {
            if (fs.existsSync(process.env.REPORT_FILE)) {
              const source = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, 'utf8'));
              owned = {
                status: source.status === 'PASS' ? 'PASS' : 'FAIL',
                failedOrLastStep: String(source.failedOrLastStep || 'unknown'),
                startedAt: source.startedAt || null,
                finishedAt: source.finishedAt || null,
                exitCode: Number.isInteger(source.exitCode) ? source.exitCode : ownedExitCode,
                runtime: source.runtime && typeof source.runtime === 'object'
                  ? {
                      node: String(source.runtime.node || ''),
                      platform: String(source.runtime.platform || ''),
                      arch: String(source.runtime.arch || ''),
                    }
                  : null,
              };
            }
          } catch {
            owned.status = 'FAIL';
            owned.failedOrLastStep = 'invalid-sanitized-report';
            owned.exitCode = ownedExitCode || 1;
          }

          const summary = [
            '## Private exact-head focused and owned CI',
            '',
            `- Exact SHA: \`${requestedSha}\``,
            `- W4-3 focused contract: **${focusedStatus} ${focusedTestCount}/19**`,
            `- Focused exit code: \`${focusedExitCode}\``,
            `- ci:owned: **${owned.status}**`,
            `- Owned last step: \`${owned.failedOrLastStep}\``,
            `- Owned exit code: \`${owned.exitCode}\``,
            `- Started: \`${owned.startedAt || 'not-reported'}\``,
            `- Finished: \`${owned.finishedAt || 'not-reported'}\``,
          ];
          if (owned.runtime) {
            summary.push(`- Runtime: \`${owned.runtime.node} / ${owned.runtime.platform} / ${owned.runtime.arch}\``);
          }
          summary.push('', 'Raw private test output is intentionally not published or uploaded.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`);
          console.log(
            `PRIVATE_EXACT_CI focused=${focusedStatus}:${focusedTestCount}/19 owned=${owned.status} step=${owned.failedOrLastStep} sha=${requestedSha}`,
          );
          NODE

      - name: Remove private checkout and sealed logs
        if: always()
        shell: bash
        run: |
          rm -rf private-repo \
            "$RUNNER_TEMP/private-w43-focused.log" \
            "$RUNNER_TEMP/private-owned-ci.log"

      - name: Enforce focused and owned CI results
        if: always()
        shell: bash
        env:
          FOCUSED_STATUS: ${{ steps.focused.outputs.status }}
          FOCUSED_TEST_COUNT: ${{ steps.focused.outputs.test_count }}
          OWNED_EXIT_CODE: ${{ steps.owned.outputs.exit_code }}
        run: |
          failed=0
          if [[ "${FOCUSED_STATUS:-FAIL}" != "PASS" || "${FOCUSED_TEST_COUNT:-0}" != "19" ]]; then
            echo "::error::Private exact-head W4-3 focused contract did not pass 19/19. Raw output remained sealed."
            failed=1
          fi
          if [[ "${OWNED_EXIT_CODE:-1}" != "0" ]]; then
            echo "::error::Private exact-head ci:owned failed. Raw output remained sealed in the ephemeral runner."
            failed=1
          fi
          exit "$failed"
