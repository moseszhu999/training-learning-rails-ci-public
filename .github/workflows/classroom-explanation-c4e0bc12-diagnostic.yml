name: Classroom Explanation c4e0bc12 diagnostics

on:
  push:
    branches:
      - ci/classroom-explanation-aa2d65c9
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRIVATE_SHA: c4e0bc12de1148839ca648aaed8c862ac58b2162
      EXPECTED_BASE_SHA: 604631a96f01fb76d123072168c165cc699d9e8e
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: private-repo/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect sanitized diagnostics
        id: diagnostic
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          actual_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          merge_base="$(git merge-base "$EXPECTED_BASE_SHA" "$PRIVATE_SHA" 2>/dev/null || true)"
          file_count="$(git diff --name-only "$EXPECTED_BASE_SHA" "$PRIVATE_SHA" | sed '/^$/d' | wc -l | tr -d ' ')"
          migration_count="$(git diff --name-only "$EXPECTED_BASE_SHA" "$PRIVATE_SHA" | grep -Ec '^supabase/migrations/2026072816[0-5][0-9]{3}_trainingos_classroom_explanation_' || true)"
          scope_status=FAIL
          [[ "$actual_sha" == "$PRIVATE_SHA" && "$merge_base" == "$EXPECTED_BASE_SHA" && "$file_count" == "22" && "$migration_count" == "15" ]] && scope_status=PASS

          node --test prototypes/trainingos-agent-mvp-v1/test/classroom-explanation-runtime.test.mjs > "$RUNNER_TEMP/explanation-node.log" 2>&1
          node_code=$?
          node_tests="$(grep -E '^# tests ' "$RUNNER_TEMP/explanation-node.log" | tail -1 | awk '{print $3}')"
          node_pass="$(grep -E '^# pass ' "$RUNNER_TEMP/explanation-node.log" | tail -1 | awk '{print $3}')"
          node_fail="$(grep -E '^# fail ' "$RUNNER_TEMP/explanation-node.log" | tail -1 | awk '{print $3}')"
          node_status=FAIL
          [[ "$node_code" == "0" && "$node_fail" == "0" ]] && node_status=PASS

          python -m unittest -v tests.test_trainingos_classroom_explanation_contract > "$RUNNER_TEMP/explanation-python.log" 2>&1
          python_code=$?
          python_tests="$(grep -E '^Ran [0-9]+ tests?' "$RUNNER_TEMP/explanation-python.log" | tail -1 | awk '{print $2}')"
          python_status=FAIL
          [[ "$python_code" == "0" && "$python_tests" == "14" ]] && python_status=PASS

          npm ci > "$RUNNER_TEMP/explanation-install.log" 2>&1
          install_code=$?
          install_status=FAIL
          [[ "$install_code" == "0" ]] && install_status=PASS

          intelligence_status=NOT_RUN
          if [[ "$install_status" == "PASS" ]]; then
            npm --prefix packages/training-classroom-intelligence test > "$RUNNER_TEMP/explanation-intelligence.log" 2>&1
            intelligence_code=$?
            intelligence_status=FAIL
            [[ "$intelligence_code" == "0" ]] && intelligence_status=PASS
          fi

          {
            echo "scope_status=$scope_status"
            echo "actual_sha=$actual_sha"
            echo "merge_base=$merge_base"
            echo "file_count=$file_count"
            echo "migration_count=$migration_count"
            echo "node_status=$node_status"
            echo "node_code=$node_code"
            echo "node_tests=${node_tests:-0}"
            echo "node_pass=${node_pass:-0}"
            echo "node_fail=${node_fail:--1}"
            echo "python_status=$python_status"
            echo "python_code=$python_code"
            echo "python_tests=${python_tests:-0}"
            echo "install_status=$install_status"
            echo "intelligence_status=$intelligence_status"
          } >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP"/explanation-*.log
          exit 0

      - name: Publish sanitized diagnostic comment
        uses: actions/github-script@v7
        env:
          SCOPE_STATUS: ${{ steps.diagnostic.outputs.scope_status }}
          ACTUAL_SHA: ${{ steps.diagnostic.outputs.actual_sha }}
          MERGE_BASE: ${{ steps.diagnostic.outputs.merge_base }}
          FILE_COUNT: ${{ steps.diagnostic.outputs.file_count }}
          MIGRATION_COUNT: ${{ steps.diagnostic.outputs.migration_count }}
          NODE_STATUS: ${{ steps.diagnostic.outputs.node_status }}
          NODE_CODE: ${{ steps.diagnostic.outputs.node_code }}
          NODE_TESTS: ${{ steps.diagnostic.outputs.node_tests }}
          NODE_PASS: ${{ steps.diagnostic.outputs.node_pass }}
          NODE_FAIL: ${{ steps.diagnostic.outputs.node_fail }}
          PYTHON_STATUS: ${{ steps.diagnostic.outputs.python_status }}
          PYTHON_CODE: ${{ steps.diagnostic.outputs.python_code }}
          PYTHON_TESTS: ${{ steps.diagnostic.outputs.python_tests }}
          INSTALL_STATUS: ${{ steps.diagnostic.outputs.install_status }}
          INTELLIGENCE_STATUS: ${{ steps.diagnostic.outputs.intelligence_status }}
        with:
          script: |
            const marker = '<!-- classroom-explanation-c4e0-diagnostic -->';
            const body = `${marker}\n## Classroom Explanation exact-head diagnostics\n\n` +
              `- Exact private SHA: \`${process.env.ACTUAL_SHA}\`\n` +
              `- Merge base: \`${process.env.MERGE_BASE}\`\n` +
              `- Scope: **${process.env.SCOPE_STATUS}** (${process.env.FILE_COUNT} files / ${process.env.MIGRATION_COUNT} migrations)\n` +
              `- Node contracts: **${process.env.NODE_STATUS}** (exit ${process.env.NODE_CODE}; ${process.env.NODE_PASS}/${process.env.NODE_TESTS}; fail ${process.env.NODE_FAIL})\n` +
              `- Python contracts: **${process.env.PYTHON_STATUS}** (exit ${process.env.PYTHON_CODE}; ${process.env.PYTHON_TESTS} tests)\n` +
              `- Dependency install: **${process.env.INSTALL_STATUS}**\n` +
              `- Classroom Intelligence package: **${process.env.INTELLIGENCE_STATUS}**\n\n` +
              `Raw private output remains sealed and was deleted.`;
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 38 });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 38, body });
            }
