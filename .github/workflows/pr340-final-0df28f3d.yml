name: PR340 corrected synchronized Classroom Lark final

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr340-final-0df28f3d.yml
      - carriers/pr340-final-0df28f3d.txt
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_SHA: 0df28f3d4056cc8aa2b65baa30981713a02f5b6a
  BASE_SHA: 542c590e6ce8ebefeb0c5a010e4dc3bfa9f75547
  DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Validate exact inputs and credential
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]
      - name: Checkout exact private candidate
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: private-repo/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact head ancestry and 20-file scope
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$PRIVATE_SHA")" == "$BASE_SHA" ]]
          [[ "$(git rev-list --count "$PRIVATE_SHA..$BASE_SHA")" == 0 ]]
          git diff --name-only "$BASE_SHA" "$PRIVATE_SHA" | sort > "$RUNNER_TEMP/pr340-files.txt"
          python - "$RUNNER_TEMP/pr340-files.txt" <<'PY'
          import pathlib,sys
          actual=set(pathlib.Path(sys.argv[1]).read_text().splitlines())
          expected={
            'docs/architecture/trainingos-classroom-lark-adapter-v1.md',
            'docs/architecture/trainingos-classroom-provider-adapter-contract-v1.md',
            'docs/testing/trainingos-classroom-lark-adapter-validation-v1.md',
            'lib/trainingos-agent-gateway/classroom-lark-adapter.mjs',
            'packages/training-classroom-lark/src/lark-adapter.d.mts',
            'packages/training-classroom-lark/src/lark-adapter.mjs',
            'packages/training-classroom-provider/src/provider-adapter.d.mts',
            'packages/training-classroom-provider/src/provider-adapter.mjs',
            'packages/training-classroom-zoom/src/provider-adapter.d.mts',
            'packages/training-classroom-zoom/src/provider-adapter.mjs',
            'prototypes/trainingos-agent-mvp-v1/classroom-lark-adapter.test.mjs',
            'prototypes/trainingos-agent-mvp-v1/classroom-provider-adapter-contract.test.mjs',
            'scripts/run-trainingos-classroom-lark-adapter-validation.mjs',
            'supabase/migrations/20260728195000_trainingos_classroom_lark_schema_v1.sql',
            'supabase/migrations/20260728195100_trainingos_classroom_lark_rpc_v1.sql',
            'supabase/migrations/20260728195200_trainingos_classroom_lark_projection_v1.sql',
            'supabase/migrations/20260728195300_trainingos_classroom_lark_security_hardening_v1.sql',
            'supabase/migrations/20260728195400_trainingos_database_replay_source_assets_catalog_metadata_v1.sql',
            'tests/sql/trainingos_classroom_lark_adapter_e2e.sql',
            'tests/test_trainingos_classroom_lark_adapter_contract.py',
          }
          print(f'PR340_SCOPE actual={len(actual)} expected={len(expected)}')
          raise SystemExit(0 if actual==expected else 1)
          PY
      - name: Run syntax and focused provider contracts
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/training-classroom-provider/src/provider-adapter.mjs
          node --check packages/training-classroom-zoom/src/provider-adapter.mjs
          node --check packages/training-classroom-lark/src/lark-adapter.mjs
          node --check lib/trainingos-agent-gateway/classroom-zoom-adapter.mjs
          node --check lib/trainingos-agent-gateway/classroom-lark-adapter.mjs
          node --check scripts/run-trainingos-classroom-lark-adapter-validation.mjs
          node scripts/run-trainingos-classroom-lark-adapter-validation.mjs > "$RUNNER_TEMP/pr340-node.log" 2>&1
          python - "$RUNNER_TEMP/pr340-node.log" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          values=[]
          for pattern,default in ((r'# tests\s+(\d+)',0),(r'# pass\s+(\d+)',0),(r'# fail\s+(\d+)',-1)):
              match=re.search(pattern,text)
              values.append(int(match.group(1)) if match else default)
          assert tuple(values)==(16,16,0),values
          PY
          python -m unittest -v tests.test_trainingos_classroom_lark_adapter_contract > "$RUNNER_TEMP/pr340-python.log" 2>&1
          python - "$RUNNER_TEMP/pr340-python.log" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          ran=re.search(r'Ran\s+(\d+)\s+tests?',text)
          assert ran and int(ran.group(1))==11,text[-600:]
          assert re.search(r'(?:^|\n)OK(?:\s|\n|$)',text),text[-600:]
          PY
      - name: Run repository typecheck and production build
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          npm ci > "$RUNNER_TEMP/pr340-install.log" 2>&1
          npm run typecheck > "$RUNNER_TEMP/pr340-typecheck.log" 2>&1
          npm run build > "$RUNNER_TEMP/pr340-build.log" 2>&1
      - name: Publish sanitized application result
        shell: bash
        run: |
          {
            echo 'exact_private_sha=0df28f3d4056cc8aa2b65baa30981713a02f5b6a'
            echo 'exact_base_sha=542c590e6ce8ebefeb0c5a010e4dc3bfa9f75547'
            echo 'scope=PASS_20_FILES'
            echo 'syntax=PASS_6_6'
            echo 'provider_contracts=PASS_16_16'
            echo 'python_contracts=PASS_11_11'
            echo 'install=PASS'
            echo 'typecheck=PASS'
            echo 'build=PASS'
            echo 'raw_private_output=SEALED_AND_DELETED'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup
        if: always()
        run: rm -rf private-repo "$RUNNER_TEMP"/pr340-*

  canonical-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Validate exact inputs and credential
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]
      - name: Checkout exact private candidate
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Verify exact head and current-main ancestry
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]]
          [[ "$(git merge-base "$BASE_SHA" "$PRIVATE_SHA")" == "$BASE_SHA" ]]
          [[ "$(git rev-list --count "$PRIVATE_SHA..$BASE_SHA")" == 0 ]]
      - name: Build and start canonical fresh bootstrap
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/pr340-final-db"
          rm -rf "$workdir" && mkdir -p "$workdir"
          supabase --workdir "$workdir" init --force --yes > "$RUNNER_TEMP/pr340-db-init.log" 2>&1
          python scripts/build-trainingos-fresh-bootstrap.py \
            --repo-root "$PWD" \
            --output-dir "$workdir/supabase/migrations" \
            --commit-sha "$PRIVATE_SHA" > "$RUNNER_TEMP/pr340-db-bootstrap.log" 2>&1
          test -n "$(find "$workdir/supabase/migrations" -type f -name '*.sql' -print -quit)"
          supabase --workdir "$workdir" start > "$RUNNER_TEMP/pr340-db-start.log" 2>&1
      - name: Run first Lark SQL E2E
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -1 -v ON_ERROR_STOP=1 -At \
            -f tests/sql/trainingos_classroom_lark_adapter_e2e.sql \
            > "$RUNNER_TEMP/pr340-db-first.out" 2> "$RUNNER_TEMP/pr340-db-first.err"
          python - "$RUNNER_TEMP/pr340-db-first.out" <<'PY'
          import json,pathlib,sys
          payload=next(json.loads(line) for line in reversed(pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()) if line.strip().startswith('{'))
          expected={
            'status':'PASS','cleanupStatus':'PASS','zeroResidueCount':0,
            'exactRecordingStatusEvents':True,'completedRecordingTokenBinding':True,
            'minuteTokenExposed':False,'transcriptImmutable':True,
            'speakerCandidatesOnly':True,'studentProjectionRejected':True,
            'agentConfirmationRejected':True,'attendanceDeterminationPerformed':False,
          }
          for key,value in expected.items(): assert payload.get(key)==value,(key,payload.get(key),value,payload)
          PY
      - name: Verify live security and immutability catalog
        shell: bash
        run: |
          set -euo pipefail
          catalog="$(psql "$DB_URL" -X -Atv ON_ERROR_STOP=1 <<'SQL'
          with expected_tables(name) as (
            values
              ('trainingos_classroom_lark_meeting_bindings'),
              ('trainingos_classroom_lark_recording_events'),
              ('trainingos_classroom_lark_minute_sources'),
              ('trainingos_classroom_lark_transcripts'),
              ('trainingos_classroom_lark_speaker_candidates'),
              ('trainingos_classroom_lark_speaker_confirmations'),
              ('trainingos_classroom_lark_audit_events')
          ), expected_triggers(name) as (
            values
              ('trainingos_lark_binding_immutable'),
              ('trainingos_lark_recording_event_immutable'),
              ('trainingos_lark_minute_source_immutable'),
              ('trainingos_lark_transcript_immutable'),
              ('trainingos_lark_candidate_immutable'),
              ('trainingos_lark_confirmation_immutable'),
              ('trainingos_lark_audit_immutable')
          )
          select jsonb_build_object(
            'tables',(select count(*) from expected_tables e join pg_class c on c.relname=e.name join pg_namespace n on n.oid=c.relnamespace and n.nspname='public'),
            'forced',(select count(*) from expected_tables e join pg_class c on c.relname=e.name join pg_namespace n on n.oid=c.relnamespace and n.nspname='public' where c.relrowsecurity and c.relforcerowsecurity),
            'directGrants',(select count(*) from information_schema.role_table_grants g join expected_tables e on e.name=g.table_name where g.table_schema='public' and g.grantee in ('PUBLIC','anon','authenticated','service_role')),
            'privateExec',(select count(*) from information_schema.routine_privileges r where r.specific_schema='private' and r.routine_name like 'trainingos_lark%' and r.grantee in ('PUBLIC','anon','authenticated','service_role') and r.privilege_type='EXECUTE'),
            'publicFunctions',(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname like '%trainingos_lark%'),
            'securePublic',(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname like '%trainingos_lark%' and p.prosecdef and exists(select 1 from unnest(coalesce(p.proconfig,array[]::text[])) setting where setting='search_path=')),
            'immutableTriggers',(select count(*) from expected_triggers e join pg_trigger t on t.tgname=e.name where not t.tgisinternal)
          );
          SQL
          )"
          python - "$catalog" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          assert d['tables']==7,d
          assert d['forced']==7,d
          assert d['directGrants']==0,d
          assert d['privateExec']==0,d
          assert d['publicFunctions']>=1,d
          assert d['securePublic']==d['publicFunctions'],d
          assert d['immutableTriggers']==7,d
          PY
      - name: Run second deterministic replay and E2E
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          supabase --workdir "$RUNNER_TEMP/pr340-final-db" db reset --local --no-seed > "$RUNNER_TEMP/pr340-db-reset.log" 2>&1
          psql "$DB_URL" -X -1 -v ON_ERROR_STOP=1 -At \
            -f tests/sql/trainingos_classroom_lark_adapter_e2e.sql \
            > "$RUNNER_TEMP/pr340-db-second.out" 2> "$RUNNER_TEMP/pr340-db-second.err"
          python - "$RUNNER_TEMP/pr340-db-second.out" <<'PY'
          import json,pathlib,sys
          payload=next(json.loads(line) for line in reversed(pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()) if line.strip().startswith('{'))
          assert payload.get('status')=='PASS',payload
          assert payload.get('cleanupStatus')=='PASS',payload
          assert payload.get('zeroResidueCount')==0,payload
          assert payload.get('transcriptImmutable') is True,payload
          assert payload.get('studentProjectionRejected') is True,payload
          assert payload.get('agentConfirmationRejected') is True,payload
          assert payload.get('attendanceDeterminationPerformed') is False,payload
          PY
      - name: Publish sanitized database result
        shell: bash
        run: |
          {
            echo 'exact_private_sha=0df28f3d4056cc8aa2b65baa30981713a02f5b6a'
            echo 'exact_base_sha=542c590e6ce8ebefeb0c5a010e4dc3bfa9f75547'
            echo 'canonical_bootstrap=PASS'
            echo 'first_lark_e2e=PASS'
            echo 'force_rls=PASS_7_7'
            echo 'direct_raw_grants=PASS_0'
            echo 'private_helper_execute=PASS_0'
            echo 'public_fixed_search_path=PASS'
            echo 'immutable_triggers=PASS_7_7'
            echo 'second_replay_lark_e2e=PASS'
            echo 'zero_residue=PASS'
            echo 'raw_private_database_output=SEALED_AND_DELETED'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          supabase --workdir "$RUNNER_TEMP/pr340-final-db" stop --no-backup >/dev/null 2>&1 || true
          rm -rf private-repo "$RUNNER_TEMP"/pr340-db-*
