name: PR342 Classroom Explanation final database

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr342-classroom-explanation-final-app.yml
      - .github/workflows/pr342-classroom-explanation-final-db.yml
      - carriers/pr342-final-7c575a2e.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr342-final-db-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PRIVATE_SHA: 7c575a2e42e76d564e4ba15dfe8f682da8dee366
  BASE_SHA: a2875b971b513f667caa67272eb4271485d2858c
  DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

jobs:
  isolated-database-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Validate exact inputs and credential
        id: credential
        continue-on-error: true
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]

      - name: Check out exact private candidate
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - name: Set up Python
        id: python_setup
        if: always()
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Supabase CLI
        id: supabase_setup
        if: always()
        continue-on-error: true
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Run sealed two-pass database acceptance
        id: database
        if: always()
        continue-on-error: true
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          start_code=1
          first_e2e_code=1
          catalog_code=1
          reset_code=1
          second_e2e_code=1
          first_valid=false
          first_zero=false
          first_status=MISSING
          first_remaining=0
          catalog_valid=false
          second_valid=false
          second_zero=false
          second_status=MISSING
          second_remaining=0

          validate_evidence() {
            local input="$1"
            local prefix="$2"
            python - "$input" "$GITHUB_OUTPUT" "$prefix" <<'PY'
          import json, pathlib, sys
          path=pathlib.Path(sys.argv[1])
          prefix=sys.argv[3]
          lines=path.read_text(encoding='utf-8',errors='replace').splitlines() if path.exists() else []
          payload=next((json.loads(line) for line in reversed(lines) if line.strip().startswith('{')),None)
          required=(
            'oneActiveExplanationEnforced','activeSlotReleasedAfterUpload','secondExplanationStarted',
            'classEndedStartRejected','agentRecordingRejected','agentInferencePersisted',
            'prohibitedCandidateRejected','teacherEvaluationConfirmed','agentConfirmRejected',
            'staleVersionRejected','staleTranscriptRejected','crossClassRejected',
            'transcriptUpdateRejected','transcriptDeleteRejected','rawAudioHidden',
            'idempotencyConflictRejected','transcriptIdempotencyConflictRejected')
          remaining={k:v for k,v in (payload or {}).items() if k.startswith('remaining')}
          zero=bool(remaining) and all(v==0 for v in remaining.values())
          valid=(bool(payload) and payload.get('status')=='PASS'
                 and payload.get('fixtureCleanup')=='PLPGSQL_SUBTRANSACTION_ROLLBACK'
                 and all(payload.get(k) is True for k in required)
                 and len(remaining)>=13 and zero)
          with open(sys.argv[2],'a',encoding='utf-8') as out:
            out.write(f"{prefix}_status={(payload or {}).get('status','MISSING')}\n")
            out.write(f"{prefix}_valid={str(valid).lower()}\n")
            out.write(f"{prefix}_zero={str(zero).lower()}\n")
            out.write(f"{prefix}_remaining={len(remaining)}\n")
          raise SystemExit(0 if valid else 1)
          PY
          }

          if [[ "$(git rev-parse HEAD 2>/dev/null)" == "$PRIVATE_SHA" \
             && "$(git merge-base "$BASE_SHA" "$PRIVATE_SHA" 2>/dev/null)" == "$BASE_SHA" \
             && "$(git rev-list --count "$PRIVATE_SHA..$BASE_SHA" 2>/dev/null)" == 0 ]]; then
            supabase start > "$RUNNER_TEMP/pr342-db-start.log" 2>&1
            start_code=$?
          fi

          if [[ "$start_code" == 0 ]]; then
            psql "$DB_URL" -X -1 -v ON_ERROR_STOP=1 -At \
              -f tests/sql/trainingos_classroom_explanation_e2e.sql \
              > "$RUNNER_TEMP/pr342-first-e2e.out" 2> "$RUNNER_TEMP/pr342-first-e2e.err"
            first_e2e_code=$?
            if [[ "$first_e2e_code" == 0 ]]; then
              validate_evidence "$RUNNER_TEMP/pr342-first-e2e.out" first
              first_e2e_code=$?
            fi
          fi

          if [[ "$first_e2e_code" == 0 ]]; then
            catalog_json="$(psql "$DB_URL" -X -Atv ON_ERROR_STOP=1 <<'SQL'
          with expected_tables(name) as (
            values
              ('trainingos_classroom_explanations'),
              ('trainingos_classroom_explanation_captures'),
              ('trainingos_classroom_explanation_transcript_imports'),
              ('trainingos_classroom_explanation_speech_turns'),
              ('trainingos_classroom_explanation_analysis_candidates'),
              ('trainingos_classroom_explanation_evaluations'),
              ('trainingos_classroom_explanation_events')
          ), table_security as (
            select count(*) filter (where c.relrowsecurity and c.relforcerowsecurity) secure_count
            from expected_tables e
            join pg_class c on c.relname=e.name
            join pg_namespace n on n.oid=c.relnamespace and n.nspname='public'
          ), raw_grants as (
            select count(*) grant_count
            from information_schema.role_table_grants g
            join expected_tables e on e.name=g.table_name
            where g.table_schema='public'
              and g.grantee in ('PUBLIC','anon','authenticated',('service'||'_role'))
          ), private_grants as (
            select count(*) grant_count
            from information_schema.routine_privileges r
            where r.specific_schema='private'
              and r.routine_name like 'trainingos_classroom_explanation%'
              and r.grantee in ('PUBLIC','anon','authenticated',('service'||'_role'))
          ), public_functions as (
            select count(*) function_count,
              count(*) filter (
                where p.prosecdef
                  and exists(select 1 from unnest(coalesce(p.proconfig,array[]::text[])) setting where setting='search_path=')
              ) secure_count
            from pg_proc p
            join pg_namespace n on n.oid=p.pronamespace
            where n.nspname='public'
              and p.proname in (
                'prepare_trainingos_classroom_explanation',
                'start_trainingos_classroom_explanation',
                'create_trainingos_classroom_explanation_capture',
                'complete_trainingos_classroom_explanation_capture_upload',
                'append_trainingos_classroom_explanation_transcript',
                'get_trainingos_classroom_explanation_analysis_input',
                'propose_trainingos_classroom_explanation_analysis',
                'confirm_trainingos_classroom_explanation_evaluation',
                'get_trainingos_classroom_explanation')
          ), bad_function_grants as (
            select count(*) grant_count
            from information_schema.routine_privileges r
            where r.specific_schema='public'
              and r.routine_name in (
                'prepare_trainingos_classroom_explanation',
                'start_trainingos_classroom_explanation',
                'create_trainingos_classroom_explanation_capture',
                'complete_trainingos_classroom_explanation_capture_upload',
                'append_trainingos_classroom_explanation_transcript',
                'get_trainingos_classroom_explanation_analysis_input',
                'propose_trainingos_classroom_explanation_analysis',
                'confirm_trainingos_classroom_explanation_evaluation',
                'get_trainingos_classroom_explanation')
              and r.grantee in ('PUBLIC','anon',('service'||'_role'))
          ), active_index as (
            select count(*) index_count
            from pg_indexes
            where schemaname='public'
              and indexname='trainingos_classroom_explanation_one_active_per_control_idx'
              and indexdef ilike '%started%'
              and indexdef ilike '%capture_open%'
          ), immutable_triggers as (
            select count(*) trigger_count
            from pg_trigger t
            join pg_class c on c.oid=t.tgrelid
            join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and not t.tgisinternal
              and t.tgname in (
                'trainingos_classroom_explanation_transcript_immutable',
                'trainingos_classroom_explanation_turn_immutable',
                'trainingos_classroom_explanation_candidate_immutable',
                'trainingos_classroom_explanation_evaluation_immutable',
                'trainingos_classroom_explanation_event_immutable')
          )
          select jsonb_build_object(
            'rlsForcedCount',(select secure_count from table_security),
            'rawGrantCount',(select grant_count from raw_grants),
            'privateHelperGrantCount',(select grant_count from private_grants),
            'publicFunctionCount',(select function_count from public_functions),
            'publicFunctionSecureCount',(select secure_count from public_functions),
            'publicBadGrantCount',(select grant_count from bad_function_grants),
            'activeIndexCount',(select index_count from active_index),
            'appendOnlyTriggerCount',(select trigger_count from immutable_triggers));
          SQL
            )"
            catalog_code=$?
            if [[ "$catalog_code" == 0 ]]; then
              python - "$catalog_json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          value=json.loads(sys.argv[1])
          valid=(value.get('rlsForcedCount')==7
                 and value.get('rawGrantCount')==0
                 and value.get('privateHelperGrantCount')==0
                 and value.get('publicFunctionCount')==9
                 and value.get('publicFunctionSecureCount')==9
                 and value.get('publicBadGrantCount')==0
                 and value.get('activeIndexCount')==1
                 and value.get('appendOnlyTriggerCount')==5)
          with open(sys.argv[2],'a',encoding='utf-8') as out:
            for key,val in value.items(): out.write(f'{key}={val}\n')
            out.write(f'catalog_valid={str(valid).lower()}\n')
          raise SystemExit(0 if valid else 1)
          PY
              catalog_code=$?
            fi
          fi

          if [[ "$catalog_code" == 0 ]]; then
            supabase db reset --local --no-seed > "$RUNNER_TEMP/pr342-db-reset.log" 2>&1
            reset_code=$?
          fi

          if [[ "$reset_code" == 0 ]]; then
            psql "$DB_URL" -X -1 -v ON_ERROR_STOP=1 -At \
              -f tests/sql/trainingos_classroom_explanation_e2e.sql \
              > "$RUNNER_TEMP/pr342-second-e2e.out" 2> "$RUNNER_TEMP/pr342-second-e2e.err"
            second_e2e_code=$?
            if [[ "$second_e2e_code" == 0 ]]; then
              validate_evidence "$RUNNER_TEMP/pr342-second-e2e.out" second
              second_e2e_code=$?
            fi
          fi

          {
            echo "start_code=$start_code"
            echo "first_e2e_code=$first_e2e_code"
            echo "catalog_code=$catalog_code"
            echo "reset_code=$reset_code"
            echo "second_e2e_code=$second_e2e_code"
          } >> "$GITHUB_OUTPUT"

          if [[ "$start_code" == 0 && "$first_e2e_code" == 0 && "$catalog_code" == 0 \
             && "$reset_code" == 0 && "$second_e2e_code" == 0 ]]; then
            exit 0
          fi
          exit 1

      - name: Publish sanitized database evidence
        if: always()
        env:
          DATABASE: ${{ steps.database.outcome }}
          START_CODE: ${{ steps.database.outputs.start_code }}
          FIRST_E2E_CODE: ${{ steps.database.outputs.first_e2e_code }}
          FIRST_STATUS: ${{ steps.database.outputs.first_status }}
          FIRST_VALID: ${{ steps.database.outputs.first_valid }}
          FIRST_ZERO: ${{ steps.database.outputs.first_zero }}
          FIRST_REMAINING: ${{ steps.database.outputs.first_remaining }}
          CATALOG_CODE: ${{ steps.database.outputs.catalog_code }}
          CATALOG_VALID: ${{ steps.database.outputs.catalog_valid }}
          RLS_COUNT: ${{ steps.database.outputs.rlsForcedCount }}
          RAW_GRANTS: ${{ steps.database.outputs.rawGrantCount }}
          PRIVATE_GRANTS: ${{ steps.database.outputs.privateHelperGrantCount }}
          PUBLIC_FUNCTIONS: ${{ steps.database.outputs.publicFunctionCount }}
          PUBLIC_SECURE: ${{ steps.database.outputs.publicFunctionSecureCount }}
          PUBLIC_BAD_GRANTS: ${{ steps.database.outputs.publicBadGrantCount }}
          ACTIVE_INDEX: ${{ steps.database.outputs.activeIndexCount }}
          APPEND_TRIGGERS: ${{ steps.database.outputs.appendOnlyTriggerCount }}
          RESET_CODE: ${{ steps.database.outputs.reset_code }}
          SECOND_E2E_CODE: ${{ steps.database.outputs.second_e2e_code }}
          SECOND_STATUS: ${{ steps.database.outputs.second_status }}
          SECOND_VALID: ${{ steps.database.outputs.second_valid }}
          SECOND_ZERO: ${{ steps.database.outputs.second_zero }}
          SECOND_REMAINING: ${{ steps.database.outputs.second_remaining }}
        shell: bash
        run: |
          report=pr342-final-database-result.txt
          {
            echo "exact_private_sha=$PRIVATE_SHA"
            echo "exact_base_sha=$BASE_SHA"
            echo "database_stage=${DATABASE:-missing}"
            echo "first_full_replay_exit=${START_CODE:-missing}"
            echo "first_sql_e2e_exit=${FIRST_E2E_CODE:-missing}"
            echo "first_status=${FIRST_STATUS:-MISSING}"
            echo "first_acceptance_valid=${FIRST_VALID:-false}"
            echo "first_remaining_count=${FIRST_REMAINING:-0}"
            echo "first_remaining_zero=${FIRST_ZERO:-false}"
            echo "catalog_exit=${CATALOG_CODE:-missing}"
            echo "catalog_valid=${CATALOG_VALID:-false}"
            echo "rls_forced_count=${RLS_COUNT:-0}"
            echo "raw_grant_count=${RAW_GRANTS:-missing}"
            echo "private_helper_grant_count=${PRIVATE_GRANTS:-missing}"
            echo "public_function_count=${PUBLIC_FUNCTIONS:-0}"
            echo "public_function_secure_count=${PUBLIC_SECURE:-0}"
            echo "public_bad_grant_count=${PUBLIC_BAD_GRANTS:-missing}"
            echo "active_index_count=${ACTIVE_INDEX:-0}"
            echo "append_only_trigger_count=${APPEND_TRIGGERS:-0}"
            echo "second_full_replay_exit=${RESET_CODE:-missing}"
            echo "second_sql_e2e_exit=${SECOND_E2E_CODE:-missing}"
            echo "second_status=${SECOND_STATUS:-MISSING}"
            echo "second_acceptance_valid=${SECOND_VALID:-false}"
            echo "second_remaining_count=${SECOND_REMAINING:-0}"
            echo "second_remaining_zero=${SECOND_ZERO:-false}"
            echo 'raw_database_logs_private_source_and_fixture_output=SEALED_AND_DELETED'
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          cat "$report"

      - name: Upload sanitized database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr342-final-7c575a2e-database-result
          path: pr342-final-database-result.txt
          retention-days: 3

      - name: Cleanup isolated database and sealed output
        if: always()
        shell: bash
        run: |
          (cd private-repo && supabase stop --no-backup >/dev/null 2>&1) || true
          rm -rf private-repo "$RUNNER_TEMP"/pr342-* pr342-final-database-result.txt

      - name: Final database enforcement
        if: always()
        env:
          CREDENTIAL: ${{ steps.credential.outcome }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          PYTHON_SETUP: ${{ steps.python_setup.outcome }}
          SUPABASE_SETUP: ${{ steps.supabase_setup.outcome }}
          DATABASE: ${{ steps.database.outcome }}
          START_CODE: ${{ steps.database.outputs.start_code }}
          FIRST_E2E_CODE: ${{ steps.database.outputs.first_e2e_code }}
          FIRST_VALID: ${{ steps.database.outputs.first_valid }}
          FIRST_ZERO: ${{ steps.database.outputs.first_zero }}
          CATALOG_CODE: ${{ steps.database.outputs.catalog_code }}
          CATALOG_VALID: ${{ steps.database.outputs.catalog_valid }}
          RESET_CODE: ${{ steps.database.outputs.reset_code }}
          SECOND_E2E_CODE: ${{ steps.database.outputs.second_e2e_code }}
          SECOND_VALID: ${{ steps.database.outputs.second_valid }}
          SECOND_ZERO: ${{ steps.database.outputs.second_zero }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CREDENTIAL" == success && "$CHECKOUT" == success ]]
          [[ "$PYTHON_SETUP" == success && "$SUPABASE_SETUP" == success ]]
          [[ "$DATABASE" == success ]]
          [[ "$START_CODE" == 0 ]]
          [[ "$FIRST_E2E_CODE" == 0 && "$FIRST_VALID" == true && "$FIRST_ZERO" == true ]]
          [[ "$CATALOG_CODE" == 0 && "$CATALOG_VALID" == true ]]
          [[ "$RESET_CODE" == 0 ]]
          [[ "$SECOND_E2E_CODE" == 0 && "$SECOND_VALID" == true && "$SECOND_ZERO" == true ]]
