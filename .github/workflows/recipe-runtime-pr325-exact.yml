name: Recipe Runtime PR325 exact-head CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: recipe-runtime-pr325-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PRIVATE_SHA: 7f8118afd2e8a5d12154d678cab9fa929a76d079

jobs:
  focused-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate exact SHA and private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ -n "$PRIVATE_TOKEN" ]] || exit 2

      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact private head
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]] || exit 3
          printf 'Verified private exact head: `%s`\n' "$PRIVATE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce focused Recipe Python 12 of 12
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          python -m unittest -v tests/test_trainingos_agent_recipe_contract.py \
            > "$RUNNER_TEMP/recipe-python.log" 2>&1
          code=$?
          python - "$RUNNER_TEMP/recipe-python.log" "$code" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          code = int(sys.argv[2])
          match = re.search(r'Ran\s+(\d+)\s+tests?', text)
          count = int(match.group(1)) if match else 0
          passed = code == 0 and count == 12 and re.search(r'(?:^|\n)OK(?:\s|\n|$)', text) is not None
          print(f'RECIPE_FOCUSED_PYTHON status={"PASS" if passed else "FAIL"} count={count}/12')
          raise SystemExit(0 if passed else 1)
          PY

      - name: Enforce focused Recipe Node 8 of 8
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          node --test prototypes/trainingos-agent-mvp-v1/recipe-runtime.test.mjs \
            > "$RUNNER_TEMP/recipe-node.log" 2>&1
          code=$?
          python - "$RUNNER_TEMP/recipe-node.log" "$code" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          code = int(sys.argv[2])
          tests = re.search(r'# tests\s+(\d+)', text)
          passed = re.search(r'# pass\s+(\d+)', text)
          failed = re.search(r'# fail\s+(\d+)', text)
          count = int(tests.group(1)) if tests else 0
          pass_count = int(passed.group(1)) if passed else 0
          fail_count = int(failed.group(1)) if failed else -1
          ok = code == 0 and count == 8 and pass_count == 8 and fail_count == 0
          print(f'RECIPE_FOCUSED_NODE status={"PASS" if ok else "FAIL"} pass={pass_count}/{count} fail={fail_count}')
          raise SystemExit(0 if ok else 1)
          PY

      - name: Enforce Recipe JavaScript syntax
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          {
            node --check packages/training-recipe/src/compiler.mjs
            node --check packages/training-recipe/src/adapters.mjs
            node --check lib/trainingos-agent-gateway/recipe-runtime.mjs
            node --check lib/trainingos-agent-gateway/recipe-mcp-layer.mjs
          } > "$RUNNER_TEMP/recipe-syntax.log" 2>&1
          code=$?
          echo "RECIPE_SYNTAX status=$([[ "$code" == 0 ]] && echo PASS || echo FAIL)"
          exit "$code"

      - name: Remove focused private checkout and sealed logs
        if: always()
        shell: bash
        run: rm -rf private-repo "$RUNNER_TEMP/recipe-python.log" "$RUNNER_TEMP/recipe-node.log" "$RUNNER_TEMP/recipe-syntax.log"

  repository-owned-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate exact SHA and private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ -n "$PRIVATE_TOKEN" ]] || exit 2

      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact private head
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]] || exit 3

      - name: Enforce repository-owned CI
        working-directory: private-repo
        shell: bash
        env:
          TRAININGOS_CI_INSTALL: always
          TRAININGOS_CI_INCLUDE_PLAYWRIGHT: '0'
          TRAININGOS_CI_OUTPUT_DIR: ${{ github.workspace }}/private-repo/.trainingos-ci
          REPORT: ${{ github.workspace }}/private-repo/.trainingos-ci/owned-container-ci-report.json
        run: |
          set +e
          npm run ci:owned > "$RUNNER_TEMP/recipe-owned.log" 2>&1
          code=$?
          OWNED_CODE="$code" node <<'NODE'
          const fs = require('node:fs');
          let status = process.env.OWNED_CODE === '0' ? 'PASS' : 'FAIL';
          let last = 'report-unavailable';
          try {
            if (fs.existsSync(process.env.REPORT)) {
              const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
              status = report.status === 'PASS' && process.env.OWNED_CODE === '0' ? 'PASS' : 'FAIL';
              last = String(report.failedOrLastStep || 'unknown');
            }
          } catch {
            status = 'FAIL';
            last = 'invalid-sanitized-report';
          }
          console.log(`RECIPE_OWNED_CI status=${status} step=${last} sha=${process.env.PRIVATE_SHA}`);
          NODE
          exit "$code"

      - name: Remove owned-CI private checkout and sealed log
        if: always()
        shell: bash
        run: rm -rf private-repo "$RUNNER_TEMP/recipe-owned.log"
