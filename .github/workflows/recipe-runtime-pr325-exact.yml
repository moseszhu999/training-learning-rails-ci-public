name: Recipe Runtime PR325 exact-head CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: recipe-runtime-pr325-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PRIVATE_SHA: 028871119c5cbf68923308b4478ca7438348457b

jobs:
  sql-e2e-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Validate exact SHA and private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ -n "$PRIVATE_TOKEN" ]] || exit 2

      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Prepare canonical prerequisite migration set
        shell: bash
        run: |
          set -euo pipefail
          mkdir replay-project
          cd replay-project
          supabase init
          rm -rf supabase/migrations
          mkdir -p supabase/migrations
          cp ../private-repo/tests/sql/trainingos_agent_recipe_prerequisite_harness.sql \
            supabase/migrations/00000000000000_trainingos_agent_recipe_prerequisite_harness.sql
          for migration in \
            20260714_jhc_source_bundle_reference_assets.sql \
            20260719233000_trainingos_agent_devices.sql \
            20260724153000_trainingos_agent_execution_envelope.sql \
            20260724154500_trainingos_agent_execution_envelope_hardening.sql \
            20260724160000_trainingos_agent_execution_progress.sql \
            20260727240000_trainingos_persistent_teacher_agent_schema_v1.sql \
            20260727240100_trainingos_persistent_teacher_agent_policy_rpc_v1.sql \
            20260728120000_trainingos_agent_recipe_schema_v1.sql \
            20260728120100_trainingos_agent_recipe_management_v1.sql \
            20260728120200_trainingos_agent_recipe_execution_v1.sql \
            20260728120300_trainingos_agent_recipe_security_hardening_v1.sql \
            20260728120400_trainingos_agent_recipe_actor_access_hardening_v1.sql \
            20260728120500_trainingos_agent_recipe_trigger_entry_guard_v1.sql \
            20260728120600_trainingos_agent_recipe_source_digest_guard_v1.sql \
            20260728120700_trainingos_agent_recipe_executor_provenance_v1.sql
          do
            cp "../private-repo/supabase/migrations/$migration" "supabase/migrations/$migration"
          done
          rm -f supabase/seed.sql

      - name: Start canonical prerequisite database
        working-directory: replay-project
        shell: bash
        run: supabase start > "$RUNNER_TEMP/recipe-canonical-start.log" 2>&1

      - name: Capture sanitized transactional SQL E2E result
        id: e2e
        working-directory: replay-project
        shell: bash
        run: |
          set +e
          eval "$(supabase status -o env | grep '^DB_URL=')"
          psql "$DB_URL" -X -qAt -1 -v ON_ERROR_STOP=1 \
            -f ../private-repo/tests/sql/trainingos_agent_recipe_runtime_e2e.sql \
            > "$RUNNER_TEMP/recipe-sql-e2e.log" 2>&1
          code=$?
          CODE="$code" PRIVATE_SHA="$PRIVATE_SHA" python - "$RUNNER_TEMP/recipe-sql-e2e.log" "$RUNNER_TEMP/recipe-sql-e2e-diagnostic.json" <<'PY'
          import hashlib, json, os, pathlib, re, sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          payloads=[]
          for line in text.splitlines():
              line=line.strip()
              if line.startswith('{'):
                  try: payloads.append(json.loads(line))
                  except json.JSONDecodeError: pass
          result=payloads[-1] if payloads else {}
          residue=result.get('residue') or {}
          cleanup=bool(residue) and all(int(value)==0 for value in residue.values())
          expected=(result.get('status')=='PASS'
              and result.get('canonicalExecutionReused') is True
              and result.get('canonicalExecutionCount')==1
              and result.get('triggerReceiptCount')==2
              and result.get('formalWritePerformed') is False
              and result.get('badSourceDigestDenied') is True
              and result.get('humanInitialTriggerDenied') is True
              and result.get('humanReplayDenied') is True
              and result.get('changedExecutorProvenanceDenied') is True
              and cleanup)
          custom=re.findall(r'ERROR:\s+([A-Z][A-Z0-9_]+)',text)
          relation=re.findall(r'relation\s+["\']([^"\']+)["\']\s+does not exist',text,re.I)
          column=re.findall(r'column\s+["\']?([a-zA-Z0-9_.]+)["\']?\s+does not exist',text,re.I)
          function=re.findall(r'function\s+([a-zA-Z0-9_.]+)\([^\n]*does not exist',text,re.I)
          if int(os.environ['CODE'])==0 and expected: error_class=None
          elif custom: error_class='custom_recipe_assertion'
          elif relation: error_class='missing_relation'
          elif column: error_class='missing_column'
          elif function: error_class='missing_function'
          elif 'violates not-null constraint' in text.lower(): error_class='not_null_violation'
          elif 'violates check constraint' in text.lower(): error_class='check_violation'
          elif 'violates foreign key constraint' in text.lower(): error_class='foreign_key_violation'
          elif int(os.environ['CODE'])==0: error_class='evidence_mismatch'
          else: error_class='unknown_sql_e2e_failure'
          missing=(relation or column or function or [None])[-1]
          tail='\n'.join(text.splitlines()[-80:])
          diagnostic={
              'schemaVersion':'trainingos-recipe-sql-e2e-result-v3',
              'privateSha':os.environ['PRIVATE_SHA'],
              'status':'PASS' if int(os.environ['CODE'])==0 and expected else 'FAIL',
              'exitCode':int(os.environ['CODE']),
              'errorClass':error_class,
              'missingObject':missing,
              'customErrorToken':custom[-1] if custom else None,
              'canonicalExecutionCount':result.get('canonicalExecutionCount',0),
              'triggerReceiptCount':result.get('triggerReceiptCount',0),
              'cleanup':'PASS' if cleanup else 'FAIL',
              'tailFingerprint':hashlib.sha256(tail.encode()).hexdigest(),
              'rawOutputPublished':False,
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(diagnostic,indent=2)+'\n',encoding='utf-8')
          print('RECIPE_SQL_E2E status=%s class=%s object=%s token=%s execution=%s receipts=%s cleanup=%s' % (
              diagnostic['status'],diagnostic['errorClass'] or 'none',diagnostic['missingObject'] or 'none',
              diagnostic['customErrorToken'] or 'none',diagnostic['canonicalExecutionCount'],
              diagnostic['triggerReceiptCount'],diagnostic['cleanup']))
          raise SystemExit(0 if diagnostic['status']=='PASS' else 1)
          PY
          parser_code=$?
          echo "code=$parser_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload sanitized SQL E2E result
        uses: actions/upload-artifact@v4
        with:
          name: recipe-pr325-sql-e2e-result-v3
          path: ${{ runner.temp }}/recipe-sql-e2e-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce transactional SQL E2E result
        env:
          E2E_CODE: ${{ steps.e2e.outputs.code }}
        run: test "${E2E_CODE:-1}" = 0

      - name: Stop isolated database and remove sealed logs
        if: always()
        working-directory: replay-project
        shell: bash
        run: |
          supabase stop --no-backup || true
          rm -f "$RUNNER_TEMP/recipe-canonical-start.log" "$RUNNER_TEMP/recipe-sql-e2e.log" \
            "$RUNNER_TEMP/recipe-sql-e2e-diagnostic.json"
          rm -rf ../private-repo
