name: Recipe Runtime PR325 exact-head CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: recipe-runtime-pr325-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PRIVATE_SHA: 0e9052c142fe8a55d238b648f414caf04f107605

jobs:
  migration-order-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate exact SHA and private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ -n "$PRIVATE_TOKEN" ]] || exit 2

      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Build filename-only migration manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('private-repo/supabase/migrations')
          names = sorted(path.name for path in root.glob('*.sql'))
          payload = {
              'schemaVersion': 'trainingos-private-migration-order-v1',
              'privateSha': '0e9052c142fe8a55d238b648f414caf04f107605',
              'migrationCount': len(names),
              'filenames': names,
              'sqlContentPublished': False,
          }
          pathlib.Path('/tmp/recipe-migration-order.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(f'RECIPE_MIGRATION_ORDER status=PASS count={len(names)} first={names[0] if names else "none"} last={names[-1] if names else "none"}')
          PY

      - name: Upload filename-only migration manifest
        uses: actions/upload-artifact@v4
        with:
          name: recipe-pr325-migration-order
          path: /tmp/recipe-migration-order.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf private-repo /tmp/recipe-migration-order.json
