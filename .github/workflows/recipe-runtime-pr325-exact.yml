name: Recipe Runtime PR325 exact-head CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: recipe-runtime-pr325-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PRIVATE_SHA: 8670b6cbc20154985c51e344cdd83eece6997e17

jobs:
  focused-current-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate exact SHA and private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ -n "$PRIVATE_TOKEN" ]] || exit 2

      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact private head
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]] || exit 3

      - name: Enforce focused Recipe Python 21 of 21
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          python -m unittest -v \
            tests/test_trainingos_agent_recipe_contract.py \
            tests/test_trainingos_agent_recipe_review_contract.py \
            > "$RUNNER_TEMP/recipe-python.log" 2>&1
          code=$?
          python - "$RUNNER_TEMP/recipe-python.log" "$code" <<'PY'
          import pathlib, re, sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          match=re.search(r'Ran\s+(\d+)\s+tests?',text)
          count=int(match.group(1)) if match else 0
          ok=int(sys.argv[2])==0 and count==21 and re.search(r'(?:^|\n)OK(?:\s|\n|$)',text) is not None
          print(f'RECIPE_FOCUSED_PYTHON status={"PASS" if ok else "FAIL"} count={count}/21')
          raise SystemExit(0 if ok else 1)
          PY

      - name: Enforce focused Recipe Node 11 of 11
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          node --test \
            prototypes/trainingos-agent-mvp-v1/recipe-runtime.test.mjs \
            prototypes/trainingos-agent-mvp-v1/recipe-review-runtime.test.mjs \
            > "$RUNNER_TEMP/recipe-node.log" 2>&1
          code=$?
          python - "$RUNNER_TEMP/recipe-node.log" "$code" <<'PY'
          import pathlib, re, sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          tests=re.search(r'# tests\s+(\d+)',text)
          passed=re.search(r'# pass\s+(\d+)',text)
          failed=re.search(r'# fail\s+(\d+)',text)
          count=int(tests.group(1)) if tests else 0
          pass_count=int(passed.group(1)) if passed else 0
          fail_count=int(failed.group(1)) if failed else -1
          ok=int(sys.argv[2])==0 and count==11 and pass_count==11 and fail_count==0
          print(f'RECIPE_FOCUSED_NODE status={"PASS" if ok else "FAIL"} pass={pass_count}/{count} fail={fail_count}')
          raise SystemExit(0 if ok else 1)
          PY

      - name: Enforce Recipe JavaScript syntax
        working-directory: private-repo
        shell: bash
        run: |
          node --check packages/training-recipe/src/compiler.mjs > "$RUNNER_TEMP/recipe-syntax.log" 2>&1
          node --check packages/training-recipe/src/review-hardening.mjs >> "$RUNNER_TEMP/recipe-syntax.log" 2>&1
          node --check packages/training-recipe/src/adapters.mjs >> "$RUNNER_TEMP/recipe-syntax.log" 2>&1
          node --check lib/trainingos-agent-gateway/recipe-runtime.mjs >> "$RUNNER_TEMP/recipe-syntax.log" 2>&1
          node --check lib/trainingos-agent-gateway/recipe-runtime-review.mjs >> "$RUNNER_TEMP/recipe-syntax.log" 2>&1
          node --check lib/trainingos-agent-gateway/recipe-mcp-layer.mjs >> "$RUNNER_TEMP/recipe-syntax.log" 2>&1
          echo 'RECIPE_SYNTAX status=PASS files=6'

      - name: Remove private checkout and sealed logs
        if: always()
        shell: bash
        run: rm -rf private-repo "$RUNNER_TEMP/recipe-python.log" "$RUNNER_TEMP/recipe-node.log" "$RUNNER_TEMP/recipe-syntax.log"

  canonical-replay-and-sql-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Validate exact SHA and private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ -n "$PRIVATE_TOKEN" ]] || exit 2

      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Prepare canonical prerequisite migration set
        shell: bash
        run: |
          set -euo pipefail
          mkdir replay-project
          cd replay-project
          supabase init
          rm -rf supabase/migrations
          mkdir -p supabase/migrations
          cp ../private-repo/tests/sql/trainingos_agent_recipe_prerequisite_harness.sql \
            supabase/migrations/00000000000000_trainingos_agent_recipe_prerequisite_harness.sql
          for migration in \
            20260714_jhc_source_bundle_reference_assets.sql \
            20260719233000_trainingos_agent_devices.sql \
            20260724153000_trainingos_agent_execution_envelope.sql \
            20260724154500_trainingos_agent_execution_envelope_hardening.sql \
            20260724160000_trainingos_agent_execution_progress.sql \
            20260727240000_trainingos_persistent_teacher_agent_schema_v1.sql \
            20260727240100_trainingos_persistent_teacher_agent_policy_rpc_v1.sql \
            20260728120000_trainingos_agent_recipe_schema_v1.sql \
            20260728120100_trainingos_agent_recipe_management_v1.sql \
            20260728120200_trainingos_agent_recipe_execution_v1.sql \
            20260728120300_trainingos_agent_recipe_security_hardening_v1.sql \
            20260728120400_trainingos_agent_recipe_actor_access_hardening_v1.sql \
            20260728120500_trainingos_agent_recipe_trigger_entry_guard_v1.sql \
            20260728120600_trainingos_agent_recipe_source_digest_guard_v1.sql \
            20260728120700_trainingos_agent_recipe_executor_provenance_v1.sql \
            20260728120800_trainingos_agent_recipe_review_hardening_v1.sql \
            20260728120900_trainingos_agent_recipe_create_idempotency_guard_v1.sql
          do
            cp "../private-repo/supabase/migrations/$migration" "supabase/migrations/$migration"
          done
          rm -f supabase/seed.sql
          count="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          test "$count" = 18
          echo "RECIPE_CANONICAL_REPLAY_PREP status=PASS migrations=$count sha=$PRIVATE_SHA"

      - name: First canonical prerequisite replay
        working-directory: replay-project
        shell: bash
        run: |
          set +e
          supabase start > "$RUNNER_TEMP/recipe-canonical-first.log" 2>&1
          code=$?
          applied="$(grep -c 'Applying migration ' "$RUNNER_TEMP/recipe-canonical-first.log" || true)"
          last="$(grep 'Applying migration ' "$RUNNER_TEMP/recipe-canonical-first.log" | tail -1 | sed 's/.*Applying migration //' || true)"
          echo "RECIPE_CANONICAL_FIRST status=$([[ "$code" == 0 ]] && echo PASS || echo FAIL) applied=$applied last=${last:-none}"
          exit "$code"

      - name: Second deterministic canonical replay
        working-directory: replay-project
        shell: bash
        run: |
          set +e
          supabase db reset --local > "$RUNNER_TEMP/recipe-canonical-second.log" 2>&1
          code=$?
          applied="$(grep -c 'Applying migration ' "$RUNNER_TEMP/recipe-canonical-second.log" || true)"
          last="$(grep 'Applying migration ' "$RUNNER_TEMP/recipe-canonical-second.log" | tail -1 | sed 's/.*Applying migration //' || true)"
          echo "RECIPE_CANONICAL_SECOND status=$([[ "$code" == 0 ]] && echo PASS || echo FAIL) applied=$applied last=${last:-none}"
          exit "$code"

      - name: Run transactional Recipe SQL E2E
        working-directory: replay-project
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep '^DB_URL=')"
          psql "$DB_URL" -X -qAt -1 -v ON_ERROR_STOP=1 \
            -f ../private-repo/tests/sql/trainingos_agent_recipe_runtime_e2e.sql \
            > "$RUNNER_TEMP/recipe-sql-e2e.log" 2>&1
          python - "$RUNNER_TEMP/recipe-sql-e2e.log" <<'PY'
          import json, pathlib, sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          payloads=[]
          for line in text.splitlines():
              line=line.strip()
              if line.startswith('{'):
                  try: payloads.append(json.loads(line))
                  except json.JSONDecodeError: pass
          result=payloads[-1] if payloads else {}
          residue=result.get('residue') or {}
          cleanup=bool(residue) and all(int(value)==0 for value in residue.values())
          ok=(result.get('status')=='PASS'
              and result.get('canonicalExecutionReused') is True
              and result.get('canonicalExecutionCount')==1
              and result.get('triggerReceiptCount')==2
              and result.get('formalWritePerformed') is False
              and result.get('badSourceDigestDenied') is True
              and result.get('humanInitialTriggerDenied') is True
              and result.get('humanReplayDenied') is True
              and result.get('changedExecutorProvenanceDenied') is True
              and cleanup)
          print('RECIPE_SQL_E2E status=%s execution=%s receipts=%s cleanup=%s' % (
              'PASS' if ok else 'FAIL',result.get('canonicalExecutionCount',0),
              result.get('triggerReceiptCount',0),'PASS' if cleanup else 'FAIL'))
          raise SystemExit(0 if ok else 1)
          PY

      - name: Stop isolated database and remove sealed logs
        if: always()
        working-directory: replay-project
        shell: bash
        run: |
          supabase stop --no-backup || true
          rm -f "$RUNNER_TEMP/recipe-canonical-first.log" "$RUNNER_TEMP/recipe-canonical-second.log" \
            "$RUNNER_TEMP/recipe-sql-e2e.log"
          rm -rf ../private-repo
