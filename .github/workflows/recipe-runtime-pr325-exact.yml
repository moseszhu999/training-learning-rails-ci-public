name: Recipe Runtime PR325 exact-head CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: recipe-runtime-pr325-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PRIVATE_SHA: 0e9052c142fe8a55d238b648f414caf04f107605

jobs:
  migration-replay-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Validate exact SHA and private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ -n "$PRIVATE_TOKEN" ]] || exit 2

      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Prepare isolated Supabase project
        shell: bash
        run: |
          set -euo pipefail
          mkdir replay-project
          cd replay-project
          supabase init
          rm -rf supabase/migrations
          cp -R ../private-repo/supabase/migrations supabase/migrations
          rm -f supabase/seed.sql

      - name: Capture sanitized fresh replay diagnosis
        id: replay
        working-directory: replay-project
        shell: bash
        run: |
          set +e
          supabase start > "$RUNNER_TEMP/recipe-db-diagnostic.log" 2>&1
          code=$?
          CODE="$code" PRIVATE_SHA="$PRIVATE_SHA" python - "$RUNNER_TEMP/recipe-db-diagnostic.log" "$RUNNER_TEMP/recipe-db-diagnostic.json" <<'PY'
          import hashlib, json, os, pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          code = int(os.environ['CODE'])
          applied = re.findall(r'Applying migration\s+([^\s]+)', text)
          last = applied[-1] if applied else None
          lower = text.lower()
          if code == 0:
              error_class = None
          elif 'duplicate key value violates unique constraint' in lower and 'schema_migrations' in lower:
              error_class = 'duplicate_migration_version'
          elif 'invalid migration' in lower or 'migration filename' in lower:
              error_class = 'invalid_migration_filename'
          elif 'error running container' in lower or 'docker daemon' in lower:
              error_class = 'container_runtime'
          elif 'health check' in lower or 'unhealthy' in lower:
              error_class = 'service_health'
          elif re.search(r'\berror:\s', lower):
              error_class = 'migration_sql_error'
          else:
              error_class = 'unknown_start_failure'
          sqlstate = None
          for pattern in [r'SQLSTATE[=: ]+([0-9A-Z]{5})', r'\(([0-9A-Z]{5})\)']:
              match = re.search(pattern, text, flags=re.I)
              if match:
                  sqlstate = match.group(1).upper()
                  break
          tail = '\n'.join(text.splitlines()[-80:])
          payload = {
              'schemaVersion': 'trainingos-recipe-db-replay-diagnostic-v1',
              'privateSha': os.environ['PRIVATE_SHA'],
              'status': 'PASS' if code == 0 else 'FAIL',
              'exitCode': code,
              'appliedCount': len(applied),
              'lastMigration': last,
              'recipeMigrationReached': bool(last and last.startswith('2026072812')),
              'errorClass': error_class,
              'sqlstate': sqlstate,
              'tailFingerprint': hashlib.sha256(tail.encode()).hexdigest(),
              'rawOutputPublished': False,
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print('RECIPE_DB_DIAGNOSTIC status=%s applied=%s last=%s recipe_reached=%s class=%s sqlstate=%s fingerprint=%s' % (
              payload['status'], payload['appliedCount'], payload['lastMigration'] or 'none',
              payload['recipeMigrationReached'], payload['errorClass'] or 'none', payload['sqlstate'] or 'none',
              payload['tailFingerprint']))
          PY
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload sanitized replay diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: recipe-pr325-db-replay-diagnostic
          path: ${{ runner.temp }}/recipe-db-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce fresh replay result
        shell: bash
        env:
          REPLAY_CODE: ${{ steps.replay.outputs.code }}
        run: test "${REPLAY_CODE:-1}" = 0

      - name: Stop isolated database and remove sealed logs
        if: always()
        working-directory: replay-project
        shell: bash
        run: |
          supabase stop --no-backup || true
          rm -f "$RUNNER_TEMP/recipe-db-diagnostic.log" "$RUNNER_TEMP/recipe-db-diagnostic.json"
          rm -rf ../private-repo
