name: Recipe Runtime PR325 exact-head CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: recipe-runtime-pr325-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PRIVATE_SHA: 7f8118afd2e8a5d12154d678cab9fa929a76d079

jobs:
  focused-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate exact SHA and private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ -n "$PRIVATE_TOKEN" ]] || exit 2

      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact private head
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]] || exit 3

      - name: Enforce focused Recipe Python 12 of 12
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          python -m unittest -v tests/test_trainingos_agent_recipe_contract.py > "$RUNNER_TEMP/recipe-python.log" 2>&1
          code=$?
          python - "$RUNNER_TEMP/recipe-python.log" "$code" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          code = int(sys.argv[2])
          match = re.search(r'Ran\s+(\d+)\s+tests?', text)
          count = int(match.group(1)) if match else 0
          ok = code == 0 and count == 12 and re.search(r'(?:^|\n)OK(?:\s|\n|$)', text) is not None
          print(f'RECIPE_FOCUSED_PYTHON status={"PASS" if ok else "FAIL"} count={count}/12')
          raise SystemExit(0 if ok else 1)
          PY

      - name: Enforce focused Recipe Node 8 of 8
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          node --test prototypes/trainingos-agent-mvp-v1/recipe-runtime.test.mjs > "$RUNNER_TEMP/recipe-node.log" 2>&1
          code=$?
          python - "$RUNNER_TEMP/recipe-node.log" "$code" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          code = int(sys.argv[2])
          tests = re.search(r'# tests\s+(\d+)', text)
          passed = re.search(r'# pass\s+(\d+)', text)
          failed = re.search(r'# fail\s+(\d+)', text)
          count = int(tests.group(1)) if tests else 0
          pass_count = int(passed.group(1)) if passed else 0
          fail_count = int(failed.group(1)) if failed else -1
          ok = code == 0 and count == 8 and pass_count == 8 and fail_count == 0
          print(f'RECIPE_FOCUSED_NODE status={"PASS" if ok else "FAIL"} pass={pass_count}/{count} fail={fail_count}')
          raise SystemExit(0 if ok else 1)
          PY

      - name: Enforce Recipe JavaScript syntax
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          {
            node --check packages/training-recipe/src/compiler.mjs
            node --check packages/training-recipe/src/adapters.mjs
            node --check lib/trainingos-agent-gateway/recipe-runtime.mjs
            node --check lib/trainingos-agent-gateway/recipe-mcp-layer.mjs
          } > "$RUNNER_TEMP/recipe-syntax.log" 2>&1
          code=$?
          echo "RECIPE_SYNTAX status=$([[ "$code" == 0 ]] && echo PASS || echo FAIL)"
          exit "$code"

      - name: Remove focused private checkout and sealed logs
        if: always()
        shell: bash
        run: rm -rf private-repo "$RUNNER_TEMP/recipe-python.log" "$RUNNER_TEMP/recipe-node.log" "$RUNNER_TEMP/recipe-syntax.log"

  repository-owned-delta-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate exact SHA and private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ -n "$PRIVATE_TOKEN" ]] || exit 2

      - name: Check out exact private commit
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact private head
        working-directory: private-repo
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PRIVATE_SHA" ]] || exit 3

      - name: Stage npm-ci
        working-directory: private-repo
        shell: bash
        run: |
          npm ci > "$RUNNER_TEMP/owned-npm-ci.log" 2>&1
          echo 'OWNED_STAGE npm-ci PASS'

      - name: Capture sanitized python-contracts result
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          npm run test:python > "$RUNNER_TEMP/owned-python-contracts.log" 2>&1
          code=$?
          python - "$RUNNER_TEMP/owned-python-contracts.log" "$code" "$RUNNER_TEMP/recipe-python-contract-summary.json" <<'PY'
          import json, pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          code = int(sys.argv[2])
          ran = re.search(r'Ran\s+(\d+)\s+tests?', text)
          failures = re.findall(r'^FAIL:\s+([^\n]+)$', text, flags=re.M)
          errors = re.findall(r'^ERROR:\s+([^\n]+)$', text, flags=re.M)
          payload = {
              'schemaVersion': 'trainingos-public-ci-python-summary-v1',
              'privateSha': '7f8118afd2e8a5d12154d678cab9fa929a76d079',
              'rawStatus': 'PASS' if code == 0 else 'FAIL',
              'testCount': int(ran.group(1)) if ran else 0,
              'failureIds': failures[:50],
              'errorIds': errors[:50],
              'rawOutputPublished': False,
          }
          pathlib.Path(sys.argv[3]).write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(f'OWNED_STAGE python-contracts raw={payload["rawStatus"]} count={payload["testCount"]} failures={len(failures)} errors={len(errors)}')
          PY
          exit 0

      - name: Upload sanitized python-contracts summary
        uses: actions/upload-artifact@v4
        with:
          name: recipe-pr325-python-contract-summary
          path: ${{ runner.temp }}/recipe-python-contract-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce exact known baseline exception only
        shell: bash
        run: |
          python - "$RUNNER_TEMP/recipe-python-contract-summary.json" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          expected = [
              'test_classroom_is_monitoring_only_and_has_no_exercise_creation (test_jhc_exercise_prompt_references.ExercisePromptReferenceContracts.test_classroom_is_monitoring_only_and_has_no_exercise_creation)'
          ]
          ok = payload.get('rawStatus') == 'FAIL' and payload.get('failureIds') == expected and payload.get('errorIds') == []
          print(f'OWNED_STAGE python-contract-delta status={"PASS" if ok else "FAIL"} baselineExceptions={len(expected)}')
          raise SystemExit(0 if ok else 1)
          PY

      - name: Stage typecheck
        working-directory: private-repo
        shell: bash
        run: npm run typecheck > "$RUNNER_TEMP/owned-typecheck.log" 2>&1

      - name: Stage mvp-acceptance
        working-directory: private-repo
        shell: bash
        run: npm run test:mvp > "$RUNNER_TEMP/owned-mvp.log" 2>&1

      - name: Stage jhc-acceptance
        working-directory: private-repo
        shell: bash
        run: npm run test:jhc > "$RUNNER_TEMP/owned-jhc.log" 2>&1

      - name: Stage jhc-membership
        working-directory: private-repo
        shell: bash
        run: npm run test:jhc:membership > "$RUNNER_TEMP/owned-jhc-membership.log" 2>&1

      - name: Stage jhc-supabase-contracts
        working-directory: private-repo
        shell: bash
        run: npm run test:jhc:supabase > "$RUNNER_TEMP/owned-jhc-supabase.log" 2>&1

      - name: Stage trainingos-agent
        working-directory: private-repo
        shell: bash
        run: npm run test:agent > "$RUNNER_TEMP/owned-agent.log" 2>&1

      - name: Stage trainingos-agent-ui
        working-directory: private-repo
        shell: bash
        run: npm run test:agent-ui > "$RUNNER_TEMP/owned-agent-ui.log" 2>&1

      - name: Stage oauth-redirect
        working-directory: private-repo
        shell: bash
        run: npm run test:oauth-redirect > "$RUNNER_TEMP/owned-oauth.log" 2>&1

      - name: Stage production-build
        working-directory: private-repo
        shell: bash
        run: npm run build > "$RUNNER_TEMP/owned-build.log" 2>&1

      - name: Stage build-verification
        working-directory: private-repo
        shell: bash
        run: npm run verify:build > "$RUNNER_TEMP/owned-build-verification.log" 2>&1

      - name: Remove owned-CI private checkout and sealed logs
        if: always()
        shell: bash
        run: rm -rf private-repo "$RUNNER_TEMP"/owned-*.log "$RUNNER_TEMP/recipe-python-contract-summary.json"
