name: PR339 bootstrap classification v3

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr339-bootstrap-classification-v3.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIVATE_SHA: dddfec403fad343ce22af1c61dc1b7c5e1ad6215
  BASE_SHA: e15dbe5d1e6513c8b1816d61c8e0978fdaebaae0

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      exit_code: ${{ steps.probe.outputs.exit_code }}
      category: ${{ steps.probe.outputs.category }}
      migration_version: ${{ steps.probe.outputs.migration_version }}
      sqlstate: ${{ steps.probe.outputs.sqlstate }}
    steps:
      - name: Validate private credential
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRIVATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$PRIVATE_TOKEN" ]]

      - name: Checkout exact private candidate read-only
        uses: actions/checkout@v4
        with:
          repository: moseszhu999/training-learning-rails
          ref: ${{ env.PRIVATE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: private-repo
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Execute sealed bootstrap classification
        id: probe
        working-directory: private-repo
        shell: bash
        run: |
          set +e
          workdir="$RUNNER_TEMP/pr339-classify-v3"
          log="$RUNNER_TEMP/pr339-classify-v3.log"
          rm -rf "$workdir" && mkdir -p "$workdir"

          exact=1; init=1; builder=1; start=1
          actual_sha="$(git rev-parse HEAD 2>/dev/null)"
          merge_base="$(git merge-base "$BASE_SHA" "$PRIVATE_SHA" 2>/dev/null)"
          behind="$(git rev-list --count "$PRIVATE_SHA..$BASE_SHA" 2>/dev/null)"
          [[ "$actual_sha" == "$PRIVATE_SHA" && "$merge_base" == "$BASE_SHA" && "$behind" == 0 ]]
          exact=$?
          if [[ "$exact" == 0 ]]; then
            supabase --workdir "$workdir" init --force --yes > "$log" 2>&1
            init=$?
          fi
          if [[ "$init" == 0 ]]; then
            python scripts/build-trainingos-fresh-bootstrap.py \
              --repo-root "$PWD" \
              --output-dir "$workdir/supabase/migrations" \
              --commit-sha "$PRIVATE_SHA" >> "$log" 2>&1
            builder=$?
          fi
          if [[ "$builder" == 0 ]]; then
            supabase --workdir "$workdir" start --debug >> "$log" 2>&1
            start=$?
          fi

          python - "$log" "$start" "$GITHUB_OUTPUT" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          code=int(sys.argv[2])
          migrations=re.findall(r'Applying migration\s+(\d{14})_[^\s]+',text)
          states=re.findall(r'(?:SQLSTATE|SQL state:|code:)[ =:]+([0-9A-Z]{5})',text,re.I)
          lower=text.lower()
          if code == 0:
              category='SUCCESS'
          elif 'cannot change name of input parameter' in lower:
              category='INPUT_PARAMETER_RENAME'
          elif 'cannot change return type of existing function' in lower:
              category='FUNCTION_RETURN_TYPE_CHANGE'
          elif 'already exists' in lower and 'policy' in lower:
              category='DUPLICATE_POLICY'
          elif 'already exists' in lower and 'trigger' in lower:
              category='DUPLICATE_TRIGGER'
          elif 'already exists' in lower and 'constraint' in lower:
              category='DUPLICATE_CONSTRAINT'
          elif 'already exists' in lower and ('relation' in lower or 'table' in lower or 'index' in lower):
              category='DUPLICATE_RELATION'
          elif 'already exists' in lower and ('function' in lower or 'procedure' in lower):
              category='DUPLICATE_FUNCTION'
          elif 'duplicate' in lower or 'already exists' in lower:
              category='DUPLICATE_OBJECT'
          else:
              category='BOOTSTRAP_FAILURE'
          with open(sys.argv[3],'a',encoding='utf-8') as out:
              out.write(f'exit_code={code}\n')
              out.write(f'category={category}\n')
              out.write(f'migration_version={migrations[-1] if migrations else "NONE"}\n')
              out.write(f'sqlstate={states[-1] if states else "NONE"}\n')
          PY

          {
            echo "exact_code=$exact"
            echo "init_code=$init"
            echo "builder_code=$builder"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Cleanup sealed bootstrap output
        if: always()
        shell: bash
        run: |
          supabase --workdir "$RUNNER_TEMP/pr339-classify-v3" stop --no-backup >/dev/null 2>&1 || true
          rm -rf private-repo "$RUNNER_TEMP"/pr339-classify-v3*

  sanitized-disposition:
    if: always()
    needs: classify
    name: bootstrap-${{ needs.classify.outputs.exit_code }}-${{ needs.classify.outputs.category }}-${{ needs.classify.outputs.migration_version }}-${{ needs.classify.outputs.sqlstate }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "bounded_bootstrap_classification=published" >> "$GITHUB_STEP_SUMMARY"
